# ---------------------------------------------------------------------------
# Ordered candidates (whole-product impact, dependency, reversibility, risk)
# ---------------------------------------------------------------------------

[[candidates]]
rank = 1
path = "apply.body_persist"
reason = "Shared by offline and P2P. Historical apply-critical persist. Reversible if crash-order and body availability stay proven."

[[candidates]]
rank = 2
path = "apply.merkle_witness"
reason = "Shared apply. x86-64 AVX2 already has diagnostic custody; production path still scalar. ARM stays blocked. Depends on no consensus change."

[[candidates]]
rank = 3
path = "p2p.stage"
reason = "P2P cells plus RSS guardrail. Raw-first staging is reversible; decoded-block cache is not a substitute."

[[candidates]]
rank = 4
path = "p2p.request_schedule"
reason = "P2P cells. Count-and-byte window after staging memory is honest. Coupled to staller invariants."

[[candidates]]
rank = 5
path = "class.backend"
reason = "All 36 cells. Cache budget is finally a real lever. Needs per-backend disable-delta, not a config claim."

[[candidates]]
rank = 6
path = "muhash.element_expand"
reason = "MuHash cells only. Ranked after apply/P2P because #41 custody does not exist; listed so it is not forgotten."

