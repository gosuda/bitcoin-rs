# bitcoin-rs product hot-path ledger. Owner: docs/contracts/hot-path-attribution.md.
# Schema is parsed by bin/bitcoin-rs/tests/gates/g18_hot_path_ledger.rs.
schema = "bitcoin-rs-hot-path-ledger-v1"
contract = "docs/contracts/hot-path-attribution.md"

[matrix]
domains = ["offline", "p2p", "muhash"]
corpora = ["c150", "cmodern"]
archs = ["x86_64", "arm64"]
backends = ["fjall", "rocksdb", "redb"]

[cell_defaults]
custody = "none"
residual = "unmeasured"
residual_blocker = "product-cell comparator and corpus custody (#34, #41, #42)"
noise_floor = "unobserved"

# ---------------------------------------------------------------------------
# Interval tree. Exclusive leaves hang off these; they are not addends.
# ---------------------------------------------------------------------------

[[paths]]
id = "cell.wall"
kind = "interval"
name = "whole-run product wall"
parent = ""
concurrency_group = "cell"
domains = ["offline", "p2p", "muhash"]
disposition = "blocked"
evidence = "Primary wall is the comparator interval. No 36-cell custody is in-tree."

[[paths]]
id = "run.lifecycle"
kind = "interval"
name = "process open, apply, checkpoint, shutdown"
parent = "cell.wall"
concurrency_group = "lifecycle"
domains = ["offline", "p2p", "muhash"]
disposition = "blocked"
evidence = "Nested under cell.wall. Inclusive histograms cannot fill it."

[[paths]]
id = "apply.prove_window"
kind = "interval"
name = "prove_window inclusive span"
parent = "run.lifecycle"
concurrency_group = "apply-serial"
domains = ["offline", "p2p"]
histogram = "node.window.verify_seconds"
disposition = "blocked"
evidence = "Encloses parse, overlay, merkle, and script. Not an exclusive leaf."

[[paths]]
id = "apply.commit"
kind = "interval"
name = "per-block commit inclusive span"
parent = "run.lifecycle"
concurrency_group = "apply-serial"
domains = ["offline", "p2p"]
histogram = "node.apply_block.total_seconds"
disposition = "blocked"
evidence = "Encloses contextual checks, UTXO, undo, body, tip publish. Nested."

# ---------------------------------------------------------------------------
# Shared apply exclusive leaves
# ---------------------------------------------------------------------------

[[paths]]
id = "apply.header_accept"
kind = "stage"
name = "header acceptance and contextual softfork/MTP lookup"
parent = "apply.prove_window"
concurrency_group = "apply-serial"
domains = ["offline", "p2p"]
seams = [
  "crates/node/src/apply.rs",
  "crates/chain/src/header_sync.rs",
  "crates/chain/src/bip9_cache.rs",
  "crates/consensus/src/bip9.rs",
  "crates/consensus/src/bip113.rs",
]
histogram = "node.window.context_seconds"
disposition = "blocked"
evidence = "No product-safe disable that preserves consensus. Nested histogram only."

[[paths]]
id = "apply.block_decode"
kind = "stage"
name = "block wire decode and transaction parse/plan construction"
parent = "apply.prove_window"
concurrency_group = "apply-serial"
domains = ["offline", "p2p"]
seams = ["crates/node/src/apply.rs", "crates/consensus/src/kernel.rs"]
histogram = "node.window.parse_seconds"
disposition = "already_bounded"
evidence = "Issue #16 closed decode as a lever unless fresh CPU attribution reopens it. Diagnostic only until product-cell custody exists."

[[paths]]
id = "apply.window_overlay"
kind = "stage"
name = "window prevout overlay and script-check preparation"
parent = "apply.prove_window"
concurrency_group = "apply-serial"
domains = ["offline", "p2p"]
seams = ["crates/node/src/window_overlay.rs", "crates/node/src/apply.rs"]
histogram = "node.window.prepare_seconds"
disposition = "already_bounded"
evidence = "Split apply and window batching already landed. Further marshalling attempts were exhausted on #16."

[[paths]]
id = "apply.merkle_witness"
kind = "stage"
name = "structural, Merkle, and witness validation"
parent = "apply.prove_window"
concurrency_group = "apply-serial"
domains = ["offline", "p2p"]
seams = [
  "crates/consensus/src/verify_block.rs",
  "crates/consensus/src/sha256d64.rs",
]
histogram = "node.apply_block.block_rules_seconds"
disposition = "blocked"
evidence = "No 36-cell exclusive residual. x86-64 AVX2 is an architecture lever (#40), not a cell disable-delta. ARM has no candidate."

[[paths]]
id = "apply.script_verify"
kind = "stage"
name = "script execution in the dedicated verification pool"
parent = "apply.prove_window"
concurrency_group = "script-pool"
domains = ["offline", "p2p"]
seams = ["crates/consensus/src/verify_tx.rs", "crates/node/src/apply.rs"]
histogram = "node.apply_block.script_verify_seconds"
disposition = "already_bounded"
evidence = "Pool width 32 is the measured optimum. Marshalling and prepare micro-optimizations closed. Parallel worker walls must not be summed (concurrency_group script-pool)."

[[paths]]
id = "apply.contextual_checks"
kind = "stage"
name = "contextual consensus checks (PoW, BIP30/34, coinbase maturity, BIP68)"
