concurrency_group = "apply-serial"
domains = ["offline", "p2p"]
seams = [
  "crates/node/src/apply.rs",
  "crates/consensus/src/bip30.rs",
  "crates/consensus/src/bip34.rs",
  "crates/consensus/src/bip68.rs",
]
histogram = "node.apply_block.bip30_bip34_seconds"
disposition = "blocked"
evidence = "No product-safe neutralize. Nested under apply.commit."

