  "crates/utxo/src/connect.rs",
  "crates/utxo/src/record.rs",
  "crates/utxo/src/shard.rs",
]
histogram = "node.apply_block.utxo_commit_seconds"
disposition = "already_bounded"
evidence = "Fan-out and listener paths closed on #16/#19. Remaining layout headroom was bounded as marginal. In-memory commit, not a backend flush."

[[paths]]
