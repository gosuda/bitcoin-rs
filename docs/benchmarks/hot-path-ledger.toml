seams = ["crates/node/src/shutdown.rs", "crates/node/src/run.rs"]
timed_region = "domain-defined"
disposition = "blocked"
evidence = "Offline timed region ends at durable clean shutdown (#46). Untimed reopen validation stays outside the clock (#44)."

