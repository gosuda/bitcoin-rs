\* Coordinated chain transitions and transaction admission.
\* Tool pin: Apalache 0.62.2.  Verification bound K = 128 steps.
\* The configuration carries CONSTANTS, INIT and NEXT only.  Apalache
\* ignores PROPERTY entries in this file, so every property reaches the
\* checker through the command line.
CONSTANTS
EventBudget = 12
JobSlots = 12
MaxAttempts = 4
CounterBound = 1024
FrameBound = 72
FactBound = 36
ReqSlots = 12

INIT Init
NEXT Next
