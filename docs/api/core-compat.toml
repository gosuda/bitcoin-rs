[[rpc]]
method = "estimatesmartfee"
group = "util"
status = "deviation"
deviation = "The estimate comes from this node's mempool rather than Core's block-confirmation estimator, and the optional `errors` array Core returns when it cannot meet `conf_target` is never present -- so a caller cannot distinguish an estimate from a fallback."

[[rpc]]
method = "uptime"
group = "util"
status = "implemented_unverified"

[[rpc]]
method = "getrpcinfo"
group = "util"
status = "deviation"
deviation = "`active_commands` is always an empty array and `logpath` an empty string. This node does not track in-flight RPC calls and does not surface its log path here; Core reports both."

[[rpc]]
method = "getmemoryinfo"
group = "util"
status = "deviation"
deviation = "Only `mode=stats`; `mode=mallocinfo` is refused with -32602 because it requires Core's XML output. The figures are resident set size read from the OS, not Core's locked-pool allocator accounting, so the keys carry a different measurement than the same keys do on Core."

[[rpc]]
method = "estimaterawfee"
group = "util"
status = "deviation"
deviation = "The `short`, `medium` and `long` horizons all carry the same feerate, with `decay` and `scale` reported as fixed constants. Core computes three independent estimates over three windows. The shape is Core's; the three numbers are not three estimates."

