# Bitcoin Core reference record
#
# Only `[reference]` is machine-read: it pins the Bitcoin Core identities
# every claim is made against -- the released product, the kernel tree the
# oracle lane links, the replay corpora, and the formal model checker.
# `bin/bitcoin-rs/tests/support/reference_set.rs` parses and validates them;
# `scripts/provision-ci-reference-fixtures.sh` consumes the release pins;
# `scripts/check_models.py` fingerprints this file into each model-check run.
#
# `[admission_profile]` is policy evidence, not machine-checked input: it
# records the selected settings and explicit non-parity cases that
# `docs/policies/mempool-policy.md` cites in prose.
#
# External-surface compatibility claims do not live here. `REGISTRY` in
# `crates/rpc/src/registry.rs` is their single owner: each row binds one
# surface to one status from the six-state vocabulary in
# `crates/rpc/src/manifest.rs` -- Supported, Deviation, Implemented
# (unverified), Extension, Disabled, Unimplemented -- and only a shipped
# JSON-RPC row also carries a dispatch arm (REST, ZMQ, `Unimplemented` and
# `pending` rows set `handler: None`). `crates/rpc/tests/manifest_coverage.rs`
# renders `docs/rpc-reference.md` from that table, checks it against the
# dispatcher, the REST router and the fixed Core ZMQ topic list, and refuses
# a `Supported` claim while `[reference].differential_harness` below is false.

[reference]
# The development version of the kernel oracle, distinct from the released
# product identity below. The source and package digests pin this snapshot;
# 31.99.0 by itself is only Core's development-version convention.
core_version = "31.99.0"
# Where that revision comes from: the oracle links libbitcoinkernel built
# from this tree. `bitcoinkernel` is the safe wrapper; `libbitcoinkernel-sys`
# vendors the Core source under `bitcoin/`, and its `CMakeLists.txt` carries the
# CLIENT_VERSION above.
kernel_crate = "bitcoinkernel"
kernel_crate_version = "0.3.0"
kernel_sys_crate = "libbitcoinkernel-sys"
kernel_sys_crate_version = "0.4.0"
# Published crate custody: `.cargo_vcs_info.json` identifies the wrapper tree.
# Its subtree squash 84c89f1baa0bb14dca891323c6f5538b7241db44 records this
# bitcoin/bitcoin source commit in `git-subtree-split`.
# https://github.com/sedited/rust-bitcoinkernel/commit/84c89f1baa0bb14dca891323c6f5538b7241db44
kernel_vendor_commit = "2a4a46487903f27883321d7342ae053c5112374a"
kernel_source_commit = "70d9ec7f3d452789d04dce81dc02db0b3b778bb5"
kernel_sys_crate_sha256 = "ccee819dc48af6ce3fb213e6f93bae7a7231cd0689b0435afd86ab167cad5321"
# Set when a differential harness compares *values* against a running reference
# (#78 scope item 2). Still false, and deliberately so: no harness currently
# compares result values or shapes against Core's own declarations, and the
# schema_* deviations recorded on entries below are unenforced documentation.
# A method whose shape matches can still answer a different number.
#
# No entry may claim `supported` while this is false, and the suite enforces it.
differential_harness = false


# ---------------------------------------------------------------------------
# Reference identities
#
# Two distinct identities live under this table, and they must never be
# confused:
#
#   * `[reference.release]` below is the RELEASED Bitcoin Core product,
#     installed from a checksum-pinned tarball. It is the product behavior
#     reference every compatibility claim in this file is ultimately made
#     against -- the same pinned reference the status vocabulary talks about.
#   * the scalar keys above (`core_version = "31.99.0"`, the kernel crates)
#     are the Core development tree this node links for the oracle lane.
#     Oracle evidence only: not a release, and never a policy pin.
#
# A reference carrying only a version label or a digest that does not match is
# rejected by `bin/bitcoin-rs/tests/support/reference_set.rs`. `docs/contracts/reference-set.md` is a
# readable projection; on conflict, this file and that parser govern.
# ---------------------------------------------------------------------------

[reference.release]
# The released product identity. `version_output` is what the pinned
# `bitcoind -version` prints, checked verbatim.
core_version = "31.1"
git_tag = "v31.1"
source_commit = "9be056a8a72b624dae9623b2f7bded92c2a21c91"
archive = "bitcoin-31.1-x86_64-linux-gnu.tar.gz"
archive_sha256 = "b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e"
bitcoind_sha256 = "986e63b3c8770f08d0059820ad3dd085d1ab9e1bea23946c243f858a06888a08"
version_output = "Bitcoin Core daemon version v31.1.0 bitcoind"

# Replay corpora, pinned by stop identity. `manifest_sha256` is produced when
# the corpus archive is exported; until then it stays ABSENT (a placeholder
# digest would be an invented one, so the loader reports the corpus as
# custody-blocked instead). Both corpora below now carry exported digests.

[[reference.corpora]]
id = "C150"
stop_height = 150000
stop_hash = "0000000000000a3290f20e75860d505ce0e948a1d1d846bec7e39015d242884b"
# Exported 2026-09-07 by the pinned bitcoind (digest 986e63b3) into a fresh
# datadir; see the campaign-corpora contract and products.json for canonical
# corpus measurements and terminal-state evidence.
# Canonical manifest identity per CORP-02: the `manifest_sha256` field the
# exporter embeds inside the manifest, NOT the SHA-256 of the manifest file.
manifest_sha256 = "5eff01d897b6f3b39039d1ff7b9b4b0872a7a15463fa516b4cc7bfe7c001b91d"

[[reference.corpora]]
id = "Cmodern"
stop_height = 709635
stop_hash = "00000000000000000001f9ee4f69cbc75ce61db5178175c2ad021fe1df5bad8f"
# Exported 2026-09-09 by the pinned bitcoind (digest 986e63b3); see the
# campaign-corpora contract and products.json for canonical corpus
# measurements and terminal-state evidence.
# Canonical manifest identity per CORP-02: the `manifest_sha256` field the
# exporter embeds inside the manifest, NOT the SHA-256 of the manifest file.
manifest_sha256 = "b87bac6720d1b68acadaa9863b56073ee213f4613e8dfa4a93c4459dc5f017cd"

# The formal model checker, pinned by archive and jar digest. Evidence tool
# only; no checker run is claimed anywhere in this file.

[reference.formal_tool]
name = "apalache-mc"
version = "0.62.2"
archive_sha256 = "7cfadf6e8c04c63f05ac907ec9541c66297005c8cb5efb1731f6a838dfc3fad2"
jar_sha256 = "079b6c2320252469dcf79afec6886b8255d3dd1b34a9484433c88986752efaa8"

# Selected policy evidence and explicit non-parity cases for issue #639.
[admission_profile]
reference_settings = ["-acceptnonstdtxn=0", "-minrelaytxfee=0.00001000", "-incrementalrelayfee=0.00001000", "-dustrelayfee=0.00003000", "-datacarriersize=83"]
process_gate = "overhaul_process_harness::policy_cases"
unsupported = [
  "Aggregate CPFP/package RBF submission: submitpackage returns -32601; Esplora /txs/package returns 404.",
  "Core transient non-optimal SFL diagrams, its randomized work-budget decisions and tie ordering are not emulated by the exact closure solver; adversarial/churn parity remains unverified.",
  "Core allocator-based capacity and rolling minimum fee with block/time decay are not implemented; capacity uses virtual size and the existing pressure heuristic.",
  "Core speculative insert-and-trim failure side effects are not reproduced; candidate refusal is atomic.",
  "Generic consensus/script details, missing-input/max-fee numeric codes and CompactSize-inclusive nulldata accounting retain local behavior."
]
