evidence = "not a goal in the current surface set: IPC compatibility is not pursued (docs/tracing.md not-implemented note); the non-goals forbid cloning Core interfaces or importing Core's ownership model (docs/contracts/ecosystem-compatibility.md ECO-01). Any future IPC is a narrowly scoped adapter, not an architecture template."
