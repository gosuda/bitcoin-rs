# External ecosystem compatibility evidence matrix
#
# The maintained evidence record for
# `docs/contracts/ecosystem-compatibility.md` (`ECO-08`): one row per
# independently tracked compatibility surface, with the columns
# `surface | core_reference | status | representative_consumer | evidence`
# from issue #1122.
#
# This matrix is a different axis from `crates/rpc/core-compat.toml` (Core
# reference identity pins) and `crates/rpc/src/registry.rs` (per-method
# Core-schema status). Those own what the API shape claims against Core;
# this file owns which real external consumers have exercised the surface.
# Neither substitutes for the other.
#
# `status` uses exactly the vocabulary in `ECO-08`:
#
#   implemented             - shipped and in-tree tested; no real external
#                             consumer has exercised it.
#   externally verified     - a real external consumer exercised it and the
#                             run is recorded in `evidence`. Scoped to the
#                             black-box outcomes named there, never to
#                             unlisted behavior of the same surface.
#   partially compatible    - consumable with recorded differences; the
#                             `evidence` field names the deviation owner.
#   intentionally unsupported - out of scope by recorded policy; the
#                             `evidence` field names the non-goal owner.
#   experimental            - present but not a compatibility commitment.
#
# An implementation is NEVER `externally verified` on in-tree tests,
# schema-shape comparison, or self-authored harnesses alone. Rows that name a
# planned consumer in `representative_consumer` describe intent (#1122
# follow-up work); the status still reads `implemented` or weaker until a
# recorded run exists. Tooling that lives in this repository counts as
# external evidence only when it speaks exclusively the documented public
# surface — the live Core peer lane does; in-tree harnesses and log-derived
# counts do not (`ECO-03`, `ECO-09`).

[[row]]
surface = "P2P v1 wire protocol"
core_reference = "Bitcoin Core 31.1 net protocol (docs/policies/p2p-compatibility.md pin)"
status = "externally verified"
representative_consumer = "unmodified Bitcoin Core 31.1 bitcoind (scripts/run-p2p-core-interop.sh)"
evidence = "black-box interop: handshake, IBD sync, relay, disconnect behavior, externally visible chain identity, and proactive inv/headers/cmpctblock announcements across a reorg (docs/contracts/core-differential.md CORE-02/CORE-03/CORE-05; evidence schema bitcoin-rs-core-differential-v3 verified by crates/p2p/tests/core_interop_live.rs). Bounded to those outcomes. Per CORE-03, compact-block reconstruction counters are still derived from internal bitcoin-rs log markers (scripts/run-p2p-core-interop.sh count_marker); per ECO-09 that derivation is diagnostic only and must trend to observable protocol outcomes before it is relied on as a compatibility contract. CORE-05 announcement outcomes are observed directly from P2P frames. The main workflow retains any generated evidence JSON and diagnostic logs for seven days in its core-differential-<run_attempt> artifact, including available partial logs on failure (docs/contracts/core-differential.md)."

[[row]]
surface = "BIP324 / P2P v2 transport"
core_reference = "BIP324"
status = "intentionally unsupported"
representative_consumer = "none"
evidence = "no usable bip324 feature in this checkout (docs/README.md); tracked as future work in issue #1122. Not claimed."

[[row]]
surface = "Compact block relay (BIP152)"
core_reference = "Bitcoin Core 31.1 BIP152"
status = "externally verified"
representative_consumer = "unmodified Bitcoin Core 31.1 bitcoind + scripted wire probe (scripts/run-p2p-core-interop.sh phases A-C)"
evidence = "black-box request/response and relay outcomes only: Core serving responses for compact-block fetches and the raw MSG_CMPCT_BLOCK wire probe (docs/contracts/core-differential.md CORE-03; assert_bip152_relay in crates/p2p/tests/core_interop_live.rs). Reconstruction and getblocktxn-recovery counts are log-derived and excluded from this claim per ECO-09; they remain diagnostic only."

[[row]]
surface = "Compact block filters (BIP157/BIP158)"
core_reference = "BIP157/BIP158"
status = "intentionally unsupported"
representative_consumer = "none"
evidence = "NODE_COMPACT_FILTERS not advertised, filter P2P commands ignored (docs/policies/p2p-compatibility.md section 5 message table)."

[[row]]
surface = "Peer lifecycle and address management"
core_reference = "Bitcoin Core 31.1 net behavior"
status = "partially compatible"
representative_consumer = "unmodified Bitcoin Core 31.1 bitcoind (one lane)"
evidence = "externally observed: handshake, relay, serving, disconnect behavior and chain identity via the live Core lane (docs/contracts/core-differential.md CORE-02/CORE-03). Deliberately absent internals: no address store or gossip, no getaddr response, no proactive block announcements (docs/policies/p2p-compatibility.md section 7 deviation ledger). Peer-visible reorg/restart behavior is owned by internal tests (docs/contracts/p2p-wire.md)."

