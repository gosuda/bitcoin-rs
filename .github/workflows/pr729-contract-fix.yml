name: pr729-contract-fix

on:
  push:
    branches: [validation/pr729-contract-20260910]

permissions:
  contents: write

jobs:
  contract-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f846c7fbeed40e70431cf83ab4f2cb656bf9ea0b
          path: candidate
          fetch-depth: 1
      - name: Apply reviewed documentation and test-traceability changes
        working-directory: candidate
        run: python3 ../runner/.github/review/pr729_contract_fix.py
      - name: Verify source scope and publish source-only branch
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = $'crates/p2p/src/tx_relay.rs\ndocs/contracts/mempool-mutations.md\ndocs/policies/p2p-compatibility.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/p2p/src/tx_relay.rs docs/contracts/mempool-mutations.md docs/policies/p2p-compatibility.md
          git commit -m 'docs(p2p): define admission-qualified local relay'
          git push origin HEAD:refs/heads/followup/local-relay-contract
