name: model-check-manual

# Operator-invoked owner of formal model evidence (issue: K=128 ChainAdmission Safety needs
# ~30h+ at the pinned 4g heap, measured 2026-09-12; no hosted PR/main lane can
# hold it). Runs the solver UNCHANGED at K=128. MANUAL ONLY, no schedule: a
# cron on hosted runners (360-min cap) would fail every run and train everyone
# to ignore the lane. Add a schedule back when a self-hosted/unbounded runner
# exists. Informational: failures never block merges. A run uploads whatever
# evidence it produced as an artifact; it never edits the proof inventory,
# which docs/contracts/formal-verification.md owns.
on:
  workflow_dispatch:
concurrency:
  group: model-check-manual
  cancel-in-progress: false

jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The formal lane runs the pinned solver identity, not whatever
      # python3 a hosted runner happened to ship; typing.TypeIs parity with
      # the comparator lane is not needed here, so 3.11 is the documented
      # floor.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # Keep the major here; the Java row in docs/contracts/formal-verification.md
      # owns the exact version.
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "26"
      - name: Export JDK for formal validation
        run: printf 'JAVA_HOME_25_X64=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Provision pinned Apalache
        run: bash scripts/provision-ci-reference-fixtures.sh formal
      - name: Formal model gate at K=128
        run: |
          set -o pipefail
          rm -rf -- target/apalache
          mkdir -p target/apalache
          printf 'commit=%s\nrun_id=%s\nattempt=%s\nprofile=model-check-manual\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > target/apalache/run-context.txt
          python3 scripts/check_models.py 2>&1 | tee target/apalache/summary.txt
      - name: Preserve manual formal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apalache-manual-${{ github.run_attempt }}
          path: target/apalache/**
          if-no-files-found: warn
          retention-days: 7
