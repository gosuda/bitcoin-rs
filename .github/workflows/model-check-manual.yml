name: model-check-manual

# Operator-invoked formal model evidence workflow. Historical Apalache evidence:
# K=128 ChainAdmission Safety required ~30h+ at the pinned 4g heap, measured
# 2026-09-12. MANUAL ONLY, no schedule. Informational: failures never block
# merges. A run uploads whatever evidence it produced as an artifact; it never
# edits the proof inventory, which docs/contracts/formal-verification.md owns.
on:
  workflow_dispatch:
concurrency:
  group: model-check-manual
  cancel-in-progress: false

jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The formal lane runs the pinned solver identity, not whatever
      # python3 a hosted runner happened to ship; typing.TypeIs parity with
      # the comparator lane is not needed here, so 3.11 is the documented
      # floor.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Keep the major here; the Java row in docs/contracts/formal-verification.md
      # owns the exact version.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Export JDK for formal validation
        run: printf 'JAVA_HOME_25_X64=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Provision pinned Apalache
        run: bash scripts/provision-ci-reference-fixtures.sh formal
      - name: Configured formal model check
        run: |
          set -o pipefail
          rm -rf -- target/apalache
          mkdir -p target/apalache
          printf 'commit=%s\nrun_id=%s\nattempt=%s\nprofile=model-check-manual\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > target/apalache/run-context.txt
          python3 scripts/check_models.py 2>&1 | tee target/apalache/summary.txt
      - name: Preserve manual formal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apalache-manual-${{ github.run_attempt }}
          path: target/apalache/**
          if-no-files-found: warn
          retention-days: 7
