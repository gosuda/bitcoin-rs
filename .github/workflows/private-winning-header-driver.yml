name: Winning header driver verification

on:
  push:
    branches: [stabilize/private-winning-header-driver-20261124]

permissions:
  contents: read

concurrency:
  group: winning-header-driver-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  regenerate:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve consumers and export generated product files
        run: |
          set -euo pipefail
          mkdir -p target/winning-header-driver-proof
          git fetch --no-tags --depth=1 origin 0d79d4f89eeef13ecefd64fa761f5146e52964b2
          cargo metadata --format-version 1 --manifest-path tools/ldk/Cargo.toml > target/winning-header-driver-proof/ldk-metadata.json
          cargo metadata --locked --format-version 1 --manifest-path tools/ldk/Cargo.toml > /dev/null
          cargo metadata --format-version 1 --manifest-path tools/stratum-sv2/template-provider/Cargo.toml > target/winning-header-driver-proof/sv2-metadata.json
          cargo metadata --locked --format-version 1 --manifest-path tools/stratum-sv2/template-provider/Cargo.toml > /dev/null
          git diff --exit-code -- Cargo.lock
          cargo fmt --all
          cargo run --locked -p contract-index
          cargo run --locked -p contract-index -- --check
          git diff --check
          git add -u
          git rm --cached -- .github/workflows/private-winning-header-driver.yml
          printf 'PRODUCT_TREE %s\n' "$(git write-tree)"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const cp = require('node:child_process');
          const paths = cp.execFileSync('git', [
            'diff', '--cached', '--name-only', '-z',
            '0d79d4f89eeef13ecefd64fa761f5146e52964b2',
          ], { encoding: 'utf8' }).split('\0').filter(Boolean);
          for (const path of paths) {
            if (!fs.existsSync(path)) {
              console.log('PRODUCT_DELETE ' + JSON.stringify({path}));
              continue;
            }
            const bytes = fs.readFileSync(path);
            const sha = crypto.createHash('sha1')
              .update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
            console.log('PRODUCT_FILE ' + JSON.stringify({path, sha, size: bytes.length}));
            for (let offset = 0; offset < bytes.length; offset += 12000) {
              console.log('PRODUCT_CHUNK ' + JSON.stringify({
                path, offset, data: bytes.subarray(offset, offset + 12000).toString('base64'),
              }));
            }
          }
          NODE

  node-driver-tests:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Execute node and chain driver proofs
        run: |
          set -euo pipefail
          qa_source="$(git rev-parse HEAD)"
          qa_control="2019a41836ffee19edcf77b1765594d6d0d6b724"
          qa_body_control="ac9e8ba89b3b5ba61c5e1ca9fa00451a236dd7d8"
          qa_continuity_control="4e209a2bc6fe4fb3f407bd197660c21cc07d767a"
          qa_evidence="$PWD/target/winning-header-driver-proof"
          qa_config="$RUNNER_TEMP/winning-header-nextest.toml"
          mkdir -p "$qa_evidence"
          printf '%s\n' "$qa_source" > "$qa_evidence/source.txt"
          bash scripts/ci-setup.sh apt nextest 2>&1 | tee "$qa_evidence/setup.log"
          cargo nextest run --locked -p bitcoin-rs-node --lib --no-default-features --features test-seam --no-tests fail --no-fail-fast \
            -E 'test(p2p::sync::)' 2>&1 | tee "$qa_evidence/node-tests.log"
          cat > "$qa_config" <<'TOML'
          [profile.header_driver_control]
          retries = 0
          fail-fast = false
          test-threads = 1
          [profile.header_driver_control.junit]
          path = "junit.xml"
          report-skipped = "none"
          TOML
          run_control() {
            local label="$1" expected_status="$2" expected_failures="$3" target="$4" test_name="$5" marker="$6"
            local cargo_target=(--lib)
            if [[ "$target" == suite ]]; then cargo_target=(--test suite); fi
            local report="$PWD/target/nextest/header_driver_control/junit.xml"
            rm -f "$report"
            git rev-parse HEAD > "$qa_evidence/$label-source.txt"
            git diff > "$qa_evidence/$label-diff.patch"
            set +e
            cargo nextest run --locked -p bitcoin-rs-node "${cargo_target[@]}" --no-default-features --features test-seam \
              --config-file "$qa_config" --profile header_driver_control --color never --no-tests fail --no-fail-fast \
              -E "test(=$test_name)" \
              2>&1 | tee "$qa_evidence/$label.log"
            local statuses=("${PIPESTATUS[@]}")
            set -e
            if [[ -f "$report" ]]; then cp "$report" "$qa_evidence/$label.xml"; fi
            if (( statuses[0] != expected_status || statuses[1] != 0 )); then
              printf 'unexpected nextest exit %s (expected %s), tee %s\n' "${statuses[0]}" "$expected_status" "${statuses[1]}" >&2
              return 1
            fi
            node - "$report" "$expected_failures" "$qa_evidence/$label.log" "$expected_status" "$test_name" "$marker" <<'NODE' | tee "$qa_evidence/$label-result.json"
          const fs = require('node:fs');
          const [path, failures, logPath, status, expected, marker] = process.argv.slice(2);
          const xml = fs.readFileSync(path, 'utf8');
          const root = /<testsuites\b([^>]*)>/.exec(xml);
          if (!root) throw new Error('missing testsuites');
          const counts = Object.fromEntries([...root[1].matchAll(/\b(tests|failures|errors)="(\d+)"/g)].map(([, key, n]) => [key, Number(n)]));
          const names = [...xml.matchAll(/<testcase\b[^>]*\bname="([^"]+)"/g)].map(([, name]) => name);
          if (counts.tests !== 1 || counts.failures !== Number(failures) || counts.errors !== 0 || names.length !== 1 || names[0] !== expected || /<skipped\b/.test(xml)) throw new Error('unexpected test set/counts ' + JSON.stringify({counts, names}));
          if (Number(failures) && !fs.readFileSync(logPath, 'utf8').includes(marker)) throw new Error('missing expected behavioral assertion');
          console.log(JSON.stringify({name: expected, ...counts, nextestExit: Number(status)}));
          NODE
          }
          git fetch --no-tags --depth=1 origin "$qa_control" "$qa_body_control" "$qa_continuity_control"
          trap 'git checkout --detach "$qa_source"' EXIT
          qa_fork_test='winning_header_driver::winning_header_driver_applies_deep_fork_and_recovers_durable_tip'
          qa_body_test='p2p::sync::headers::winning_header_tests::body_carried_headers_preserve_a_winning_candidate'
          qa_continuity_test='p2p::sync::headers::winning_header_tests::reorged_winning_continuations_restart_without_peer_blame'
          git checkout --detach "$qa_control"
          run_control before-driver-fix 100 1 suite "$qa_fork_test" 'retention refusal must request its own retained fork anchor'
          git checkout --detach "$qa_source"
          run_control complete-driver 0 0 suite "$qa_fork_test" ''
          git checkout --detach "$qa_body_control"
          run_control before-body-preservation 100 1 lib "$qa_body_test" 'right: 2000'
          git checkout --detach "$qa_source"
          run_control complete-body-preservation 0 0 lib "$qa_body_test" ''
          git checkout --detach "$qa_continuity_control"
          run_control before-continuity-resync 100 1 lib "$qa_continuity_test" 'a valid reorged continuation must keep its source connected'
          git checkout --detach "$qa_source"
          run_control complete-continuity-resync 0 0 lib "$qa_continuity_test" ''
          cargo nextest run --locked -p bitcoin-rs-chain --lib --features test-seam --no-tests fail --no-fail-fast \
            2>&1 | tee "$qa_evidence/chain-tests.log"
          cargo clippy --locked -p bitcoin-rs-node --no-default-features --features test-seam --all-targets -- -D warnings \
            2>&1 | tee "$qa_evidence/clippy.log"
          git diff --exit-code
      - name: Preserve node driver evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: winning-header-driver-proof-${{ github.run_attempt }}
          path: target/winning-header-driver-proof/**
          if-no-files-found: warn
          retention-days: 7
