name: Index owner workbench
on:
  push:
    branches: [workbench/index-owner-742-20260912]
permissions:
  contents: read
concurrency:
  group: index-owner-workbench
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: af5d034d1a74973666b8ef37adc4de3f9ea11d23
          path: candidate
          persist-credentials: false
      - name: Apply the pinned extraction and record its identity
        run: |
          mkdir -p evidence
          python workbench/.workbench/index-query/apply.py candidate
          python workbench/.workbench/index-query/finish.py candidate
          git -C candidate add -A
          git -C candidate write-tree | tee evidence/pre-format-tree.txt
          test "$(git -C candidate write-tree)" = d6f6eb62933401399e3c0cc2b97dc1714a298217
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: candidate -> target
          key: index-query-owner-742
          cache-on-failure: true
      - name: Format the candidate and check it
        working-directory: candidate
        run: |
          cargo +1.95.0 fmt --all
          cargo +1.95.0 fmt --all -- --check
          git add -A
          git diff --cached --check
          rustc +1.95.0 --version --verbose | tee ../evidence/toolchain.txt
          sha256sum Cargo.lock | tee ../evidence/lock-sha256.txt
      - name: Clippy for the changed owners and all their targets
        working-directory: candidate
        run: cargo +1.95.0 clippy --locked -p bitcoin-rs-index -p bitcoin-rs-node -p bitcoin-rs-rpc --no-default-features --features bitcoin-rs-node/fjall --all-targets -- -D warnings 2>&1 | tee ../evidence/clippy.log
      - name: Independent index tests without a backend
        working-directory: candidate
        run: cargo +1.95.0 test --locked -p bitcoin-rs-index --no-default-features --lib 2>&1 | tee ../evidence/index-independent.log
      - name: Index storage and query tests on Fjall
        working-directory: candidate
        run: cargo +1.95.0 test --locked -p bitcoin-rs-index --no-default-features --features fjall --tests 2>&1 | tee ../evidence/index-fjall.log
      - name: Node library regression suite
        working-directory: candidate
        run: cargo +1.95.0 test --locked -p bitcoin-rs-node --no-default-features --features fjall --lib 2>&1 | tee ../evidence/node-lib.log
      - name: RPC library regression suite
        working-directory: candidate
        run: cargo +1.95.0 test --locked -p bitcoin-rs-rpc --no-default-features --lib 2>&1 | tee ../evidence/rpc-lib.log
      - name: Dependency and ownership gates
        working-directory: candidate
        run: cargo +1.95.0 test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_ownership -- --nocapture 2>&1 | tee ../evidence/ownership.log
      - name: Index tests on Redb
        working-directory: candidate
        run: cargo +1.95.0 test --locked -p bitcoin-rs-index --no-default-features --features redb --tests 2>&1 | tee ../evidence/index-redb.log
      - name: Preserve exact candidate and checks, including failures
        if: always()
        working-directory: candidate
        run: |
          mkdir -p ../evidence
          git add -A
          git diff --cached --binary > ../evidence/candidate.patch
          git diff --cached --stat > ../evidence/diff-stat.txt
          git write-tree > ../evidence/candidate-tree.txt
          git archive --format=tar.gz "$(git write-tree)" > ../evidence/candidate-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: index-query-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: af5d034d1a74973666b8ef37adc4de3f9ea11d23
          path: candidate
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: index-query-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Publish only the exact validated tree to a new ref
        working-directory: candidate
        run: |
          git apply --index ../evidence/candidate.patch
          git diff --cached --check
          test "$(git write-tree)" = "$(cat ../evidence/candidate-tree.txt)"
          if git diff --cached --name-only | grep -E '^\.(github|workbench)/'; then
            echo 'Workbench files must not enter the code branch' >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin refs/heads/refactor/index-query-owner-742; then
            echo 'Candidate branch already exists; refusing to overwrite it' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(index): own query consistency and shared runtime state' -m "Relates #742, #645, #217. Validated on Rust 1.95.0 by Actions run ${GITHUB_RUN_ID}; workbench files excluded."
          git push origin HEAD:refs/heads/refactor/index-query-owner-742
          git rev-parse HEAD
