name: Node modularization workbench
on:
  push:
    branches: [automation/node-modularization-workbench-20260910]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5070f377ecee293b9c7739d4a59d2bba47e10543
          persist-credentials: false
      - name: Capture pinned source for refactoring
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/bitcoin-rs-source.tar.gz"
          rustc --version
          cargo --version
      - uses: actions/upload-artifact@v4
        with:
          name: node-refactor-source
          path: ${{ runner.temp }}/bitcoin-rs-source.tar.gz
          retention-days: 1
