name: PR692 metrics repair

on:
  push:
    branches:
      - automation/pr692-metrics-repair-20260910

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Preserve repair script and switch to PR head
        run: |
          cp .github/scripts/pr692_metrics_repair.py "$RUNNER_TEMP/pr692_metrics_repair.py"
          git fetch origin review/pr665-followup-34373279168
          git checkout -B review/pr665-followup-34373279168 origin/review/pr665-followup-34373279168
          test "$(git rev-parse HEAD)" = "4b615ce475cd7fafd69156c725f46fcbb201fc18"
      - name: Apply startup metrics repair
        run: python3 "$RUNNER_TEMP/pr692_metrics_repair.py"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Format and verify focused repair
        run: |
          cargo fmt --all
          git diff --check
          cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall,zmq --lib metrics:: -- --test-threads=1
          cargo clippy --locked -p bitcoin-rs-node --no-default-features --features fjall,zmq --all-targets -- -D warnings
      - name: Commit repair to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/node/src/metrics.rs crates/node/src/run.rs
          git commit -m 'fix(node): make startup metrics transactional across threads'
          git push origin HEAD:review/pr665-followup-34373279168
