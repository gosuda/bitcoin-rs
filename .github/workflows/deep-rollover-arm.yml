name: deep-rollover-arm
on:
  push:
    branches: [verify/deep-rollover-arm-20260910]
    paths: [.github/workflows/deep-rollover-arm.yml]
permissions:
  contents: write
concurrency:
  group: deep-rollover-arm-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 76baf086b861057f5700da34c4ad0d4f5aab5966
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          cache-on-failure: true
      - name: Record source and isolate inherited formatting
        id: baseline
        run: |
          mkdir -p /tmp/rollover-evidence
          git rev-parse HEAD | tee /tmp/rollover-evidence/base.txt
          rustc --version --verbose | tee /tmp/rollover-evidence/toolchain.txt
          git archive HEAD > /tmp/rollover-evidence/base-source.tar
          cargo fmt --all
          git diff --binary > /tmp/rollover-evidence/formatting.patch
          python3 - <<'PY'
          import subprocess
          allowed = {'bin/bitcoin-rs/tests/gates/g20_formal_models.rs', 'bin/bitcoin-rs/tests/support/ownership_scan.rs', 'crates/utxo/src/set/persistent.rs', 'crates/utxo/tests/overhaul_persistent_coins.rs'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed <= allowed, ('Unexpected formatting changes', sorted(changed))
          PY
          git diff --check
          if ! git diff --quiet; then
            git add -- bin/bitcoin-rs/tests/gates/g20_formal_models.rs bin/bitcoin-rs/tests/support/ownership_scan.rs crates/utxo/src/set/persistent.rs crates/utxo/tests/overhaul_persistent_coins.rs
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: apply current rustfmt to inherited formatting differences'
          fi
          git rev-parse HEAD > /tmp/rollover-evidence/format-head.txt
          cargo fmt --all -- --check
          git diff --exit-code
      - name: Recover the reviewed regression and repair scripts
        run: |
          git fetch --no-tags --depth=1 origin 2c875ba118da569a2b6aec15d2fdb84347398927
          git show 2c875ba118da569a2b6aec15d2fdb84347398927:.github/workflows/deep-rollover-arm.yml > /tmp/rollover-original.yml
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          text = Path('/tmp/rollover-original.yml').read_text()
          for name, output in [('Add owner regressions to verified source', 'tests'), ('Repair sequence construction and its existing contract', 'fix')]:
              pattern = r'      - name: ' + re.escape(name) + r'\n        run: \|\n(.*?)(?=      - name:|\Z)'
              matches = re.findall(pattern, text, re.S)
              assert len(matches) == 1, name
              shell = textwrap.dedent(matches[0])
              script = shell.split("python3 - <<'PY'\n", 1)[1].split('\nPY\n', 1)[0]
              compile(script, name, 'exec')
              Path('/tmp/rollover-' + output + '.py').write_text(script)
          PY
          python3 /tmp/rollover-tests.py
      - name: Require owner regression failures rather than setup failure
        run: |
          set +e
          cargo test --locked -p bitcoin-rs-mempool --lib rollover_tests -- --nocapture > /tmp/rollover-evidence/red.txt 2>&1
          rc=$?
          set -e
          cat /tmp/rollover-evidence/red.txt
          test "$rc" -ne 0
          grep -q 'attempt to subtract with overflow' /tmp/rollover-evidence/red.txt
          grep -q 'test result: FAILED. 0 passed; 3 failed' /tmp/rollover-evidence/red.txt
      - name: Apply the owner repair without unrelated changes
        id: fix
        run: |
          python3 /tmp/rollover-fix.py
          cargo fmt --all
          python3 - <<'PY'
          import subprocess
          allowed = {'crates/mempool/src/pool.rs', 'crates/mempool/src/mutation.rs', 'docs/contracts/mempool-mutations.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == allowed, ('Unexpected source changes', sorted(changed))
          PY
          cargo fmt --all -- --check
          git diff --check
          git diff --binary > /tmp/rollover-evidence/rollover.patch
          git diff --exit-code -- Cargo.lock
          git diff --numstat > /tmp/rollover-evidence/scope.txt
      - name: Native owner and observer regressions
        if: ${{ !cancelled() && steps.fix.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test --locked -p bitcoin-rs-mempool --lib --no-fail-fast 2>&1 | tee /tmp/rollover-evidence/mempool.txt
          cargo test --locked -p bitcoin-rs-p2p --lib tx_relay 2>&1 | tee /tmp/rollover-evidence/relay.txt
          cargo test --locked -p bitcoin-rs-rpc --lib zmq 2>&1 | tee /tmp/rollover-evidence/zmq.txt
          cargo test --locked -p bitcoin-rs-mempool --release --lib rollover_tests 2>&1 | tee /tmp/rollover-evidence/release.txt
      - name: Workspace strict Clippy
        if: ${{ !cancelled() && steps.fix.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --exclude bitcoin-rs-consensus --exclude bitcoin-rs-node -- -D warnings 2>&1 | tee /tmp/rollover-evidence/clippy-workspace.txt
      - name: Native consensus strict Clippy
        if: ${{ !cancelled() && steps.fix.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo clippy --locked -p bitcoin-rs-consensus --no-default-features --all-targets -- -D warnings 2>&1 | tee /tmp/rollover-evidence/clippy-consensus.txt
      - name: Native node strict Clippy
        if: ${{ !cancelled() && steps.fix.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo clippy --locked -p bitcoin-rs-node --no-default-features --features fjall,zmq --all-targets -- -D warnings 2>&1 | tee /tmp/rollover-evidence/clippy-node.txt
      - name: Ownership and evidence schema gates
        if: ${{ !cancelled() && steps.fix.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_ownership --test overhaul_evidence --test overhaul_reference_set 2>&1 | tee /tmp/rollover-evidence/contracts.txt
      - name: Publish only the tested source commits
        run: |
          test -z "$(git ls-remote --heads origin refs/heads/validated/deep-rollover-arm-20260910 refs/heads/validated/format-base-arm-20260910)"
          git diff --exit-code -- Cargo.lock
          cargo fmt --all -- --check
          git diff --check
          git add -- crates/mempool/src/pool.rs crates/mempool/src/mutation.rs docs/contracts/mempool-mutations.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(mempool): preserve owner-assigned sequences across rollover'
          git diff --exit-code
          git rev-parse HEAD | tee /tmp/rollover-evidence/head.txt
          git archive HEAD > /tmp/rollover-evidence/source.tar
          format_head=$(cat /tmp/rollover-evidence/format-head.txt)
          if test "$format_head" != 76baf086b861057f5700da34c4ad0d4f5aab5966; then
            git push --atomic origin "$format_head:refs/heads/validated/format-base-arm-20260910" HEAD:refs/heads/validated/deep-rollover-arm-20260910
          else
            git push origin HEAD:refs/heads/validated/deep-rollover-arm-20260910
          fi
      - name: Preserve deciding output on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deep-rollover-arm-${{ github.run_id }}
          path: /tmp/rollover-evidence/
          if-no-files-found: error
          retention-days: 7
