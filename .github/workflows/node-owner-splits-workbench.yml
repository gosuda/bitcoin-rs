name: Node owner splits workbench
on:
  push:
    branches: [automation/node-owner-splits-20260910]
    paths: ['.github/workflows/node-owner-splits-workbench.yml', '.github/node-owner-splits/**']
permissions:
  contents: read
concurrency:
  group: node-owner-splits-20260910
  cancel-in-progress: true
jobs:
  source-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ce3cf5897984ef9b7c63a01c39f9f657b307d628
          fetch-depth: 0
          persist-credentials: false
      - name: Export the exact concurrent commit range
        run: |
          mkdir -p "$RUNNER_TEMP/main-update"
          git bundle create "$RUNNER_TEMP/main-update/main.bundle" 11a85c814801346a874311438db3a9a977f9cc3b..HEAD
          git diff --stat 11a85c814801346a874311438db3a9a977f9cc3b HEAD > "$RUNNER_TEMP/main-update/diff-stat.txt"
          git log --oneline 11a85c814801346a874311438db3a9a977f9cc3b..HEAD > "$RUNNER_TEMP/main-update/commits.txt"
          sha256sum "$RUNNER_TEMP/main-update/main.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-main-current
          path: ${{ runner.temp }}/main-update/
          retention-days: 1
