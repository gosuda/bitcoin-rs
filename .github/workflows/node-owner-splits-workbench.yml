name: Node owner splits workbench
on:
  push:
    branches: [automation/node-owner-splits-20260910]
    paths: ['.github/workflows/node-owner-splits-workbench.yml', '.github/node-owner-splits/**']
permissions:
  contents: read
concurrency:
  group: node-owner-splits-20260910
  cancel-in-progress: true
jobs:
  source-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 11a85c814801346a874311438db3a9a977f9cc3b
          fetch-depth: 0
          persist-credentials: false
      - name: Export the exact concurrent commit range
        run: |
          mkdir -p "$RUNNER_TEMP/main-update"
          git bundle create "$RUNNER_TEMP/main-update/main.bundle" d370a6c8f0ebf06e11058a67134636c5a2b4df00..HEAD
          git diff --stat d370a6c8f0ebf06e11058a67134636c5a2b4df00 HEAD > "$RUNNER_TEMP/main-update/diff-stat.txt"
          git log --oneline d370a6c8f0ebf06e11058a67134636c5a2b4df00..HEAD > "$RUNNER_TEMP/main-update/commits.txt"
          sha256sum "$RUNNER_TEMP/main-update/main.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-main-update
          path: ${{ runner.temp }}/main-update/
          retention-days: 1
