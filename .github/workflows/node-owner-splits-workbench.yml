name: Node owner splits workbench
on:
  push:
    branches: [automation/node-owner-splits-20260910]
    paths: ['.github/workflows/node-owner-splits-workbench.yml', '.github/node-owner-splits/**']
permissions:
  contents: read
concurrency:
  group: node-owner-splits-20260910
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d370a6c8f0ebf06e11058a67134636c5a2b4df00
          persist-credentials: false
      - name: Package tracked source and offline parser
        run: |
          mkdir -p "$RUNNER_TEMP/node-source/wheels"
          git archive --format=tar.gz -o "$RUNNER_TEMP/node-source/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/node-source/commit.txt"
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --platform manylinux_2_17_x86_64 --python-version 313 --implementation cp --abi cp313 --dest "$RUNNER_TEMP/node-source/wheels" tree-sitter==0.25.2 tree-sitter-rust==0.24.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-pinned-source
          path: ${{ runner.temp }}/node-source/
          retention-days: 1
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d370a6c8f0ebf06e11058a67134636c5a2b4df00
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Diagnose manifest and compiler baseline without publishing
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-evidence"
          cp Cargo.lock "$RUNNER_TEMP/baseline-evidence/Cargo.lock.before"
          set +e
          cargo +1.95.0 check -p bitcoin-rs-node --all-targets --no-default-features --features fjall > "$RUNNER_TEMP/baseline-evidence/check.log" 2>&1
          code=$?
          set -e
          echo "$code" > "$RUNNER_TEMP/baseline-evidence/check.exit"
          cp Cargo.lock "$RUNNER_TEMP/baseline-evidence/Cargo.lock.after"
          git diff -- Cargo.lock | tee "$RUNNER_TEMP/baseline-evidence/lock.diff"
          tail -n 220 "$RUNNER_TEMP/baseline-evidence/check.log"
          sha256sum Cargo.lock
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: node-baseline-evidence
          path: ${{ runner.temp }}/baseline-evidence/
          retention-days: 1
