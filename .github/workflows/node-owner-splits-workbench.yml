name: Node owner splits workbench
on:
  push:
    branches: [automation/node-owner-splits-20260910]
    paths: ['.github/workflows/node-owner-splits-workbench.yml', '.github/node-owner-splits/**']
permissions:
  contents: read
concurrency:
  group: node-owner-splits-20260910
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d370a6c8f0ebf06e11058a67134636c5a2b4df00
          persist-credentials: false
      - name: Install source parser
        run: python3 -m pip install --disable-pip-version-check tree-sitter==0.25.2 tree-sitter-rust==0.24.0
      - name: Inventory current Rust owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_rust
          parser = Parser(Language(tree_sitter_rust.language()))
          for path in sorted(Path('crates/node/src').rglob('*.rs')):
              text = path.read_bytes()
              if text.count(b'\n') < 700:
                  continue
              root = parser.parse(text).root_node
              print(f'FILE {path} LINES {text.count(bytes([10]))} PARSE_ERROR {root.has_error}')
              for node in root.named_children:
                  if node.type in ('line_comment', 'block_comment', 'attribute_item', 'inner_attribute_item', 'use_declaration'):
                      continue
                  name = node.child_by_field_name('name') or node.child_by_field_name('type')
                  label = name.text.decode() if name else text[node.start_byte:node.end_byte].decode().splitlines()[0][:100]
                  print(f'  {node.start_point.row+1}:{node.end_point.row+1} {node.type} {label}')
                  if node.type == 'impl_item':
                      body = node.child_by_field_name('body')
                      for method in body.named_children if body else []:
                          if method.type != 'function_item': continue
                          ident = method.child_by_field_name('name')
                          print(f'    {method.start_point.row+1}:{method.end_point.row+1} {ident.text.decode()}')
          PY
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d370a6c8f0ebf06e11058a67134636c5a2b4df00
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Compile baseline without changing source
        run: cargo +1.95.0 check --locked -p bitcoin-rs-node --all-targets --no-default-features --features fjall
