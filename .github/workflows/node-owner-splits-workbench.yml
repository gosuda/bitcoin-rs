name: Node owner splits workbench
on:
  push:
    branches: [automation/node-owner-splits-20260910]
    paths: ['.github/workflows/node-owner-splits-workbench.yml', '.github/node-owner-splits/**']
permissions:
  contents: read
concurrency:
  group: node-owner-splits-20260910
  cancel-in-progress: true
jobs:
  offline-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d370a6c8f0ebf06e11058a67134636c5a2b4df00
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Populate only public dependency caches
        run: |
          cargo +1.95.0 fetch --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/offline-rust"
          cp Cargo.lock "$RUNNER_TEMP/offline-rust/Cargo.lock.resolved"
          git diff -- Cargo.lock > "$RUNNER_TEMP/offline-rust/lock.diff"
          tar -czf "$RUNNER_TEMP/offline-rust/toolchain.tar.gz" -C "$HOME/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu" bin lib libexec share
          tar -czf "$RUNNER_TEMP/offline-rust/registry.tar.gz" -C "$HOME/.cargo" registry
          tar -czf "$RUNNER_TEMP/offline-rust/git-base.tar.gz" .git
          rustc +1.95.0 -Vv > "$RUNNER_TEMP/offline-rust/rustc.txt"
          sha256sum "$RUNNER_TEMP/offline-rust/"*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-offline-rust
          path: ${{ runner.temp }}/offline-rust/
          compression-level: 0
          retention-days: 1
