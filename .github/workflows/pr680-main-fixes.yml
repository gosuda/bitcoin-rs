name: Finalize and validate PR680 follow-ups
on:
  push:
    branches: [automation/pr680-main-fixes-20260910]
permissions:
  contents: write
concurrency:
  group: pr680-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      MAIN: 6838258a3dbca18e78e1995cd5c274d52460167b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Fast-forward both published branches after clean main integration
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for lane in p2p rpc; do
            if [[ "$lane" == p2p ]]; then
              branch=fix/pr680-bip144-transaction-transfer-20260910
              expected=06b3a03f49d8d007fbb04431d2f673878e6ea9a5
            else
              branch=fix/pr680-package-prevout-accounting-20260910
              expected=d16a10e9a3112153bef95ee7566e40286601d7fd
            fi
            test "$(git rev-parse "origin/$branch")" = "$expected"
            work="$RUNNER_TEMP/final-$lane"
            git worktree add --detach "$work" "$expected"
            (
              cd "$work"
              git merge --no-ff "$MAIN" -m 'Merge current main into independent PR680 follow-up'
              if [[ "$lane" == p2p ]]; then
                python3 - <<'PY'
          from pathlib import Path
          edits = {
              'crates/p2p/src/dispatch.rs': (
                  '/// P2P-01 / BIP144: NODE_WITNESS controls getdata serialization, not hashes.',
                  '/// P2P-01 / BIP144: `NODE_WITNESS` controls getdata serialization, not hashes.',
              ),
              'crates/node/tests/tx_ingress_e2e.rs': (
                  '/// P2P-01 / BIP144: these dialers advertise NODE_WITNESS, so require',
                  '/// P2P-01 / BIP144: these dialers advertise `NODE_WITNESS`, so require',
              ),
          }
          for name, (old, new) in edits.items():
              path = Path(name)
              text = path.read_text()
              assert text.count(old) == 1, name
              path.write_text(text.replace(old, new))
          PY
                rustup run stable rustfmt --edition 2024 crates/p2p/src/dispatch.rs crates/node/tests/tx_ingress_e2e.rs
                git diff --check
                git add crates/p2p/src/dispatch.rs crates/node/tests/tx_ingress_e2e.rs
                git commit -m 'docs(p2p): format witness capability names for strict Clippy'
              fi
              git diff --check "$MAIN" HEAD
              git diff --stat "$MAIN" HEAD
              git merge-base --is-ancestor "$expected" HEAD
              git merge-base --is-ancestor "$MAIN" HEAD
              test -z "$(git status --porcelain)"
              test -z "$(git diff --name-only "$MAIN" HEAD -- .github Cargo.lock Cargo.toml)"
              git push origin "HEAD:refs/heads/$branch"
              printf '## %s\nBranch: `%s`\nCommit: `%s`\nMain: `%s`\n' "$lane" "$branch" "$(git rev-parse HEAD)" "$MAIN" >> "$GITHUB_STEP_SUMMARY"
            )
          done
      - name: P2P tests and strict Clippy
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/final-p2p"
          cargo +stable test --locked -p bitcoin-rs-p2p --lib --test core_compat --no-fail-fast
          cargo +stable test --locked -p bitcoin-rs-node --no-default-features --features fjall --test tx_ingress_e2e
          cargo +stable clippy --locked -p bitcoin-rs-p2p --no-default-features --all-targets -- -D warnings
          cargo +stable fmt --all -- --check
          test -z "$(git status --porcelain)"
      - name: RPC tests and strict Clippy
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/final-rpc"
          cargo +stable test --locked -p bitcoin-rs-rpc --no-default-features --lib handlers::tx::tests
          cargo +stable test --locked -p bitcoin-rs-rpc --no-default-features --test transaction_methods --test policy_contract --no-fail-fast
          cargo +stable clippy --locked -p bitcoin-rs-rpc --no-default-features --all-targets -- -D warnings
          cargo +stable fmt --all -- --check
          test -z "$(git status --porcelain)"
