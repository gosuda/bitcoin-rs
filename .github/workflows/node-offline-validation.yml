name: Node offline validation inputs
on:
  push:
    branches: [automation/node-splits-20260911]
    paths: [.github/workflows/node-offline-validation.yml]
permissions:
  contents: read
jobs:
  public-build-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
      - name: Archive public compiler binaries and standard libraries
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/node-stable-compiler"
          mkdir -p "$out"
          compiler_root="$(dirname "$(dirname "$(rustup which --toolchain 1.98.1 rustc)")")"
          tar --exclude='./share/doc' --exclude='./share/man' -C "$compiler_root" -czf "$out/rust-toolchain.tar.gz" .
          "$compiler_root/bin/rustc" --version --verbose > "$out/compiler-version.txt"
          (cd "$out" && sha256sum rust-toolchain.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-stable-compiler-1.98.1
          path: ${{ runner.temp }}/node-stable-compiler/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
