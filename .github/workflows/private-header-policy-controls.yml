name: Header policy negative controls

on:
  push:
    branches: [stabilize/private-header-policy-controls-20261124]

permissions:
  contents: read

concurrency:
  group: header-policy-controls-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  policy-controls:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prove resident and replay policy boundaries
        run: |
          set -euo pipefail
          qa_source="26b405bf372694fd4fdcf795ca94db7be8ff929b"
          qa_resident="bebef4126f24c252f8b28b33064c4928fae0fd00"
          qa_replay="17a663066a0e5564445c4a8213c4e8695a84bf7b"
          qa_anchors="d1cdc7fd48e332187a4f4b95061d9013580e1c39"
          qa_evidence="$PWD/target/header-policy-proof"
          qa_config="$RUNNER_TEMP/header-policy-nextest.toml"
          mkdir -p "$qa_evidence"
          git rev-parse HEAD > "$qa_evidence/runner.txt"
          printf '%s\n' "$qa_source" > "$qa_evidence/source.txt"
          bash scripts/ci-setup.sh apt nextest 2>&1 | tee "$qa_evidence/setup.log"
          cat > "$qa_config" <<'TOML'
          [profile.header_policy_control]
          retries = 0
          fail-fast = false
          test-threads = 1
          [profile.header_policy_control.junit]
          path = "junit.xml"
          report-skipped = "none"
          TOML
          run_control() {
            local label="$1" expected_status="$2" expected_failures="$3" test_name="$4" marker="$5"
            local report="$PWD/target/nextest/header_policy_control/junit.xml"
            rm -f "$report"
            git rev-parse HEAD > "$qa_evidence/$label-source.txt"
            git diff "$qa_source" HEAD -- crates/chain/src/header_admission.rs > "$qa_evidence/$label-diff.patch"
            set +e
            cargo nextest run --locked -p bitcoin-rs-chain --lib --features test-seam \
              --config-file "$qa_config" --profile header_policy_control --color never --no-tests fail --no-fail-fast \
              -E "test(=$test_name)" \
              2>&1 | tee "$qa_evidence/$label.log"
            local statuses=("${PIPESTATUS[@]}")
            set -e
            if [[ -f "$report" ]]; then cp "$report" "$qa_evidence/$label.xml"; fi
            if (( statuses[0] != expected_status || statuses[1] != 0 )); then
              printf 'unexpected nextest exit %s (expected %s), tee %s\n' "${statuses[0]}" "$expected_status" "${statuses[1]}" >&2
              return 1
            fi
            node - "$report" "$expected_failures" "$qa_evidence/$label.log" "$expected_status" "$test_name" "$marker" <<'NODE' | tee "$qa_evidence/$label-result.json"
          const fs = require('node:fs');
          const [path, failures, logPath, status, expected, marker] = process.argv.slice(2);
          const xml = fs.readFileSync(path, 'utf8');
          const root = /<testsuites\b([^>]*)>/.exec(xml);
          if (!root) throw new Error('missing testsuites');
          const counts = Object.fromEntries([...root[1].matchAll(/\b(tests|failures|errors)="(\d+)"/g)].map(([, key, n]) => [key, Number(n)]));
          const names = [...xml.matchAll(/<testcase\b[^>]*\bname="([^"]+)"/g)].map(([, name]) => name);
          if (counts.tests !== 1 || counts.failures !== Number(failures) || counts.errors !== 0 || names.length !== 1 || names[0] !== expected || /<skipped\b/.test(xml)) throw new Error('unexpected test set/counts ' + JSON.stringify({counts, names}));
          if (Number(failures) && !fs.readFileSync(logPath, 'utf8').includes(marker)) throw new Error('missing expected behavioral assertion');
          console.log(JSON.stringify({name: expected, ...counts, nextestExit: Number(status)}));
          NODE
          }
          git fetch --no-tags --depth=1 origin "$qa_source" "$qa_resident" "$qa_replay" "$qa_anchors"
          trap 'git checkout --detach "$qa_source"' EXIT
          qa_resident_test='header_admission::tests::repeated_qualifying_minimum_difficulty_forks_have_a_finite_resident_bound'
          qa_replay_test='header_admission::tests::replay_at_the_exact_capacity_boundary_acknowledges_progress_before_yielding'
          qa_anchor_test='header_admission::tests::disappearing_operation_roots_cancel_over_budget_anchors_and_allow_fresh_replay'
          git checkout --detach "$qa_resident"
          run_control before-resident-bound 100 1 "$qa_resident_test" 'assertion failed: tree.len() <= 161 + 160'
          git checkout --detach "$qa_source"
          run_control complete-resident-bound 0 0 "$qa_resident_test" ''
          git checkout --detach "$qa_replay"
          run_control before-replay-boundary 100 1 "$qa_replay_test" 'CandidateRequired'
          git checkout --detach "$qa_source"
          run_control complete-replay-boundary 0 0 "$qa_replay_test" ''
          git checkout --detach "$qa_anchors"
          run_control before-anchor-cancellation 100 1 "$qa_anchor_test" 'right: 120'
          git checkout --detach "$qa_source"
          run_control complete-anchor-cancellation 0 0 "$qa_anchor_test" ''
          git diff --exit-code
      - name: Preserve header policy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: header-policy-controls-${{ github.run_attempt }}
          path: target/header-policy-proof/**
          if-no-files-found: error
          retention-days: 7
