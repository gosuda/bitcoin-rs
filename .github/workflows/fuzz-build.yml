name: fuzz-build

# Compile every fuzz target when fuzz/ files or root workspace dependency
# declarations change. fuzz/ is a separate Cargo workspace, so its own
# fuzz/Cargo.lock is covered by fuzz/**; the root Cargo.lock does not resolve
# the fuzz build. Crate-manifest edits are covered by the cheap fuzz-lockfile
# drift check and the daily-fuzz campaign, rather than making every ordinary
# code PR pay for a fuzz build. The daily workflow also owns execution and
# corpus updates.
on:
  pull_request:
    branches: ['**']
    paths:
      - 'fuzz/**'
      - 'Cargo.toml'
      - '.github/workflows/fuzz-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-build-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: fuzz -> target
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # cargo-fuzz
        with:
          tool: cargo-fuzz@0.13.2
      # fuzz/ pulls in root workspace crates by path, so root workspace
      # version-pin bumps can invalidate fuzz/Cargo.lock; --locked fails fast
      # when fuzz/Cargo.lock was not regenerated for them.
      - run: cargo +nightly metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      # cargo-fuzz can otherwise select an unavailable musl target.
      - run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
