name: node-refactor-validation

on:
  push:
    branches: [refactor/node-modularization]

permissions:
  contents: read

concurrency:
  group: node-refactor-validation
  cancel-in-progress: true

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Temporary baseline validation retired; use PR checks."
