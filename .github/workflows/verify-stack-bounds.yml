name: review-existing-api-contracts
on:
  push:
    branches: [verify/stack-bounds-20260910]
    paths:
      - .github/workflows/verify-stack-bounds.yml
      - .github/audit/review_contracts.py
permissions:
  contents: write
concurrency:
  group: verify-stack-bounds-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 76baf086b861057f5700da34c4ad0d4f5aab5966
          path: source
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: source -> target
          cache-on-failure: true
      - name: Record toolchain and source identity
        working-directory: source
        run: |
          mkdir -p /tmp/review-contract-evidence
          rustc --version --verbose | tee /tmp/review-contract-evidence/toolchain.txt
          git rev-parse HEAD | tee /tmp/review-contract-evidence/base.txt
          python3 -m py_compile ../control/.github/audit/review_contracts.py
      - name: Reproduce and validate existing PRs with owner contract corrections
        working-directory: source
        run: python3 ../control/.github/audit/review_contracts.py
      - name: Preserve all completed results and remaining source changes
        if: always()
        working-directory: source
        run: |
          mkdir -p /tmp/review-contract-evidence
          git diff --binary > /tmp/review-contract-evidence/uncommitted.patch
          git status --porcelain > /tmp/review-contract-evidence/final-status.txt
      - name: Retain execution evidence on both success and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: existing-api-contracts-${{ github.run_id }}
          path: /tmp/review-contract-evidence/
          if-no-files-found: error
          retention-days: 7
