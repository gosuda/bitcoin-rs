name: node-refactor-snapshot

on:
  push:
    branches: [agent/node-mod-workbench]
    paths: [.github/workflows/node-refactor-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7dacf1a56ff67fdfd203459630f2e0e70c01d0b
          fetch-depth: 0
          persist-credentials: false
      - name: Archive pinned source and published state history
        run: |
          git branch snapshot-main e7dacf1a56ff67fdfd203459630f2e0e70c01d0b
          git branch snapshot-state 7c9b3f9b7eda8b3a258b2e534ba034865dad4650
          git bundle create /tmp/node-continuation.bundle snapshot-main snapshot-state
          sha256sum /tmp/node-continuation.bundle > /tmp/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: node-continuation
          path: |
            /tmp/node-continuation.bundle
            /tmp/SHA256SUMS
          retention-days: 1
