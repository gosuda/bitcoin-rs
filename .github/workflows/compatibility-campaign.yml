name: ci-compatibility

# Campaigns for declared dependency ranges, named feature combinations, and
# the supported minimum Rust version. Keep these checks independent of every
# ordinary merge; production behavior remains in ci-main.
on:
  schedule:
    # Daily at 01:41 UTC, separate from the daily fuzz campaign.
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Preserve an evidence run for every scheduled or manual invocation.
concurrency:
  group: ci-compatibility-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  # Scheduled (issue #174 / DEP-01): prove the declared dependency ranges,
  # not only the committed lockfile. `minimal` pins every direct dependency
  # at its oldest allowed version; `maximum` takes the newest version still
  # inside each range. Both mutate Cargo.lock, so they must never run on PR
  # checkouts -- this workflow runs on a scheduled throwaway checkout or
  # manual dispatch.
  dependency-range:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        range: [minimal, maximum]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The minimal lane checks --all-features and the maximum lane runs an
      # explicit kernel check, so both compile the C++ kernel engine; install
      # the native prerequisites.
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        if: matrix.range == 'minimal'
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: dep-range-${{ matrix.range }}
      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-deny
        with:
          tool: cargo-deny
      - run: KEEP_LOCK=1 scripts/check-dep-range.sh ${{ matrix.range }}

  # Scheduled (issue #174 / FEAT-01): the named combinations in
  # scripts/feature-matrix.tsv, not a cargo-hack powerset. `--each-feature`
  # enables empty markers and illegal singles (zmq-only). The TSV's two
  # lanes run as a matrix: `pure` needs no C++ toolchain or kernel/rocksdb
  # compile, so it skips native-deps entirely.
  feature-combinations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [pure, native]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # Kernel and rocksdb rows need the C++ toolchain; the TSV's
      # native lane installs those prerequisites only for its matrix rows.
      - uses: ./.github/actions/native-deps
        if: matrix.lane == 'native'
      - run: scripts/check-feature-matrix.sh ${{ matrix.lane }}
      # The matrix rows only compile; the trace lane's acceptance gate is that
      # a `usdt` build with `default-features = false` still embeds
      # `.note.stapsdt` notes, which only this test asserts (it parses the
      # built artifact's notes against `probe_abi::PROBES`), and that a
      # feature-off build embeds none.
      - run: |
          cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall --test sdt_notes
          cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall,usdt --test sdt_notes
        if: matrix.lane == 'pure'

  # Compile-only MSRV gate: the policy promise is that workspace crates build
  # on the declared MSRV. A second compile graph, so it runs on schedule;
  # tests, benches, and kernel/C++ production behavior remain in ci-main.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: toolchain
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Workspace default targets on Rust 1.95
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo check --locked --workspace \
            --exclude bitcoin-rs-consensus --exclude bitcoin-rs-node
      - name: Native consensus on Rust 1.95
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo check --locked -p bitcoin-rs-consensus \
            --no-default-features
      - name: Native node on Rust 1.95
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo check --locked -p bitcoin-rs-node \
            --no-default-features --features fjall,zmq
