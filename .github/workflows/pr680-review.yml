name: PR 680 pinned review

on:
  push:
    branches: [review/pr-680-0008b76]
    paths: [.github/workflows/pr680-review.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 33460e1b587f4d3c5e4867972f510ecae5521b4d
          persist-credentials: false
      - name: Export the exact source for review
        run: |
          git rev-parse HEAD > /tmp/pr680-head.txt
          git archive --format=tar HEAD > /tmp/pr680-current.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr680-current
          path: |
            /tmp/pr680-head.txt
            /tmp/pr680-current.tar
          retention-days: 1
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 33460e1b587f4d3c5e4867972f510ecae5521b4d
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - run: cargo fmt --all -- --check
      - run: cargo metadata --manifest-path fuzz/Cargo.toml --format-version 1 --locked > /tmp/fuzz-metadata.json
      - run: cargo test -p bitcoin-rs-script -p bitcoin-rs-mempool -p bitcoin-rs-consensus --no-default-features --lib
      - run: cargo test -p bitcoin-rs-node --no-default-features --features fjall,zmq --lib tx_ingress::tests
      - run: cargo test -p bitcoin-rs-node --no-default-features --features fjall,zmq --test tx_ingress_e2e
      - run: cargo test -p bitcoin-rs-p2p --lib
      - run: |
          cargo clippy --workspace --all-targets --exclude bitcoin-rs-consensus --exclude bitcoin-rs-node -- -D warnings
          cargo clippy -p bitcoin-rs-consensus --no-default-features --all-targets -- -D warnings
          cargo clippy -p bitcoin-rs-node --no-default-features --features fjall,zmq --all-targets -- -D warnings
