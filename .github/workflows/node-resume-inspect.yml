name: node-resume-inspect

on:
  push:
    branches: [agent/node-mod-workbench]
    paths: [.github/workflows/node-resume-inspect.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export scoped Git history and source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/node-resume
          git bundle create /tmp/node-resume/repository.bundle HEAD refs/remotes/origin/main refs/remotes/origin/agent/node-state-owners refs/remotes/origin/agent/node-apply-workbench refs/remotes/origin/agent/node-sync-workbench refs/remotes/origin/agent/node-mining-workbench refs/remotes/origin/agent/node-checkpoint-workbench refs/remotes/origin/agent/node-txindex-workbench
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin/agent/node- refs/remotes/origin/main > /tmp/node-resume/refs.txt
          sha256sum /tmp/node-resume/repository.bundle > /tmp/node-resume/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: node-resume-sources
          path: /tmp/node-resume/
          retention-days: 7
          if-no-files-found: error
