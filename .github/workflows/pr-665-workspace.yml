name: PR 665 review checks

on:
  push:
    branches: [review/pr-665-workspace]
    paths: ['.review/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.patch.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: review-tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e7d4b77ea82e5f0c3541edc770a1bad5a60c6288
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply exact reviewed fixes
        run: python3 review-tools/.review/final.py source
      - name: Format and capture exact candidate
        id: patch
        working-directory: source
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          git diff --check
          git add -A
          mkdir -p ../candidate
          git diff --cached --binary > ../candidate/review.patch
          git write-tree > ../candidate/REVIEW_TREE
          git rev-parse HEAD > ../candidate/SOURCE_COMMIT
          git diff --cached --stat
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-665-candidate
          path: candidate/
          retention-days: 1
          if-no-files-found: error
  check:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-665-candidate
          path: ${{ runner.temp }}/candidate
      - name: Apply exact candidate
        run: |
          git apply --index "$RUNNER_TEMP/candidate/review.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/candidate/REVIEW_TREE")"
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: pr-665-review
          cache-on-failure: true
      - name: Storage fault matrix
        run: cargo test --locked -p bitcoin-rs-storage --no-default-features --features fjall,redb,mdbx,rocksdb --test overhaul_atomic_durability
      - name: UTXO tests
        if: always()
        run: cargo test --locked -p bitcoin-rs-utxo
      - name: Native consensus and layout regressions
        if: always()
        run: |
          cargo test --locked -p bitcoin-rs-consensus --no-default-features --lib --test overhaul_parse_parity --test overhaul_prepared_inputs
          cargo test --locked -p bitcoin-rs-primitives --test overhaul_layout
      - name: Storage, UTXO, and consensus lints
        if: always()
        run: |
          status=0
          cargo clippy --locked -p bitcoin-rs-storage --all-targets --no-default-features --features fjall,redb,mdbx,rocksdb -- -D warnings || status=1
          cargo clippy --locked -p bitcoin-rs-utxo --all-targets -- -D warnings || status=1
          cargo clippy --locked -p bitcoin-rs-consensus --all-targets --no-default-features -- -D warnings || status=1
          cargo fmt --all -- --check || status=1
          exit "$status"
      - name: Evidence and ledger validation
        if: always()
        run: |
          cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_evidence
          cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test gates g18_hot_path_ledger
      - name: Bounded formal-runner capture
        if: always()
        run: cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test gates g20_formal_models::bounded_capture
      - name: Evidence and gate lints
        if: always()
        run: cargo clippy --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_evidence --test gates -- -D warnings
      - name: RPC tests and lints
        if: always()
        run: |
          cargo test --locked -p bitcoin-rs-rpc
          cargo clippy --locked -p bitcoin-rs-rpc --all-targets -- -D warnings
      - name: Offline comparator regressions
        if: always()
        run: python3 -m unittest discover -s tools/benchmark-campaign -p test_offline_full_validation.py
  stage:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-665-candidate
          path: ${{ runner.temp }}/candidate
      - name: Stage candidate on an isolated branch
        env:
          CANDIDATE: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$CANDIDATE/SOURCE_COMMIT")"
          git apply --index "$CANDIDATE/review.patch"
          test "$(git write-tree)" = "$(cat "$CANDIDATE/REVIEW_TREE")"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: serialize coin persistence and remove misleading review surfaces'
          git push origin "HEAD:refs/heads/review/pr-665-fixes-$GITHUB_RUN_NUMBER"
          git rev-parse HEAD
