name: fuzz-lockfile

# fuzz/ is a separate Cargo workspace with its own fuzz/Cargo.lock. Its direct
# deps are declared inline, but its path deps on crates/* pull in those crates'
# `workspace = true` transitive specs, so crates/*/Cargo.toml edits can
# invalidate fuzz/Cargo.lock. This cheap metadata check owns drift detection
# only for that case: fuzz/** and Cargo.toml PRs already run the identical
# gate inside fuzz-build.yml before the fuzz build, so scoping this trigger
# to crate manifests avoids running the same check twice. The daily-fuzz
# campaign remains the fallback.
on:
  pull_request:
    branches: ['**']
    paths:
      - 'crates/*/Cargo.toml'
      - '.github/workflows/fuzz-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-lockfile-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
      - run: cargo +nightly metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
