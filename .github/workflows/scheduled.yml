name: Scheduled

# Daily compatibility campaign (was compatibility-campaign.yml) and manual overlay interop (was overlay-interop.yml).
on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: Which lane to run
        type: choice
        options: [compat, overlay]
        default: compat

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  dependency-range:
    if: github.event_name == 'schedule' || inputs.lane == 'compat'
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
    strategy:
      fail-fast: false
      matrix:
        range: [minimal, maximum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci-setup.sh apt msrv nightly deny
      - run: KEEP_LOCK=1 scripts/check-dep-range.sh ${{ matrix.range }}

  features:
    if: github.event_name == 'schedule' || inputs.lane == 'compat'
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [pure, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.lane == 'native'
        run: bash scripts/ci-setup.sh apt
      - run: scripts/check-feature-matrix.sh ${{ matrix.lane }}
      - if: matrix.lane == 'native'
        run: |
          cargo test --locked -p bitcoin-rs-consensus --no-default-features --test sdt_notes
          cargo test --locked -p bitcoin-rs-consensus --features usdt --test sdt_notes

  msrv:
    if: github.event_name == 'schedule' || inputs.lane == 'compat'
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci-setup.sh apt msrv
      - name: Workspace default targets
        run: cargo check --locked --workspace --exclude bitcoin-rs-consensus --exclude bitcoin-rs-node
      - name: Native consensus
        if: always()
        run: cargo check --locked -p bitcoin-rs-consensus --no-default-features
      - name: Native node
        if: always()
        run: cargo check --locked -p bitcoin-rs-node --no-default-features --features zmq

  overlay:
    if: inputs.lane == 'overlay'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install external backends
        run: |
          bash scripts/ci-setup.sh apt
          sudo apt-get update -qq && sudo apt-get install -y -qq tor golang-go
          git clone -q https://github.com/gosuda/IVNP.git /tmp/ivnp
          git -C /tmp/ivnp checkout "$(python3 scripts/overlay-interop.py --ivnp-revision)"
          (cd /tmp/ivnp && GOTOOLCHAIN=go1.27.0+auto go build -o /tmp/ivnpd ./cmd/ivnpd)
      - run: cargo build --locked --bin bitcoin-rs
      - run: python3 scripts/overlay-interop.py --ivnpd /tmp/ivnpd --tor /usr/bin/tor
