name: PR 665 isolated review verification
on:
  push:
    branches: [review/pr-665-verification-20260909]
    paths: [.review/ready]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.commit.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct reviewed follow-up tree
        shell: bash
        run: |
          set -euo pipefail
          cp .review/followup*.json "$RUNNER_TEMP/"
          git checkout --detach db1504be00f994a7d3d214a8ecb3c0ea6e25181a
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          seen = set()
          for source in sorted(Path(os.environ['RUNNER_TEMP']).glob('followup*.json')):
              for name, edits in json.loads(source.read_text()).items():
                  path = Path(name)
                  if path.is_absolute() or '..' in path.parts or name in seen:
                      raise SystemExit(f'invalid or duplicate edit path: {name}')
                  seen.add(name)
                  lines = path.read_text().splitlines(keepends=True)
                  for start, count, replacement in reversed(edits):
                      lines[start:start + count] = replacement.splitlines(keepends=True)
                  path.write_text(''.join(lines))
          if len(seen) != 21:
              raise SystemExit(f'expected 21 reviewed files, got {len(seen)}')
          PY
          git diff --check
          git add -u
          test "$(git write-tree)" = 7a1a2f976b8761460802d6216a89ddab5442b8d2
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          components: rustfmt
      - name: Format reviewed Rust files
        run: |
          git diff --cached --name-only -z -- '*.rs' | xargs -0 -r rustfmt --edition 2024 --config skip_children=true
          git diff --check
          git add -u
      - name: Publish source-only candidate
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove misleading implementation claims and fix isolated test feature boundaries' -m 'Separate implemented behavior from target contracts; retain KeepKernel and blocked formal gates. Restore P2P-03 height-credit identity, remove nonexistent transport commands, correct ZMQ/REST/lifecycle descriptions, and distinguish declared evidence from artifact attestation. Fix backend-only test compilation and enable the admission test seam only for node development dependencies.'
          candidate=$(git rev-parse HEAD)
          branch="review/pr-665-candidate-${GITHUB_RUN_ID}"
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin "HEAD:refs/heads/$branch"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "Source-only candidate: $candidate on $branch" >> "$GITHUB_STEP_SUMMARY"
          git diff --binary f8bb0f8d0f49ade933eb558d6722041d37a9c02c HEAD > "$RUNNER_TEMP/reviewed.patch"
          git archive --format=tar.gz -o "$RUNNER_TEMP/reviewed-source.tar.gz" HEAD
      - name: Preserve previous backend failure logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for job in 102498030244 102498030368; do
            gh api "repos/gosuda/bitcoin-rs/actions/jobs/$job/logs" > "$RUNNER_TEMP/previous-$job.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr665-final-source
          path: |
            ${{ runner.temp }}/reviewed.patch
            ${{ runner.temp }}/reviewed-source.tar.gz
            ${{ runner.temp }}/previous-*.log
          retention-days: 3
          if-no-files-found: error
  rust:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [core, evidence, node, fjall, redb, mdbx, rocksdb]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: pr665-review-${{ matrix.lane }}
          cache-on-failure: true
      - name: Run contracts and strict lints
        env:
          LANE: ${{ matrix.lane }}
          CARGO_INCREMENTAL: 0
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/checks.log") 2>&1
          echo "Candidate: $(git rev-parse HEAD); lane: $LANE"
          case "$LANE" in
            core)
              cargo test --locked -p bitcoin-rs-utxo --no-default-features --test overhaul_persistent_coins
              cargo test --locked -p bitcoin-rs-utxo --no-default-features --doc
              cargo test --locked -p bitcoin-rs-mempool
              cargo test --locked -p bitcoin-rs-consensus --no-default-features --test overhaul_parse_parity --test overhaul_prepared_inputs
              cargo clippy --locked -p bitcoin-rs-utxo -p bitcoin-rs-mempool --no-default-features --all-targets -- -D warnings
              cargo clippy --locked -p bitcoin-rs-consensus --no-default-features --test overhaul_parse_parity -- -D warnings
              cargo test --locked -p bitcoin-rs-p2p --test core_compat --test wire_codec --test handshake_roundtrip
              ;;
            evidence)
              cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_evidence --test overhaul_reference_set
              cargo test --locked -p bitcoin-rs-rpc --test handler_smoke --test manifest_coverage
              cargo clippy --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_evidence --test overhaul_reference_set -- -D warnings
              python3 -m unittest discover -s tools/campaign-corpus -p 'test_*.py'
              ;;
            node)
              cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall --lib capability_revision_tests
              cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall --lib run::tests
              cargo clippy --locked -p bitcoin-rs-node --no-default-features --features fjall --lib -- -D warnings
              ;;
            *)
              cargo test --locked -p bitcoin-rs-storage --no-default-features --features "$LANE" --test overhaul_atomic_durability --test backend_metrics --test storage_footprint -- --nocapture
              cargo clippy --locked -p bitcoin-rs-storage --no-default-features --features "$LANE" --all-targets -- -D warnings
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr665-checks-${{ matrix.lane }}
          path: ${{ runner.temp }}/checks.log
          retention-days: 3
          if-no-files-found: warn
