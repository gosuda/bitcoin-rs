name: update-node-async-lints

on:
  push:
    branches: [agent/node-finish-publication-20260911]
    paths:
      - .github/update-node-async-lints.py
      - .github/workflows/update-node-async-lints.yml

concurrency:
  group: node-async-compatibility
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_TEST_OPT_LEVEL: 0
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt,clippy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: node-async-compat-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            node-finish-${{ runner.os }}-rust195-${{ hashFiles('Cargo.lock') }}
      - name: Check both Clippy versions, preserved review changes, and native tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin f3284c1fcfbb7fa0bf9298bf0ccfcb97f19bcf49
          cp .github/update-node-async-lints.py /tmp/update-node-async-lints.py
          python /tmp/update-node-async-lints.py prepare /tmp/node-async-checked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-async-checked
          path: /tmp/node-async-checked/
          retention-days: 7
          if-no-files-found: error
  stage:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: node-async-checked
          path: /tmp/node-async-checked
      - name: Expose validated commits without updating PR branches
        shell: bash
        run: |
          set -euo pipefail
          python .github/update-node-async-lints.py stage /tmp/node-async-checked
