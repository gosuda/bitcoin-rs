name: node-finish-snapshot

on:
  push:
    branches: [agent/node-finish-publication-20260911]
    paths: [.github/workflows/node-finish-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export refreshed source including query ownership
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/node-finish
          git fetch origin pull/932/head:refs/heads/reorg-pr
          git bundle create /tmp/node-finish/source.bundle HEAD refs/remotes/origin/main refs/heads/reorg-pr
          git rev-parse origin/main > /tmp/node-finish/main.txt
          git rev-parse reorg-pr > /tmp/node-finish/reorg.txt
          sha256sum /tmp/node-finish/source.bundle > /tmp/node-finish/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: node-finish-source
          path: /tmp/node-finish/
          retention-days: 3
