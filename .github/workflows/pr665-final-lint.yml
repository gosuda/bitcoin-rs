name: PR665 final source verification
on:
  push:
    branches: [review/pr-665-verification-20260909]
    paths: [.github/workflows/pr665-final-lint.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.commit.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 476ee4b2d35deffd28390a98aadfad82b8e2bb47
          fetch-depth: 0
          persist-credentials: false
      - name: Borrow fixed-size arrays without temporary slice conversions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          changed = []
          for root in [Path('crates'), Path('bin')]:
              for path in root.rglob('*.rs'):
                  old = path.read_text()
                  lines = []
                  for line in old.splitlines(keepends=True):
                      if 'let mut chunks =' not in line:
                          line = re.sub(r'\.chunks_exact\((2|4)\)', r'.as_chunks::<\1>().0.iter()', line)
                      lines.append(line)
                  new = ''.join(lines)
                  if new != old:
                      changed.append(str(path))
                      path.write_text(new)
          assert len(changed) == 14, changed
          # These exact local imports were reported unused by the RPC unit-test compiler.
          imports = {
              'crates/rpc/src/handlers/tx.rs': {2924: '    use sonic_rs::JsonValueTrait as _;', 2967: '    use sonic_rs::JsonValueTrait as _;', 2964: '    use bitcoin::hashes::Hash as _;'},
              'crates/rpc/src/handlers/chain.rs': {5415: '    use sonic_rs::JsonValueTrait as _;'},
              'crates/rpc/src/handlers/util.rs': {1705: '    use sonic_rs::JsonContainerTrait as _;'},
          }
          for name, expected in imports.items():
              path = Path(name)
              lines = path.read_text().splitlines(keepends=True)
              for number, text in sorted(expected.items(), reverse=True):
                  assert lines[number - 1].rstrip('\n') == text, (name, number)
                  del lines[number - 1]
              path.write_text(''.join(lines))
          PY
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Format and validate only changed sources
        run: |
          git diff --name-only -z -- '*.rs' | xargs -0 -r rustfmt --edition 2024 --config skip_children=true
          git diff --check
          git add -u
      - name: Commit final source-only candidate
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Simplify fixed-size iteration and remove redundant test imports' -m 'Borrow array chunks directly. Preserve remainder-checking iterators and existing validation. No lint exemptions, dependencies or behavior switches are added.'
          candidate=$(git rev-parse HEAD)
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin "HEAD:refs/heads/review/pr665-final-${GITHUB_RUN_ID}"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "Candidate: $candidate" >> "$GITHUB_STEP_SUMMARY"
          git diff --binary df8717e86a25de3d94e51d93cb2787d9021cb2fa HEAD > "$RUNNER_TEMP/pr665-final.patch"
          git archive --format=tar.gz -o "$RUNNER_TEMP/pr665-final-source.tar.gz" HEAD
          git diff --stat df8717e86a25de3d94e51d93cb2787d9021cb2fa HEAD > "$RUNNER_TEMP/pr665-final-stat.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr665-final-delivery
          path: |
            ${{ runner.temp }}/pr665-final.patch
            ${{ runner.temp }}/pr665-final-source.tar.gz
            ${{ runner.temp }}/pr665-final-stat.txt
          retention-days: 3
  checks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [core, evidence, node]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: pr665-review-${{ matrix.lane }}
          cache-on-failure: true
      - name: Execute affected tests and strict lint checks
        env:
          LANE: ${{ matrix.lane }}
          CARGO_INCREMENTAL: 0
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/checks.log") 2>&1
          echo "Candidate: $(git rev-parse HEAD); lane: $LANE"
          rustc --version
          case "$LANE" in
            core)
              cargo test --locked -p bitcoin-rs-utxo --no-default-features --test overhaul_persistent_coins
              cargo test --locked -p bitcoin-rs-utxo --no-default-features --doc
              cargo test --locked -p bitcoin-rs-mempool
              cargo test --locked -p bitcoin-rs-script --no-default-features --lib
              cargo test --locked -p bitcoin-rs-primitives --test overhaul_layout
              cargo test --locked -p bitcoin-rs-consensus --no-default-features --test overhaul_parse_parity --test overhaul_prepared_inputs
              cargo clippy --locked -p bitcoin-rs-utxo -p bitcoin-rs-mempool --no-default-features --all-targets -- -D warnings
              cargo clippy --locked -p bitcoin-rs-consensus --no-default-features --test overhaul_parse_parity --test overhaul_prepared_inputs --bench merkle -- -D warnings
              cargo test --locked -p bitcoin-rs-p2p --test core_compat --test wire_codec --test handshake_roundtrip
              ;;
            evidence)
              cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_evidence --test overhaul_reference_set --test g18_hot_path_ledger --test g19_validation_default
              cargo test --locked -p bitcoin-rs-rpc --lib coin_queries_wait_for_one_consistent_utxo_and_tip_transition
              cargo test --locked -p bitcoin-rs-rpc --lib gettxoutsetinfo
              cargo test --locked -p bitcoin-rs-rpc --test handler_smoke --test manifest_coverage --test auth --test transaction_methods
              cargo clippy --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_evidence --test overhaul_reference_set --test g18_hot_path_ledger -- -D warnings
              cargo clippy --locked -p bitcoin-rs-rpc --lib -- -D warnings
              python3 -m unittest discover -s tools/campaign-corpus -p 'test_*.py'
              ;;
            node)
              cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall --test overhaul_config_status
              cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall --lib run::tests
              cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall --test mining_e2e
              cargo clippy --locked -p bitcoin-rs-node --no-default-features --features fjall --lib -- -D warnings
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr665-final-checks-${{ matrix.lane }}
          path: ${{ runner.temp }}/checks.log
          retention-days: 3
          if-no-files-found: warn
