name: publish-g18-axis

on:
  push:
    branches: [automation/g18-axis-publish-20260910]
    paths:
      - .github/workflows/publish-g18-axis.yml
      - .github/scripts/publish-g18-axis.py

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f846c7fbeed40e70431cf83ab4f2cb656bf9ea0b
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Apply and publish reviewed G18 axis patch
        run: python3 <(git show origin/automation/g18-axis-publish-20260910:.github/scripts/publish-g18-axis.py)
        shell: bash
      - name: G18 and evidence tests
        run: cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test g18_hot_path_ledger --test overhaul_evidence
      - name: Strict workspace Clippy
        run: cargo clippy --locked --workspace --all-targets --exclude bitcoin-rs-consensus --exclude bitcoin-rs-node -- -D warnings
      - name: Strict native consensus Clippy
        run: cargo clippy --locked -p bitcoin-rs-consensus --no-default-features --all-targets -- -D warnings
      - name: Strict native node Clippy
        run: cargo clippy --locked -p bitcoin-rs-node --no-default-features --features fjall,zmq --all-targets -- -D warnings
      - name: Formatting and clean tree
        run: |
          cargo fmt --all -- --check
          git diff --exit-code
