name: publish-rest-current-contract

on:
  push:
    branches: [automation/rest-doc-publish-20260910]
    paths:
      - .github/workflows/publish-rest-current-contract.yml
      - .github/scripts/publish-rest-current-contract.py

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: de0f6ffff75ddffaa6ed0b59ee4f208cfd2e49b6
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Apply and publish reviewed REST contract patch
        shell: bash
        run: |
          git fetch origin refs/heads/automation/rest-doc-publish-20260910:refs/remotes/origin/automation/rest-doc-publish-20260910
          python3 <(git show origin/automation/rest-doc-publish-20260910:.github/scripts/publish-rest-current-contract.py)
      - name: REST route regressions
        run: cargo test --locked -p bitcoin-rs-rpc --test rest_routes
      - name: Strict RPC Clippy
        run: cargo clippy --locked -p bitcoin-rs-rpc --all-targets -- -D warnings
      - name: Formatting and clean tree
        run: |
          cargo fmt --all -- --check
          git diff --exit-code
