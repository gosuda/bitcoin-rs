name: reference-extraction

on:
  push:
    branches: [automation/reference-extraction-20260910]
    paths: [.github/workflows/reference-extraction.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: de81e329c783247e1e57bf0402fdf5adf294001e
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt,clippy
      - name: Extract reference support and migrate all current callers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          def run(*args):
              return subprocess.run(args, check=True, text=True, capture_output=True).stdout

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, (path, old, text.count(old))
              p.write_text(text.replace(old, new, 1))

          branch = 'refactor/reference-set-test-support'
          assert not run('git', 'ls-remote', '--heads', 'origin', branch).strip(), 'Refusing to overwrite existing branch'
          run('git', 'switch', '-c', branch)
          rpc = Path('crates/rpc/src/compat_manifest.rs')
          assert run('git', 'hash-object', str(rpc)).strip() == 'b50547edcb1a1152db662861723a8eb01f25b650'
          text = rpc.read_text()
          start = text.index('/// The corpus identifiers every reference set must carry.')
          end = text.index('#[cfg(test)]\nmod tests {', start)
          reference = text[start:end]
          support = Path('bin/bitcoin-rs/tests/support/reference_set.rs')
          assert not support.exists()
          support.write_text(
              '//! REF-01..REF-07: reference identities used by process and formal gates.\n'
              '//! The production RPC module owns the embedded manifest, not test orchestration.\n\n'
              'use bitcoin_rs_rpc::compat_manifest::MANIFEST_TOML;\n\n' + reference
          )
          text = text[:start] + text[end:]
          old = ('//! The `[reference]` table is checked, not just read: [`ReferenceSet`] (via\n'
                 '//! [`load_reference_set`] and [`reference_set`]) loads it into typed\n'
                 '//! identities and rejects a reference that is only a version label, carries a\n'
                 '//! malformed digest, drops a required corpus, or confuses the released product\n'
                 '//! with the 31.99.x kernel tree it links for oracle evidence.\n')
          assert text.count(old) == 1
          text = text.replace(old, '//! Reference identities and fixture validation are owned by\n//! `bin/bitcoin-rs/tests/support/reference_set.rs` (REF-01..REF-07).\n')
          rpc.write_text(text)
          replace('bin/bitcoin-rs/tests/support/mod.rs',
                  'pub(crate) mod process_node;\n',
                  'pub(crate) mod process_node;\npub(crate) mod reference_set;\n')
          replace('bin/bitcoin-rs/tests/support/process_node.rs',
                  'use bitcoin_rs_rpc::compat_manifest::reference_set;',
                  'use super::reference_set::reference_set;')
          replace('bin/bitcoin-rs/tests/overhaul_process_harness.rs',
                  'use bitcoin_rs_rpc::compat_manifest::reference_set;',
                  'use support::reference_set::reference_set;')
          replace('bin/bitcoin-rs/tests/overhaul_reference_set.rs',
                  'use bitcoin_rs_rpc::compat_manifest::{\n    CorpusCustody, MANIFEST_TOML, ReferenceError, Status, load_reference_set, reference_set,\n};',
                  'mod support;\n\nuse bitcoin_rs_rpc::compat_manifest::{MANIFEST_TOML, Status};\nuse support::reference_set::{CorpusCustody, ReferenceError, load_reference_set, reference_set};')
          replace('bin/bitcoin-rs/tests/gates/g20_formal_models.rs',
                  'use bitcoin_rs_rpc::compat_manifest::{ReferenceSet, reference_set};',
                  '#[path = "../support/mod.rs"]\nmod support;\n\nuse support::reference_set::{ReferenceSet, reference_set};')
          replace('bin/bitcoin-rs/Cargo.toml', '[dev-dependencies]\n',
                  '[dev-dependencies]\nthiserror.workspace = true\n')
          replace('crates/rpc/Cargo.toml', 'toml.workspace = true\n', '')
          replace('crates/rpc/Cargo.toml', '[dev-dependencies]\n',
                  '[dev-dependencies]\ntoml.workspace = true\n')
          p = Path('docs/contracts/reference-set.md')
          doc = p.read_text()
          assert 'crates/rpc/src/compat_manifest.rs' in doc
          p.write_text(doc.replace('crates/rpc/src/compat_manifest.rs',
                                   'bin/bitcoin-rs/tests/support/reference_set.rs'))

          # Cargo may reconcile inherited workspace edges, but no external package
          # version, checksum, source, or dependency record may change in this move.
          lock = Path('Cargo.lock')
          before = tomllib.loads(lock.read_text())
          result = subprocess.run(['cargo', 'metadata', '--format-version', '1'],
                                  text=True, stdout=subprocess.DEVNULL)
          assert result.returncode == 0, 'metadata failed'
          after = tomllib.loads(lock.read_text())
          external = lambda data: [p for p in data['package'] if 'source' in p]
          assert external(before) == external(after), 'Refusing external dependency changes'

          paths = [str(rpc), str(support), 'bin/bitcoin-rs/tests/support/mod.rs',
                   'bin/bitcoin-rs/tests/support/process_node.rs',
                   'bin/bitcoin-rs/tests/overhaul_process_harness.rs',
                   'bin/bitcoin-rs/tests/overhaul_reference_set.rs',
                   'bin/bitcoin-rs/tests/gates/g20_formal_models.rs',
                   'bin/bitcoin-rs/Cargo.toml', 'crates/rpc/Cargo.toml',
                   'docs/contracts/reference-set.md', 'Cargo.lock']
          subprocess.run(['cargo', 'fmt', '--all'], check=True)
          # Formatting unrelated inherited files is not part of this PR.
          for path in run('git', 'diff', '--name-only').splitlines():
              if path not in paths:
                  run('git', 'restore', '--worktree', '--', path)
          run('git', 'diff', '--check')
          print(run('git', 'diff', '--stat'), flush=True)
          print(run('git', 'diff', '--', 'Cargo.lock'), flush=True)
          # Every Rust use of the removed API must now resolve through support.
          for path in Path('.').rglob('*.rs'):
              if 'target' in path.parts or '.git' in path.parts:
                  continue
              source = path.read_text()
              assert 'compat_manifest::reference_set' not in source, path
              assert 'compat_manifest::{ReferenceSet' not in source, path
          run('git', 'add', '--', *paths)
          run('git', '-c', 'user.name=github-actions[bot]',
              '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com',
              'commit', '-m', 'refactor(test-support): move reference identities with their consumers')
          run('git', 'push', 'origin', 'HEAD:refs/heads/' + branch)
          print('PUBLISHED_BRANCH=' + branch, flush=True)
          print('PUBLISHED_SHA=' + run('git', 'rev-parse', 'HEAD').strip(), flush=True)
          PY
      - name: Reference identity regressions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_reference_set
      - name: Compile process and formal consumers
        if: ${{ !cancelled() }}
        run: cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_process_harness --test g20_formal_models --no-run
      - name: Strict consumer lint
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p bitcoin-rs --no-default-features --features fjall --all-targets -- -D warnings
