name: node-refactor-workbench
on:
  push:
    branches: [workbench/node-modularity-20260910]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d370a6c8f0ebf06e11058a67134636c5a2b4df00
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Export compiler
        run: |
          set -euo pipefail
          mkdir -p /tmp/node-refactor-tooling
          toolchain=$(dirname "$(dirname "$(rustup which rustc)")")
          tar -C "$toolchain" -czf /tmp/node-refactor-tooling/toolchain.tar.gz --exclude=share/doc --exclude=lib/rustlib/src bin lib etc share
          rustc -Vv > /tmp/node-refactor-tooling/rustc.txt
      - name: Resolve offline build inputs and record lockfile delta
        run: |
          set -euo pipefail
          cargo fetch
          git diff -- Cargo.lock > /tmp/node-refactor-tooling/lockfile.patch
          cp Cargo.lock /tmp/node-refactor-tooling/resolved-Cargo.lock
          tar -C "$HOME/.cargo" -czf /tmp/node-refactor-tooling/registry.tar.gz registry
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: node-refactor-tooling
          path: /tmp/node-refactor-tooling
          compression-level: 0
          retention-days: 1
