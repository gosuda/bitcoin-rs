name: node-breaking-workbench
on:
  push:
    branches: [automation/node-breaking-workbench-20260910]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 007d085332c5ce11beb2bd7a432ed681e0e218b1
          persist-credentials: false
      - name: Snapshot pinned source
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/node-breaking-source.tar.gz"
          rustc --version || true
          cargo --version || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-breaking-source
          path: ${{ runner.temp }}/node-breaking-source.tar.gz
          retention-days: 1
