name: node-mod-workbench

on:
  push:
    branches:
      - agent/node-mod-workbench

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply state modularization
        run: |
          python .github/refactor_state.py
          cargo fmt --all
          git diff --check
          tar -czf /tmp/state-refactor.tgz crates/node/src/state.rs crates/node/src/state
      - name: Check node
        run: cargo check -p bitcoin-rs-node --no-default-features --features fjall,zmq
      - name: Clippy node
        run: cargo clippy -p bitcoin-rs-node --no-default-features --features fjall,zmq --all-targets -- -D warnings
      - name: State tests
        run: cargo test -p bitcoin-rs-node --no-default-features --features fjall,zmq --lib state:: -- --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-refactor
          path: /tmp/state-refactor.tgz
          retention-days: 1
