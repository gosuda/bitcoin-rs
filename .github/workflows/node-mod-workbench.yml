name: node-mod-workbench

on:
  push:
    branches: [agent/node-mod-workbench]
    paths:
      - .github/node-publish-plan.json
      - .github/workflows/node-mod-workbench.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_TEST_OPT_LEVEL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt,clippy
      - name: Validate every exact tree before publishing commit objects
        run: |
          cp .github/publish-node.py /tmp/publish-node.py
          python /tmp/publish-node.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-publication
          path: /tmp/node-publication.json
          retention-days: 7
