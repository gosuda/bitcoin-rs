name: node-mod-workbench

on:
  push:
    branches:
      - agent/node-mod-workbench

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt,clippy
      - name: Export pinned compiler and lint tools
        run: |
          rustc --version --verbose > /tmp/RUST_VERSION
          tar --exclude='lib/rustlib/src' --exclude='lib/rustlib/manifest-*' -czf /tmp/rust-tools-195.tgz -C "$(rustc --print sysroot)" bin lib
          sha256sum /tmp/rust-tools-195.tgz > /tmp/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tools-195
          path: |
            /tmp/rust-tools-195.tgz
            /tmp/RUST_VERSION
            /tmp/SHA256SUMS
          compression-level: 0
          retention-days: 1
