name: Prepare PR 680 follow-ups
on:
  push:
    branches: [automation/pr680-followups-20260910]
permissions:
  contents: write
concurrency:
  group: prepare-pr680-followups-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [p2p, rpc]
    env:
      KIND: ${{ matrix.kind }}
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f211c2f99174cdc41ffac0a6cc5d15013a1eb961
          path: candidate
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt,clippy
      - name: Apply exact reviewed edits
        run: python3 tooling/.github/prepare-pr680-followups.py "$KIND" candidate
      - name: Format only changed Rust files and publish new branch
        id: publish
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rust_files < <(git diff --name-only -- '*.rs')
          rustfmt +stable --edition 2024 "${rust_files[@]}"
          git diff --check
          branch="fix/pr680-${KIND}-followup-20260910"
          if git ls-remote --exit-code --heads origin "$branch"; then
            echo "Refusing to overwrite existing branch $branch" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$KIND" = p2p ]; then
            git add crates/p2p/src/inv.rs crates/p2p/src/dispatch.rs docs/policies/p2p-compatibility.md
            git commit -m 'fix(p2p): honor transaction witness requests and serialization'
          else
            git add crates/rpc/src/handlers/tx.rs docs/policies/mempool-policy.md
            git commit -m 'fix(rpc): retain package prevout scripts for sigop accounting'
          fi
          git diff --check HEAD^
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
          printf 'Published `%s` at `%s`, based on `%s`.\n' "$branch" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)" >> "$GITHUB_STEP_SUMMARY"
      - name: Focused library regressions
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: candidate
        run: cargo +stable test --locked -p "bitcoin-rs-$KIND" --lib
      - name: Compatibility regression suite
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: candidate
        shell: bash
        run: |
          if [ "$KIND" = p2p ]; then
            cargo +stable test --locked -p bitcoin-rs-p2p --test core_compat
          else
            cargo +stable test --locked -p bitcoin-rs-rpc --test policy_contract --test transaction_methods
          fi
      - name: Strict scoped Clippy
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: candidate
        run: cargo +stable clippy --locked -p "bitcoin-rs-$KIND" --all-targets -- -D warnings
      - name: Formatting and untouched checkout
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: candidate
        shell: bash
        run: |
          cargo +stable fmt --all -- --check
          git diff --check
          test -z "$(git status --porcelain)"
