name: Prepare P2P witness follow-up
on:
  push:
    branches: [automation/pr680-followups-20260910]
permissions:
  contents: write
concurrency:
  group: prepare-pr680-witness-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f211c2f99174cdc41ffac0a6cc5d15013a1eb961
          path: candidate
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt,clippy
      - name: Apply reviewed P2P edits and update node test consumer
        run: python3 tooling/.github/extend-p2p.py p2p candidate
      - name: Format changed Rust files and publish independent branch
        id: publish
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rust_files < <(git diff --name-only -- '*.rs')
          rustfmt +stable --edition 2024 "${rust_files[@]}"
          git diff --check
          branch=fix/pr680-p2p-witness-20260910
          if git ls-remote --exit-code --heads origin "$branch"; then
            echo "Refusing to overwrite existing branch $branch" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/p2p/src/inv.rs crates/p2p/src/dispatch.rs crates/node/tests/tx_ingress_e2e.rs docs/policies/p2p-compatibility.md
          git commit -m 'fix(p2p): honor transaction witness requests and serialization'
          git diff --check HEAD^
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$branch"
          git show --stat --oneline HEAD
          printf 'Published `%s` at `%s`, based on `%s`.\n' "$branch" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)" >> "$GITHUB_STEP_SUMMARY"
      - name: P2P library and compatibility regressions
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: candidate
        run: cargo +stable test --locked -p bitcoin-rs-p2p --lib --test core_compat
      - name: Node transaction-ingress integration regressions
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: candidate
        run: cargo +stable test --locked -p bitcoin-rs-node --no-default-features --features fjall --test tx_ingress_e2e
      - name: Strict scoped P2P Clippy
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: candidate
        run: cargo +stable clippy --locked -p bitcoin-rs-p2p --all-targets -- -D warnings
      - name: Formatting and untouched checkout
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: candidate
        shell: bash
        run: |
          cargo +stable fmt --all -- --check
          git diff --check
          test -z "$(git status --porcelain)"
