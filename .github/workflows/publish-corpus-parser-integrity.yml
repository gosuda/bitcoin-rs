name: publish-corpus-parser-integrity

on:
  push:
    branches: [automation/corpus-parser-publish-20260910]
    paths:
      - .github/workflows/publish-corpus-parser-integrity.yml
      - .github/scripts/publish-corpus-parser-integrity.py

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d493b5dc24a1d3d10a9158caec2739e9f2741996
          fetch-depth: 0
      - name: Apply and publish reviewed corpus parser patch
        shell: bash
        run: |
          git fetch origin refs/heads/automation/corpus-parser-publish-20260910:refs/remotes/origin/automation/corpus-parser-publish-20260910
          python3 <(git show origin/automation/corpus-parser-publish-20260910:.github/scripts/publish-corpus-parser-integrity.py)
      - name: Campaign corpus contract tests
        run: python3 tools/campaign-corpus/test_corpus.py
      - name: Python syntax and clean tree
        run: |
          python3 -m py_compile tools/campaign-corpus/corpus.py tools/campaign-corpus/test_corpus.py
          git diff --exit-code
