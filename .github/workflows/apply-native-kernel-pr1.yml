name: Temporary native-kernel patch applicator

on:
  push:
    branches:
      - agent/213-segwit-v0-raw-sighash-ff965

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply prepared patch and remove staging
        shell: bash
        env:
          BASE_SHA: ff96503212be41acc10252ebdbc8b97eaccf42a2
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          cat .agent/native-kernel-pr1.part0* > /tmp/native-kernel-pr1.patch
          git apply --check /tmp/native-kernel-pr1.patch
          git apply /tmp/native-kernel-pr1.patch
          rm -f .agent/native-kernel-pr1.part0* .github/workflows/apply-native-kernel-pr1.yml
          rmdir .agent 2>/dev/null || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(script): preserve raw segwit v0 sighash values"
          git push origin "HEAD:${GITHUB_REF_NAME}"
