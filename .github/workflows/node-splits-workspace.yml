name: Node splits workspace
on:
  push:
    branches: [automation/node-splits-20260911]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e6c5eae02738260b5b7240738323098afd6d7c5b
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Fetch locked public dependencies and archive offline tools
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          mkdir -p /tmp/node-offline "$HOME/.cargo/git"
          tar --zstd -cf /tmp/node-offline/toolchain.tar.zst -C "$HOME/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu" bin lib libexec
          tar --zstd -cf /tmp/node-offline/registry.tar.zst -C "$HOME/.cargo" registry/cache registry/index git
          sha256sum /tmp/node-offline/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-offline-toolchain
          path: /tmp/node-offline/
          compression-level: 0
          retention-days: 2
