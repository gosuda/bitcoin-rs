name: Node splits workspace
on:
  push:
    branches: [automation/node-splits-20260911]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
      - name: Archive stable Rust tools without credentials or runner state
        run: |
          mkdir -p /tmp/node-stable
          tar --zstd -cf /tmp/node-stable/toolchain.tar.zst -C "$HOME/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu" bin lib libexec
          sha256sum /tmp/node-stable/toolchain.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-offline-stable
          path: /tmp/node-stable/
          compression-level: 0
          retention-days: 2
