name: Node split workbench
on:
  push:
    branches: [automation/node-splits-a1178cc-20260911]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a1178cc884e42b953a041d0c139bc47814b7ccae
          persist-credentials: false
      - name: Archive tracked source and offline parser wheels
        run: |
          mkdir -p /tmp/node-split-input
          git archive --format=tar.gz --output=/tmp/node-split-input/source.tar.gz HEAD
          git ls-tree -r HEAD > /tmp/node-split-input/source-tree.txt
          python3 -m pip download --only-binary=:all: --python-version 311 --platform manylinux2014_x86_64 --implementation cp --abi cp311 --no-deps --dest /tmp/node-split-input tree-sitter==0.25.2 tree-sitter-rust==0.24.0
      - uses: actions/upload-artifact@v4
        with:
          name: node-split-input-a1178cc
          path: /tmp/node-split-input
          retention-days: 1
