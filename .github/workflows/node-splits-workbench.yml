name: Node split workbench
on:
  push:
    branches: [automation/node-splits-a1178cc-20260911]
permissions:
  contents: read
jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Install the pinned syntax parser
        run: python3 -m pip install tree-sitter==0.25.2 tree-sitter-rust==0.24.0
      - name: Refactor and validate complete source groups
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/node-split-target
        run: python3 .github/node-splits/refactor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-split-validated-source
          path: ${{ runner.temp }}/node-split-results
          retention-days: 1
