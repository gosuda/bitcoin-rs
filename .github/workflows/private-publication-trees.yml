name: Stabilization proof attribution
on:
  push:
    branches: [stabilize/private-publication-trees-20261124]
permissions:
  contents: read
concurrency:
  group: publication-trees-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  RUSTUP_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
jobs:
  assemble:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build product trees with Git and the actual generators
        run: |
          set -euo pipefail
          git config user.name "Stabilization verification"
          git config user.email "stabilization-verification@users.noreply.github.com"
          git fetch --no-tags origin 04d540799ac6d3ef5d4c51a15a319c11d448e75f c9510d7dd9cb13ee78f48145f833944accfb53e6 4ec8cb8129ca4343e36c071151d5c0a3cd2d04ae
          rustup component add rustfmt --toolchain stable
          merge_source() {
            local source="$1"
            if ! git merge --no-ff --no-edit "$source"; then
              local conflicts
              conflicts="$(git diff --name-only --diff-filter=U)"
              test -n "$conflicts"
              while IFS= read -r path; do
                case "$path" in
                  docs/contracts/evidence-index.md|docs/contracts/README.md) ;;
                  *) git diff -- "$path"; exit 1 ;;
                esac
              done <<< "$conflicts"
              git checkout --ours -- docs/contracts/evidence-index.md docs/contracts/README.md
              cargo run --locked -p contract-index
              git add docs/contracts/evidence-index.md docs/contracts/README.md
              git commit --no-edit
            fi
          }
          export_product() {
            local phase="$1" base="$2"
            cargo +stable fmt --all
            cargo run --locked -p contract-index
            cargo run --locked -p contract-index -- --check
            git diff --check
            git add -u
            test -z "$(git ls-files '.github/workflows/private-*.yml')"
            printf 'PRODUCT_PHASE %s\nPRODUCT_TREE %s\n' "$phase" "$(git write-tree)"
            node - "$base" <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const cp = require('node:child_process');
          const base = process.argv[2];
          const paths = cp.execFileSync('git', ['diff', '--cached', '--name-only', '-z', base], {encoding:'utf8'}).split('\0').filter(Boolean);
          for (const path of paths) {
            if (!fs.existsSync(path)) throw new Error('unexpected deletion: ' + path);
            const bytes = fs.readFileSync(path);
            const sha = crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
            console.log('PRODUCT_FILE ' + JSON.stringify({path, sha, size:bytes.length}));
            for (let offset=0; offset<bytes.length; offset+=12000) console.log('PRODUCT_CHUNK ' + JSON.stringify({path, offset, data:bytes.subarray(offset,offset+12000).toString('base64')}));
          }
          NODE
            if ! git diff --cached --quiet; then git commit -m "Regenerate the $phase product evidence"; fi
          }
          git switch --detach 04d540799ac6d3ef5d4c51a15a319c11d448e75f
          export_product root c1da8a756b0e290d37d444ede6400e9e2a06b896
          merge_source 2bc173b2b0a40a9323bdad9ce9cf4dbbe0374cba
          export_product cache 2bc173b2b0a40a9323bdad9ce9cf4dbbe0374cba
          merge_source fb43a9b3980d7d4cdffeb1df3020c569e4176767
          export_product raw fb43a9b3980d7d4cdffeb1df3020c569e4176767
          publication_raw="$(git rev-parse HEAD)"
          git switch --detach c9510d7dd9cb13ee78f48145f833944accfb53e6
          merge_source "$publication_raw"
          merge_source 4ec8cb8129ca4343e36c071151d5c0a3cd2d04ae
          export_product final c9510d7dd9cb13ee78f48145f833944accfb53e6
