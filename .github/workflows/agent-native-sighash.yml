name: Agent native sighash integration

on:
  push:
    branches:
      - agent/166-native-sighash-precompute-ff965

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt,clippy

      - name: Apply focused T07 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/agent_native_sighash.py .github/agent_native_sighash_extra.py .github/agent_native_sighash_fix.py
          python3 .github/agent_native_sighash.py
          python3 .github/agent_native_sighash_extra.py
          python3 .github/agent_native_sighash_fix.py
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            crates/consensus/src/lib.rs \
            crates/consensus/src/verify_tx.rs \
            crates/consensus/tests/overhaul_prepared_inputs.rs \
            crates/mempool/src/gateway.rs \
            crates/primitives/src/sighash.rs \
            crates/script/src/checker.rs \
            crates/script/src/interpreter.rs | sort)"
          test "$changed" = "$expected" || {
            echo "Unexpected changed paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

      - name: Verify native prepared-input path
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p bitcoin-rs-primitives
          cargo test --locked -p bitcoin-rs-script --test verifier_boundaries
          cargo test --locked -p bitcoin-rs-script --test core_vectors
          cargo test --locked -p bitcoin-rs-consensus --no-default-features --test overhaul_prepared_inputs -- --nocapture
          cargo test --locked -p bitcoin-rs-mempool --lib
          cargo clippy --locked -p bitcoin-rs-primitives -p bitcoin-rs-script -p bitcoin-rs-consensus -p bitcoin-rs-mempool --all-targets -- -D warnings

      - name: Commit verified patch and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-native-sighash.yml .github/agent_native_sighash.py .github/agent_native_sighash_extra.py .github/agent_native_sighash_fix.py
          git add \
            crates/consensus/src/lib.rs \
            crates/consensus/src/verify_tx.rs \
            crates/consensus/tests/overhaul_prepared_inputs.rs \
            crates/mempool/src/gateway.rs \
            crates/primitives/src/sighash.rs \
            crates/script/src/checker.rs \
            crates/script/src/interpreter.rs
          git config user.name "metaphorics"
          git config user.email "152830360+metaphorics@users.noreply.github.com"
          git commit -m "perf(consensus): share prepared coins and sighash midstates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
