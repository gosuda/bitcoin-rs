name: ci-main

# Deep lanes: everything that needs the C++ toolchain (libbitcoinkernel),
# nightly, lockfile mutation, or long runtimes. Never triggered by pull
# requests -- the fast gate in ci.yml is the only required-status job set for
# PRs.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  FULL_NODE_FEATURES: "rocksdb,fjall,redb,mdbx,kernel"

jobs:
  full-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake
        id: native_deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The retired formal/reference fixture harness is intentionally absent.
      # Keep the retained deep checks independent so one failure does not hide
      # later diagnostics.
      - name: Kernel consensus tests including ignored vectors
        if: ${{ !cancelled() && steps.native_deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo test -p bitcoin-rs-consensus --no-fail-fast -- --include-ignored
      - name: Full-node binary Clippy
        if: ${{ !cancelled() && steps.native_deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: |
          cargo clippy -p bitcoin-rs --all-targets \
            --no-default-features --features "${FULL_NODE_FEATURES}" \
            -- -D warnings
      - name: Kernel node Clippy
        if: ${{ !cancelled() && steps.native_deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo clippy -p bitcoin-rs-node --all-targets -- -D warnings
      - name: Kernel consensus Clippy
        if: ${{ !cancelled() && steps.native_deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo clippy -p bitcoin-rs-consensus --all-targets -- -D warnings
      - name: Full-node binary tests
        if: ${{ !cancelled() && steps.native_deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: |
          cargo test -p bitcoin-rs --no-fail-fast \
            --no-default-features --features "${FULL_NODE_FEATURES}"

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: |
          cargo bench -p bitcoin-rs-consensus --no-run --no-default-features --bench merkle
          cargo bench -p bitcoin-rs-utxo     --no-run --no-default-features --features fjall --bench utxo_commit
          cargo bench -p bitcoin-rs-node     --no-run --no-default-features --features fjall --bench sync_pipeline
          cargo bench -p bitcoin-rs-node     --no-run --no-default-features --features fjall --bench chainstate_journal

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-fuzz
        with:
          tool: cargo-fuzz
      - run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
      - run: |
          for target in p2p_message block_decode tx_decode script_eval utxo_snapshot; do
            cargo +nightly fuzz run "$target" --target x86_64-unknown-linux-gnu -- -runs=10000
          done

  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo +nightly update -Zdirect-minimal-versions
      - run: cargo +nightly check --workspace --all-targets

  feature-combinations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@39fa37110d4f0b0312682d675dbf52e40db30cb4 # cargo-hack
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake
      - run: cargo hack check --each-feature --no-dev-deps -p bitcoin-rs-node -p bitcoin-rs-consensus -p bitcoin-rs-storage

  deny-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          rust-version: "stable"
          arguments: --workspace --no-default-features --features ${{ env.FULL_NODE_FEATURES }}

  kernel-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test -p bitcoin-rs-consensus --features kernel --test kernel_block_parity --test kernel_vector_parity -- --nocapture
