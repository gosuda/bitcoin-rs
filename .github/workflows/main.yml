name: ci-main

# Post-merge production and reference evidence: full-node tests, benchmark
# builds, native-script checks, comparator corpus, kernel oracle, and Core
# differential. Portable PR/merge-queue checks live in ci.yml, the production
# Clippy merge gate in ci-merge-gate.yml, fuzz execution in daily-fuzz.yml,
# and compatibility campaigns in compatibility-campaign.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The deep validation lanes only need to read repository contents. Keep the
# token scope explicit instead of inheriting repository defaults.
permissions:
  contents: read

# One fixed group: deep `main` generations run one at a time, newest waiting
# behind the current one. `cancel-in-progress: false` protects the *running*
# generation only; the default pending behavior would still cancel an older
# waiting run when a newer one arrives, silently dropping that merged
# commit's CI record. `queue: max` retains up to 100 pending generations
# (only arrivals beyond the queue cap are rejected), so evidence is bounded
# in concurrency and dropped only when 100 generations are already pending.
#
# Rationale (measured 2026-09-30, issue #1349): with a per-run group, every
# `main` push fanned out all six deep lanes at once and stacked across rapid
# merges (14 concurrent workflow runs at deep-job start, max 30). Those
# long-running generations consumed the GitHub-hosted runner pool and delayed
# short, latency-sensitive PR jobs — `fmt`/`deny`/`clippy` execute in
# 10-60 s but queued for up to ~34 minutes behind them. Serializing complete
# `main` runs caps deep fan-out at six runners while preserving every
# commit's evidence.
concurrency:
  group: ci-main
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Full-node production feature set: all three storage backends plus the
  # bitcoinkernel script-verification engine (built from C++).
  FULL_NODE_FEATURES: "rocksdb,fjall,redb,kernel"

jobs:
  full-node:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The kernel engine is built from C++ and rocksdb's bindgen needs
      # libclang; install the native prerequisites up front.
      - uses: ./.github/actions/native-deps
        id: native_deps
      # nextest + mold guard for the binary test pass (mold itself is
      # already installed by native-deps).
      - uses: ./.github/actions/test-deps
        id: test_deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Provision pinned Core
        id: fixtures
        run: bash scripts/provision-ci-reference-fixtures.sh core
      # Keep checks independent and run them before the long binary/formal
      # suite. No failure is tolerated, but one must not conceal later ones.
      # Consensus fixture corpus includes the large deterministic vectors.
      - name: Kernel consensus tests including ignored vectors
        if: ${{ !cancelled() && steps.native_deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p bitcoin-rs-consensus --features kernel --no-fail-fast -- --include-ignored
      # -p bitcoin-rs propagates all backends and kernel through the binary's
      # feature table; virtual-workspace --features would not do so.
      - name: Full-node binary Clippy
        if: ${{ !cancelled() && steps.native_deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: |
          cargo clippy --locked -p bitcoin-rs --all-targets \
            --no-default-features --features "${FULL_NODE_FEATURES}" \
            -- -D warnings
      # The binary's all-target pass does not lint dependency test targets.
      - name: Kernel node Clippy
        if: ${{ !cancelled() && steps.native_deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --locked -p bitcoin-rs-node --all-targets --features kernel -- -D warnings
      # Include consensus's kernel-gated tests and kernel_verify_spike example.
      - name: Kernel consensus Clippy
        if: ${{ !cancelled() && steps.native_deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --locked -p bitcoin-rs-consensus --all-targets --features kernel -- -D warnings
      # Formal checks run independently in model-check-manual. Runs under
      # cargo-nextest's pooled scheduler like the PR test lanes.
      - name: Full-node binary tests
        if: ${{ !cancelled() && steps.native_deps.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.fixtures.outcome == 'success' && steps.test_deps.outcome == 'success' }}
        run: |
          cargo nextest run --locked --no-fail-fast -p bitcoin-rs \
            --no-default-features --features "${FULL_NODE_FEATURES}"
      - name: Preserve public process compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: process-compatibility-full-node-${{ github.run_attempt }}
          path: target/process-harness/**
          if-no-files-found: warn
          retention-days: 7

  bench-smoke:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: toolchain
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The full-node feature set compiles the C++ kernel engine as a
      # capability (selection is `validation.engine` at runtime), so this lane
      # installs the native prerequisites up front (mold is included for the
      # linker).
      - name: Kernel prerequisites
        id: kernel_deps
        uses: ./.github/actions/native-deps
      # Reuse this lane's C++ prerequisites for the focused kernel
      # regressions; the fast gate's rust job exercises the same targets with
      # the native backend.
      - name: Kernel-enabled consensus regressions
        run: |
          cargo test --locked -p bitcoin-rs-consensus \
            --no-default-features --features kernel \
            --test witness_sigop_activation --test validation_engine
      # The `--no-run` passes below are compile-and-link gates only --
      # measured executions remain release evidence outside CI. They build
      # under the `quickstart` profile (opt-level 3, no fat LTO, 16
      # codegen-units) rather than `bench` (fat LTO, codegen-units 1): the
      # fat-LTO merge serializes the whole full-node graph and alone cost
      # ~14 minutes, while `--profile dev` would not catch optimization-level
      # build errors. `cargo bench` accepts any named profile.
      - run: |
          cargo bench --locked -p bitcoin-rs --no-run --profile quickstart \
            --no-default-features --features "${FULL_NODE_FEATURES}"
      # Crate-level UTXO bench target is unreachable from -p bitcoin-rs; compile
      # the production-allocator benchmark so bench breakage is visible to CI.
      - run: cargo bench --locked -p bitcoin-rs-utxo --no-run --profile quickstart
      # The chainstate replay gate is an explicit harness: compile it on every
      # main push, while measured executions remain release evidence.
      - run: |
          cargo bench --locked -p bitcoin-rs-node --no-run --profile quickstart \
            --no-default-features --features fjall --bench chainstate_journal
      - name: Benchmark evidence validation
        run: cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall --bench evidence
      # Retained crate-level benchmarks without kernel (this job's previous
      # whole content): merkle, utxo_commit under fjall, sync_pipeline, and
      # the mining candidate are not covered by the compiles above.
      - run: |
          cargo bench --locked -p bitcoin-rs-consensus --no-run --no-default-features --bench merkle --profile quickstart
          cargo bench --locked -p bitcoin-rs-utxo     --no-run --no-default-features --features fjall --bench utxo_commit --profile quickstart
          cargo bench --locked -p bitcoin-rs-mining   --no-run --no-default-features --bench candidate --profile quickstart
          cargo bench --locked -p bitcoin-rs-node     --no-run --no-default-features --features fjall --bench sync_pipeline --profile quickstart

      # Native script tests do not compile this feature-gated oracle. Exercise
      # it on `main`, with separate build output and retained diagnostics.
      - name: SegWit-v0 kernel parity
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.kernel_deps.outcome == 'success' }}
        shell: bash
        env:
          CARGO_TARGET_DIR: target/script-kernel-oracle
        run: |
          set -euo pipefail
          mkdir -p target/script-kernel-evidence
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            sha256sum Cargo.lock
          } | tee target/script-kernel-evidence/context.txt
          cargo test --locked -p bitcoin-rs-script --no-default-features \
            --features kernel --test segwit_v0_sighash_edges -- --nocapture \
            2>&1 | tee target/script-kernel-evidence/tests.log
      - name: Core-vectors kernel oracle
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.kernel_deps.outcome == 'success' }}
        shell: bash
        env:
          CARGO_TARGET_DIR: target/script-kernel-oracle
        run: |
          set -euo pipefail
          mkdir -p target/script-kernel-evidence
          cargo test --locked -p bitcoin-rs-script --no-default-features \
            --features kernel --test core_vectors -- --nocapture \
            2>&1 | tee target/script-kernel-evidence/core_vectors.log
      - name: SegWit-v0 kernel Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.kernel_deps.outcome == 'success' }}
        shell: bash
        env:
          CARGO_TARGET_DIR: target/script-kernel-oracle
        run: |
          set -euo pipefail
          mkdir -p target/script-kernel-evidence
          cargo clippy --locked -p bitcoin-rs-script --no-default-features \
            --features kernel --test segwit_v0_sighash_edges -- -D warnings \
            2>&1 | tee target/script-kernel-evidence/clippy.log
      - name: Preserve kernel script evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: script-kernel-${{ github.run_attempt }}
          path: target/script-kernel-evidence/
          if-no-files-found: warn
          retention-days: 7

  # The same permanent script tests run without external reference setup.
  # Record compiler identity and retain both successful and failed output.
  native-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: target/script-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: toolchain
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Native script tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/script-native-evidence
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            sha256sum Cargo.lock
          } | tee target/script-native-evidence/context.txt
          cargo test --locked -p bitcoin-rs-script --no-default-features \
            --no-fail-fast -- --nocapture 2>&1 | tee target/script-native-evidence/tests.log
      - name: Native script Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/script-native-evidence
          cargo clippy --locked -p bitcoin-rs-script --no-default-features \
            --all-targets -- -D warnings 2>&1 | tee target/script-native-evidence/clippy.log
      - name: Preserve native script evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: script-native-${{ github.run_attempt }}
          path: target/script-native-evidence/
          if-no-files-found: warn
          retention-days: 7

  # Comparator campaign behavioral tests and the C150/Cmodern corpus freeze.
  # Pure Python, self-contained -- no bitcoind, no external services. The
  # comparator tests use typing.TypeIs (Python 3.13+); actions/setup-python
  # downloads the runtime from GitHub's release hosting, which is a
  # first-party action but network-dependent.
  comparator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: |
          cd tools/benchmark-campaign
          for f in test_*.py; do python3 "$f" || exit 1; done
      - run: python3 tools/campaign-corpus/test_corpus.py

  # Kernel oracle differential: with `--features kernel`, replay the committed
  # fixture corpus through libbitcoinkernel AND the Rust path and hard-fail on
  # verdict disagreement. The parity tests cover:
  #   - Block-parse parity (kernel_block_parity: 6 committed mainnet blocks)
  #   - Vector oracle parity (kernel_vector_parity: 121 tx_valid + 84 tx_invalid rows)
  #   - Non-vacuity proof (corruption must go red)
  # The test functions are NOT #[ignore]; do not pass --ignored or they
  # will be skipped.
  kernel-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test --locked -p bitcoin-rs-consensus --features kernel --test kernel_block_parity --test kernel_vector_parity -- --nocapture

  # Main-only (issue #174 / CORE-02): a running Bitcoin Core 31.1 node vs
  # bitcoin-rs on regtest. Complements kernel-oracle (in-process C++ engine)
  # with observable P2P sync and chain-identity RPCs.
  core-differential:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: ./.github/actions/test-deps
      - name: Install pinned bitcoind 31.1
        run: |
          mkdir -p target/core-differential
          scripts/install-bitcoind.sh --print-path \
            2>&1 | tee target/core-differential/install.log
      - name: Build bitcoin-rs (quickstart, portable)
        run: |
          cargo build --locked -p bitcoin-rs --profile quickstart \
            --no-default-features --features fjall,zmq \
            2>&1 | tee target/core-differential/build.log
      - name: Core vs bitcoin-rs P2P and chain-identity differential
        run: |
          scripts/run-p2p-core-interop.sh \
            --bitcoind-command "$(scripts/install-bitcoind.sh --print-path)" \
            --bitcoin-rs-command target/quickstart/bitcoin-rs \
            --workdir "$PWD/target/core-differential/run" \
            --evidence "$PWD/target/core-differential/evidence.json" \
            2>&1 | tee target/core-differential/driver.log
      - name: Preserve Core differential evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-differential-${{ github.run_attempt }}
          path: |
            target/core-differential/*.log
            target/core-differential/evidence.json
            target/core-differential/run/*.log
            target/core-differential/run/core/regtest/debug.log
          if-no-files-found: warn
          retention-days: 7
