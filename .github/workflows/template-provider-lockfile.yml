name: template-provider-lockfile

# The standalone adapter embeds workspace crates; validate source/API changes
# as well as its independent lockfile without adding SRI to the root workspace.
on:
  pull_request:
    branches: ['**']
    paths:
      - 'tools/stratum-sv2/template-provider/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/template-provider-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-provider-lockfile-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo metadata --locked --format-version 1 --manifest-path tools/stratum-sv2/template-provider/Cargo.toml > /dev/null
      - run: cargo test --locked --manifest-path tools/stratum-sv2/template-provider/Cargo.toml
      - run: cargo clippy --locked --manifest-path tools/stratum-sv2/template-provider/Cargo.toml --all-targets -- -D warnings
