name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ── Fast lanes (always run) ──────────────────────────────────────

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@39fa37110d4f0b0312682d675dbf52e40db30cb4 # cargo-deny
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --workspace --features "kernel" check

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - run: ./scripts/ci-pr.sh contracts

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
          # Do not restore cross-commit target metadata into the clippy
          # matrix; stale rmeta can make dependent workspace crates appear
          # to use an older public API.
          cache-targets: false
      - run: ./scripts/ci-pr.sh clippy

  test-crates:
    needs: [fmt, deny, clippy]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      BITCOIN_RS_FUZZ_CORPUS: ${{ github.workspace }}/.fuzz-corpus/corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out shared fuzz corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gosuda/bitcoin-rs-fuzz-corpus
          path: .fuzz-corpus
          persist-credentials: false
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - uses: ./.github/actions/test-deps
      - run: ./scripts/ci-pr.sh test-crates

  # ── Heavy lanes (merge and main only) ────────────────────────────

  test-binary:
    if: github.event_name != 'pull_request'
    needs: [fmt, deny, clippy]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      BITCOIN_RS_FUZZ_CORPUS: ${{ github.workspace }}/.fuzz-corpus/corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out shared fuzz corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gosuda/bitcoin-rs-fuzz-corpus
          path: .fuzz-corpus
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - uses: ./.github/actions/native-deps
      - uses: ./.github/actions/test-deps
      - run: bash scripts/provision-ci-reference-fixtures.sh core
      - run: ./scripts/ci-pr.sh test-binary
      - name: Preserve process compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-compatibility-binary-${{ github.run_attempt }}
          path: |
            target/process-harness/**
            target/compact-blocks-e2e/**
          if-no-files-found: warn
          retention-days: 7

  test-workspace:
    if: github.event_name != 'pull_request'
    needs: [fmt, deny, clippy]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      BITCOIN_RS_FUZZ_CORPUS: ${{ github.workspace }}/.fuzz-corpus/corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out shared fuzz corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gosuda/bitcoin-rs-fuzz-corpus
          path: .fuzz-corpus
          persist-credentials: false
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - uses: ./.github/actions/test-deps
      - run: bash scripts/provision-ci-reference-fixtures.sh core
      - run: ./scripts/ci-pr.sh test-workspace
      - name: Preserve process compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-compatibility-workspace-${{ github.run_attempt }}
          path: |
            target/process-harness/**
            target/compact-blocks-e2e/**
          if-no-files-found: warn
          retention-days: 7

  book:
    if: github.event_name != 'pull_request'
    needs: [fmt, deny, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - name: Install pinned mdbook
        run: cargo install mdbook --locked --version 0.5.4
      - run: ./scripts/ci-pr.sh book

  # ── Aggregate CI result ────────────────────────────────────────
  #
  # PR green is fast feedback only: fmt, deny, contracts, clippy, test-crates.
  # Merge-group green includes test-binary/test-workspace/book before main.
  # Main green is post-merge evidence.

  ci-gate:
    if: always()
    runs-on: ubuntu-latest
    needs: [fmt, deny, contracts, clippy, test-crates, test-binary, test-workspace, book]
    steps:
      - name: Evaluate gate
        run: |
          needs_json='${{ toJSON(needs) }}'

          check() {
            local name="$1" allow_skip="$2"
            local result
            result=$(echo "$needs_json" | jq -r --arg n "$name" '.[$n].result')
            echo "  $name: $result"
            if [[ "$result" == "success" ]]; then
              return 0
            elif [[ "$allow_skip" == "true" && "$result" == "skipped" ]]; then
              return 0
            else
              echo "::error::$name $result"
              return 1
            fi
          }

          echo "Fast lanes:"
          failed=0
          for job in fmt deny contracts clippy test-crates; do
            check "$job" false || failed=1
          done

          echo "Heavy lanes:"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            for job in test-binary test-workspace book; do
              check "$job" true || true
            done
          else
            for job in test-binary test-workspace book; do
              check "$job" false || failed=1
            done
          fi

          if [[ $failed -ne 0 ]]; then
            exit 1
          fi
          echo "Gate passed."
          case "${{ github.event_name }}" in
            pull_request)
              echo 'Fast PR checks passed. The book check, binary, and workspace tests were skipped and run on merge-group requests and main pushes.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            merge_group)
              echo 'Fast and heavy integration checks passed for this merge-group commit. Production/kernel results are reported by ci-merge-gate.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            push)
              echo 'Fast and heavy checks passed as post-merge main evidence.' >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
