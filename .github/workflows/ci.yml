name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Every pull request, not only those based on `main`. A stacked PR targets
    # the branch below it, and `branches: [main]` excluded those by
    # construction.
    branches: ['**']

# Superseded pull-request runs are cancelled when a newer commit lands on the
# same PR. Main pushes use unique groups so no commit loses its CI record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  FULL_NODE_FEATURES: "rocksdb,fjall,redb,mdbx,kernel"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # Keep native profiles independent: one lint failure must not hide the
      # diagnostics from another profile.
      - name: Workspace Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo clippy --workspace --all-targets \
            --exclude bitcoin-rs-consensus --exclude bitcoin-rs-node \
            -- -D warnings
      - name: Native consensus Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo clippy -p bitcoin-rs-consensus \
            --no-default-features --all-targets -- -D warnings
      - name: Native node Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo clippy -p bitcoin-rs-node \
            --no-default-features --features fjall,zmq --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The retired formal/reference fixture harness is intentionally absent.
      # Run each retained profile independently so a failure in one does not
      # hide later diagnostics.
      - name: Native consensus tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test -p bitcoin-rs-consensus --no-default-features --no-fail-fast
      - name: Native node tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo test -p bitcoin-rs-node \
            --no-default-features --features fjall,zmq --no-fail-fast
      - name: RPC tests without default features
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test -p bitcoin-rs-rpc --no-default-features --no-fail-fast
      - name: Workspace tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo test --workspace --no-fail-fast \
            --exclude bitcoin-rs-consensus --exclude bitcoin-rs-node
      - name: Full-backend native binary tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo test -p bitcoin-rs --no-fail-fast \
            --no-default-features --features "rocksdb,fjall,redb,mdbx"

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # Compile every retained benchmark target on PRs. These profiles avoid
      # the kernel feature, so no C++ toolchain is needed.
      - run: |
          cargo bench -p bitcoin-rs-consensus --no-run --no-default-features --bench merkle
          cargo bench -p bitcoin-rs-utxo     --no-run --no-default-features --features fjall --bench utxo_commit
          cargo bench -p bitcoin-rs-node     --no-run --no-default-features --features fjall --bench sync_pipeline
          cargo bench -p bitcoin-rs-node     --no-run --no-default-features --features fjall --bench chainstate_journal

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          rust-version: "stable"
          arguments: --workspace --no-default-features --features ${{ env.FULL_NODE_FEATURES }}

  comparator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: |
          cd tools/benchmark-campaign
          for f in test_*.py; do python3 "$f" || exit 1; done
      - run: python3 tools/campaign-corpus/test_corpus.py
