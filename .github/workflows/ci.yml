name: Optimization evidence

on:
  push:
    branches: [measure/runtime-allocations-20261124]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "8"
  RUSTUP_TOOLCHAIN: "1.100.0"
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  RUST_BACKTRACE: "1"

jobs:
  evidence:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install existing CI prerequisites
        run: bash scripts/ci-setup.sh apt nextest
      - name: Select the pinned Rust toolchain
        run: |
          if ! rustup run 1.100.0 rustc -V >/dev/null 2>&1; then
            rustup toolchain install 1.100.0 --profile minimal --no-self-update
          fi
      - name: Compare baseline and optimized code
        run: bash .ci/optimization-evidence/optimization-evidence.sh
