name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ── Fast lanes (always run) ──────────────────────────────────────

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@39fa37110d4f0b0312682d675dbf52e40db30cb4 # cargo-deny
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --workspace --no-default-features --features "rocksdb,fjall,redb,kernel" check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - run: ./scripts/ci-pr.sh clippy

  test-crates:
    needs: [fmt, deny, clippy]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - uses: ./.github/actions/test-deps
      - run: ./scripts/ci-pr.sh test-crates

  # ── Heavy lanes (merge and main only) ────────────────────────────

  test-binary:
    if: github.event_name != 'pull_request'
    needs: [fmt, deny, clippy]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - uses: ./.github/actions/native-deps
      - uses: ./.github/actions/test-deps
      - run: bash scripts/provision-ci-reference-fixtures.sh core
      - run: ./scripts/ci-pr.sh test-binary
      - name: Preserve process compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: process-compatibility-binary-${{ github.run_attempt }}
          path: target/process-harness/**
          if-no-files-found: warn
          retention-days: 7

  test-workspace:
    if: github.event_name != 'pull_request'
    needs: [fmt, deny, clippy]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
      - uses: ./.github/actions/test-deps
      - run: bash scripts/provision-ci-reference-fixtures.sh core
      - run: ./scripts/ci-pr.sh test-workspace
      - name: Preserve process compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: process-compatibility-workspace-${{ github.run_attempt }}
          path: target/process-harness/**
          if-no-files-found: warn
          retention-days: 7

  # ── Single required check ────────────────────────────────────────
  #
  # On PRs: gates fmt, deny, clippy, test-crates.
  # On merge/main: also gates test-binary, test-workspace.
  # This is the one status check configured in the GitHub ruleset.

  ci-gate:
    if: always()
    runs-on: ubuntu-latest
    needs: [fmt, deny, clippy, test-crates, test-binary, test-workspace]
    steps:
      - name: Evaluate gate
        run: |
          needs_json='${{ toJSON(needs) }}'

          check() {
            local name="$1" allow_skip="$2"
            local result
            result=$(echo "$needs_json" | jq -r --arg n "$name" '.[$n].result')
            echo "  $name: $result"
            if [[ "$result" == "success" ]]; then
              return 0
            elif [[ "$allow_skip" == "true" && "$result" == "skipped" ]]; then
              return 0
            else
              echo "::error::$name $result"
              return 1
            fi
          }

          echo "Fast lanes:"
          failed=0
          for job in fmt deny clippy test-crates; do
            check "$job" false || failed=1
          done

          echo "Heavy lanes:"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            for job in test-binary test-workspace; do
              check "$job" true || true
            done
          else
            for job in test-binary test-workspace; do
              check "$job" false || failed=1
            done
          fi

          if [[ $failed -ne 0 ]]; then
            exit 1
          fi
          echo "Gate passed."
