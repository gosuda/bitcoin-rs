name: script-tools

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: script-tools-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Check tool script syntax
        run: |
          bash -n scripts/fetch-golden.sh
          bash -n scripts/import-qa-assets.sh
          bash -n scripts/fuzz-policy.sh
          bash -n scripts/run-fuzz-campaign.sh
          bash -n scripts/validate-corpus-seeds.sh
      - name: Run offline tool script regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
