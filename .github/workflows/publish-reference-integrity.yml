name: publish-reference-integrity

on:
  push:
    branches: [automation/reference-integrity-publish-20260910]
    paths:
      - .github/workflows/publish-reference-integrity.yml
      - .github/scripts/publish-reference-integrity.py

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f846c7fbeed40e70431cf83ab4f2cb656bf9ea0b
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Apply and publish reviewed reference identity patch
        shell: bash
        run: |
          git fetch origin refs/heads/automation/reference-integrity-publish-20260910:refs/remotes/origin/automation/reference-integrity-publish-20260910
          python3 <(git show origin/automation/reference-integrity-publish-20260910:.github/scripts/publish-reference-integrity.py)
      - name: Reference identity regressions
        run: cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_reference_set
      - name: Compile migrated reference consumers with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_process_harness --test g20_formal_models --no-run
      - name: Strict workspace Clippy
        run: cargo clippy --locked --workspace --all-targets --exclude bitcoin-rs-consensus --exclude bitcoin-rs-node -- -D warnings
      - name: Formatting and clean tree
        run: |
          cargo fmt --all -- --check
          git diff --exit-code
