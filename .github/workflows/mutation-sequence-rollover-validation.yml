name: mutation-sequence-rollover-validation

on:
  push:
    branches: [validation/mutation-sequence-rollover-20260910]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  rollover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b9430763f80f0d7f193d80d094863789d2c84e4d
          path: candidate
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: candidate -> target
          shared-key: mutation-rollover
      - name: Prove the owner regression is red before the correction
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rollover-evidence"
          rustc --version | tee "$RUNNER_TEMP/rollover-evidence/toolchain.txt"
          python3 ../runner/.github/review/mutation_sequence_rollover.py tests
          rustfmt --edition 2024 crates/mempool/src/pool.rs
          set +e
          cargo test --locked -p bitcoin-rs-mempool --lib mutation_sequence_rolls_over_without_losing_in_batch_sequences -- --nocapture > "$RUNNER_TEMP/rollover-evidence/red.log" 2>&1
          status=$?
          set -e
          tail -n 100 "$RUNNER_TEMP/rollover-evidence/red.log"
          test "$status" -ne 0
          grep -q 'test result: FAILED' "$RUNNER_TEMP/rollover-evidence/red.log"
          grep -q 'mutation_sequence_rolls_over_without_losing_in_batch_sequences' "$RUNNER_TEMP/rollover-evidence/red.log"
      - name: Apply one rollover contract and prove the focused test green
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 ../runner/.github/review/mutation_sequence_rollover.py fix
          rustfmt --edition 2024 crates/mempool/src/pool.rs crates/mempool/src/mutation.rs
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {'crates/mempool/src/pool.rs', 'crates/mempool/src/mutation.rs', 'docs/contracts/mempool-mutations.md'}
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected source scope: {actual ^ expected}')
          PY
          git diff > "$RUNNER_TEMP/rollover-evidence/candidate.patch"
          cargo test --locked -p bitcoin-rs-mempool --lib mutation_sequence_rolls_over_without_losing_in_batch_sequences -- --nocapture | tee "$RUNNER_TEMP/rollover-evidence/green-focused.log"
      - name: Run mempool and downstream sequence-consumer tests
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p bitcoin-rs-mempool --lib | tee "$RUNNER_TEMP/rollover-evidence/mempool.log"
          cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall,zmq --test mining | tee "$RUNNER_TEMP/rollover-evidence/mining.log"
          cargo test --locked -p bitcoin-rs-rpc --no-default-features --lib zmq:: | tee "$RUNNER_TEMP/rollover-evidence/zmq.log"
      - name: Run all strict Clippy profiles and formatting
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --exclude bitcoin-rs-consensus --exclude bitcoin-rs-node -- -D warnings | tee "$RUNNER_TEMP/rollover-evidence/clippy-workspace.log"
          cargo clippy --locked -p bitcoin-rs-consensus --no-default-features --all-targets -- -D warnings | tee "$RUNNER_TEMP/rollover-evidence/clippy-consensus.log"
          cargo clippy --locked -p bitcoin-rs-node --no-default-features --features fjall,zmq --all-targets -- -D warnings | tee "$RUNNER_TEMP/rollover-evidence/clippy-node.log"
          cargo fmt --all -- --check | tee "$RUNNER_TEMP/rollover-evidence/fmt.log"
      - name: Publish the source-only candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mempool/src/pool.rs crates/mempool/src/mutation.rs docs/contracts/mempool-mutations.md
          git commit -m 'fix(mempool): make mutation sequence rollover coherent'
          git rev-parse HEAD | tee "$RUNNER_TEMP/rollover-evidence/candidate-sha.txt"
          git ls-tree HEAD crates/mempool/src/pool.rs crates/mempool/src/mutation.rs docs/contracts/mempool-mutations.md | tee "$RUNNER_TEMP/rollover-evidence/blobs.txt"
          git push origin HEAD:refs/heads/followup/mutation-sequence-rollover
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-sequence-rollover-evidence
          path: ${{ runner.temp }}/rollover-evidence
          retention-days: 3
          if-no-files-found: warn
