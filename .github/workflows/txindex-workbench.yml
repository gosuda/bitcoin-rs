name: txindex-refactor-workbench
on:
  push:
    branches: [automation/txindex-workbench-20260911]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export updated main source and exact upstream changes
        run: |
          mkdir -p /tmp/txindex-current
          git archive --format=tar.gz 7f5a460de67965ff36955bab1434c75f080ad384 > /tmp/txindex-current/source.tar.gz
          git diff 8086e3b204a44c50a90d25e678015f690729aba9 7f5a460de67965ff36955bab1434c75f080ad384 > /tmp/txindex-current/upstream.patch
          git log --oneline 8086e3b204a44c50a90d25e678015f690729aba9..7f5a460de67965ff36955bab1434c75f080ad384 > /tmp/txindex-current/upstream-commits.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: txindex-current-source
          path: /tmp/txindex-current/
          retention-days: 1
