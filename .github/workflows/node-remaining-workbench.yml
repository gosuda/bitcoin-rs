name: Node remaining workbench
on:
  push:
    branches: [automation/node-remaining-inspect-20260910]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d370a6c8f0ebf06e11058a67134636c5a2b4df00
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.95.0'
      - name: Export exact source and dependency evidence
        run: |
          mkdir -p /tmp/node-refresh
          git archive --format=tar.gz --output=/tmp/node-refresh/source.tar.gz HEAD
          git cat-file commit HEAD > /tmp/node-refresh/base.commit
          git rev-parse HEAD^{tree} > /tmp/node-refresh/base.tree
          cp Cargo.lock /tmp/node-refresh/original.Cargo.lock
          cargo vendor --versioned-dirs /tmp/node-refresh/vendor > /tmp/node-refresh/vendor.toml
          cp Cargo.lock /tmp/node-refresh/resolved.Cargo.lock
          git diff -- Cargo.lock > /tmp/node-refresh/lock.diff
          tar -czf node-refresh.tar.gz -C /tmp node-refresh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-refresh
          path: node-refresh.tar.gz
          retention-days: 1
          compression-level: 0
