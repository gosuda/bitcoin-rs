name: tx-followup-validation

on:
  push:
    branches: [validation/tx-followups-20260910]

permissions:
  contents: write

concurrency:
  group: tx-followup-validation
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  structural-rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: de81e329c783247e1e57bf0402fdf5adf294001e
          path: candidate
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: candidate -> target
          cache-on-failure: true
      - name: Reconcile workspace-only lock entries without changing external dependencies
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tx-evidence"
          rustc --version | tee "$RUNNER_TEMP/tx-evidence/toolchain.txt"
          cp Cargo.lock "$RUNNER_TEMP/tx-evidence/Cargo.lock.before"
          cargo metadata --format-version=1 > "$RUNNER_TEMP/cargo-metadata.json"
          python3 - <<'PY'
          from pathlib import Path
          import os, tomllib
          before = tomllib.loads((Path(os.environ['RUNNER_TEMP']) / 'tx-evidence/Cargo.lock.before').read_text())
          after = tomllib.loads(Path('Cargo.lock').read_text())
          def external(lock):
              return {(p['name'],p['version'],p['source']):p for p in lock['package'] if 'source' in p}
          def identities(lock):
              return {(p['name'],p['version'],p.get('source')) for p in lock['package']}
          if external(before) != external(after) or identities(before) != identities(after) or before['version'] != after['version']:
              raise SystemExit('lock reconciliation changed a dependency identity or external record')
          PY
          git diff -- Cargo.lock | tee "$RUNNER_TEMP/tx-evidence/lock-reconciliation.patch"
      - name: Require failing regression assertions on the original implementation
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 ../runner/.github/review/structural_rejection.py tests
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/mempool/src/gateway.rs')
          text = p.read_text()
          assert text.endswith('}\n')
          extra = '''
              #[test]
              fn input_structure_nonstandard_transactions_keep_policy_precedence() {
                  use crate::standardness::{AcceptanceRejectReason, StandardnessError};
                  for (version, witness_len, reason) in [
                      (0, 1, StandardnessError::Version),
                      (2, 400_001, StandardnessError::Weight),
                  ] {
                      let gateway = gateway_with(None);
                      let mut candidate = standard_tx(95);
                      candidate.version = version;
                      candidate.inputs.push(candidate.inputs[0].clone());
                      candidate.inputs[0].witness = vec![vec![0; witness_len]];
                      let request = admit_request(&gateway, &candidate, AdmissionOrigin::Rpc);
                      assert_eq!(
                          gateway.admit_transaction(request),
                          Err(AdmitError::Policy(AcceptanceRejectReason::NonStandard(reason)))
                      );
                      assert!(gateway.read().is_empty());
                      assert_eq!(gateway.read().sequence_number(), 0);
                  }
              }
          '''
          p.write_text(text[:-2] + extra + '}\n')
          PY
          set +e
          cargo test --locked -p bitcoin-rs-mempool --lib input_structure_ -- --nocapture > "$RUNNER_TEMP/tx-evidence/red.log" 2>&1
          status=$?
          set -e
          tail -n 130 "$RUNNER_TEMP/tx-evidence/red.log"
          test "$status" -ne 0
          grep -q 'test result: FAILED' "$RUNNER_TEMP/tx-evidence/red.log"
          echo 'Confirmed failing regression assertions, not a compilation failure.'
      - name: Prepare the bounded source-only candidate
        id: candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 ../runner/.github/review/structural_rejection.py fix
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/mempool/src/gateway.rs')
          text = p.read_text()
          old = '''        if bitcoin_rs_consensus::verify_tx::verify_transaction_input_outpoints(&request.tx)
              .is_err()
          '''
          # Match using the original script's indentation, not YAML indentation.
          old = '        if bitcoin_rs_consensus::verify_tx::verify_transaction_input_outpoints(&request.tx)\n            .is_err()\n'
          new = '''        if crate::standardness::is_standard_tx(
                      &request.tx,
                      &pool.policy_snapshot().standardness,
                  )
                  .is_ok()
                  && bitcoin_rs_consensus::verify_tx::verify_transaction_input_outpoints(&request.tx)
                      .is_err()
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          text = text.replace(
              '        // Keep their one consensus-owned check ahead of missing-input policy,\n',
              '        // Standardness bounds the scan before it allocates an input set.\n        // Keep the consensus-owned check ahead of missing-input policy,\n',
              1,
          )
          p.write_text(text)
          p = Path('docs/contracts/mempool-mutations.md')
          text = p.read_text()
          text = text.replace(
              '- Before missing-input policy can retain a peer body, the gateway runs the\n',
              '- For standard transactions, before missing-input policy can retain a peer\n  body, the gateway runs the\n',
              1,
          )
          text = text.replace(
              '  RPC failures do not populate peer caches. Coinbase policy remains separate.\n',
              '  RPC failures do not populate peer caches. Standardness bounds the input\n  scan; nonstandard and oversized transactions keep their existing policy\n  verdicts without allocating its input set. Coinbase policy remains separate.\n',
              1,
          )
          text = text.replace(
              '  `input_structure_checks_follow_generation_and_sequence_guards`,\n',
              '  `input_structure_checks_follow_generation_and_sequence_guards`,\n  `input_structure_nonstandard_transactions_keep_policy_precedence`,\n',
              1,
          )
          p.write_text(text)
          PY
          rustfmt --edition 2024 crates/consensus/src/verify_tx.rs crates/mempool/src/gateway.rs crates/mempool/src/admission.rs
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {'Cargo.lock','crates/consensus/src/verify_tx.rs','crates/mempool/src/gateway.rs','crates/mempool/src/admission.rs','docs/contracts/mempool-mutations.md'}
          actual = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected candidate scope: {actual ^ expected}')
          PY
          git diff --stat
          git diff > "$RUNNER_TEMP/tx-evidence/candidate.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/consensus/src/verify_tx.rs crates/mempool/src/gateway.rs crates/mempool/src/admission.rs docs/contracts/mempool-mutations.md
          git commit -m 'fix(mempool): reject malformed input outpoints before orphan retention'
          git rev-parse HEAD | tee "$RUNNER_TEMP/tx-evidence/candidate-sha.txt"
          git ls-tree -r HEAD -- Cargo.lock crates/consensus/src/verify_tx.rs crates/mempool/src/gateway.rs crates/mempool/src/admission.rs docs/contracts/mempool-mutations.md | tee "$RUNNER_TEMP/tx-evidence/blobs.txt"
          git push origin HEAD:refs/heads/followup/structural-rejection-scope
      - name: Native mempool and consensus regression suites
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        working-directory: candidate
        shell: bash
        run: |
          set -uo pipefail
          status=0
          cargo test --locked -p bitcoin-rs-mempool --lib > "$RUNNER_TEMP/tx-evidence/mempool.log" 2>&1 || status=1
          tail -n 30 "$RUNNER_TEMP/tx-evidence/mempool.log"
          cargo test --locked -p bitcoin-rs-consensus --no-default-features --lib > "$RUNNER_TEMP/tx-evidence/consensus-native.log" 2>&1 || status=1
          tail -n 30 "$RUNNER_TEMP/tx-evidence/consensus-native.log"
          exit "$status"
      - name: Strict affected-crate Clippy and formatting
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        working-directory: candidate
        shell: bash
        run: |
          set -uo pipefail
          status=0
          cargo clippy --locked -p bitcoin-rs-mempool --all-targets -- -D warnings > "$RUNNER_TEMP/tx-evidence/clippy-mempool.log" 2>&1 || status=1
          tail -n 70 "$RUNNER_TEMP/tx-evidence/clippy-mempool.log"
          cargo clippy --locked -p bitcoin-rs-consensus --no-default-features --all-targets -- -D warnings > "$RUNNER_TEMP/tx-evidence/clippy-consensus.log" 2>&1 || status=1
          tail -n 70 "$RUNNER_TEMP/tx-evidence/clippy-consensus.log"
          cargo fmt --all -- --check > "$RUNNER_TEMP/tx-evidence/fmt.log" 2>&1 || status=1
          tail -n 70 "$RUNNER_TEMP/tx-evidence/fmt.log"
          exit "$status"
      - name: Kernel-enabled mempool and consensus regression suites
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libboost-dev cmake
          set +e
          cargo test --locked -p bitcoin-rs-mempool -p bitcoin-rs-consensus --lib > "$RUNNER_TEMP/tx-evidence/kernel.log" 2>&1
          status=$?
          set -e
          tail -n 100 "$RUNNER_TEMP/tx-evidence/kernel.log"
          exit "$status"
      - name: Preserve exact candidate and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-structural-rejection-evidence
          path: ${{ runner.temp }}/tx-evidence
          retention-days: 3
          if-no-files-found: error
