name: node-owner-workbench
on:
  push:
    branches: [automation/node-owner-workbench-20260911]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export compatible syntax parser and transformation source
        run: |
          mkdir -p "$RUNNER_TEMP/owner-tools/wheels"
          cp .node-owner-workbench/*.py "$RUNNER_TEMP/owner-tools/"
          pip download --only-binary=:all: --python-version 313 --implementation cp --abi cp313 --platform manylinux2014_x86_64 --dest "$RUNNER_TEMP/owner-tools/wheels" tree-sitter==0.25.2 tree-sitter-rust==0.24.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-owner-tools
          path: ${{ runner.temp }}/owner-tools
          retention-days: 1
