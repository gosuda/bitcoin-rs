name: node-state-events-20260911

on:
  push:
    branches: [automation/node-state-events-20260911]

permissions:
  contents: write

concurrency:
  group: node-state-events-20260911
  cancel-in-progress: true

env:
  BASE_SHA: a1be979848253ec7d5763375a13b6af1d8e66dfc
  PREVIOUS_HEAD: f633e191b84a90b9c02478e857d19af238f75507
  TARGET_BRANCH: refactor/node-state-events-20260911
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  event-owner:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          show-progress: false
      - name: Integrate the published source candidate without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$current" = "$PREVIOUS_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach "$PREVIOUS_HEAD"
          git merge --no-commit --no-ff "$BASE_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          page = Path('docs/contracts/chain-events.md')
          text = page.read_text()
          entry = '- Coherent snapshot, bounded chain-event hints, and durable process epoch (current):\n  `crates/node/src/state/events.rs`\n'
          if 'crates/node/src/state/events.rs' not in text:
              if text.count('Owners:\n') != 1:
                  raise SystemExit('chain-event ownership anchor changed')
              page.write_text(text.replace('Owners:\n', 'Owners:\n' + entry, 1))
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA']], text=True).splitlines()
          changed += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          Path(os.environ['RUNNER_TEMP'], 'changed-paths.json').write_text(json.dumps(changed))
          print('\n'.join(changed))
          PY
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Install the declared MSRV for an independent lint result
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Freeze the formatted source-only candidate
        id: format
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          allowed = set(json.loads(Path(os.environ['RUNNER_TEMP'], 'changed-paths.json').read_text()))
          for path in subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA']], text=True).splitlines():
              if path not in allowed:
                  print('Restore unrelated baseline formatting:', path)
                  subprocess.run(['git', 'checkout', os.environ['BASE_SHA'], '--', path], check=True)
          PY
          git diff --check "$BASE_SHA"
          git add -A
          if git diff --cached --name-only "$BASE_SHA" | grep -Ev '^(crates/.*\.rs$|bin/bitcoin-rs/tests/.*\.rs$|docs/contracts/.*\.md$|CONCEPTS.md$)'; then
            echo 'unexpected source path' >&2
            exit 1
          fi
          echo "SOURCE_TREE=$(git write-tree)" >> "$GITHUB_ENV"
          git diff --cached --stat "$BASE_SHA"
          rustc +stable --version --verbose
          rustc +1.95.0 --version --verbose
          sha256sum Cargo.lock
      - name: Strict rolling-stable all-target node Clippy
        id: stable_clippy
        shell: bash
        run: |
          set +e
          cargo +stable clippy --locked -p bitcoin-rs-node --no-default-features --features fjall,zmq --all-targets -- -D warnings > "$RUNNER_TEMP/stable-clippy.log" 2>&1
          rc=$?
          tail -n 180 "$RUNNER_TEMP/stable-clippy.log"
          echo "Rolling stable Clippy exit: $rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Strict MSRV all-target node Clippy
        id: msrv_clippy
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          cargo +1.95.0 clippy --locked -p bitcoin-rs-node --no-default-features --features fjall,zmq --all-targets -- -D warnings > "$RUNNER_TEMP/msrv-clippy.log" 2>&1
          rc=$?
          tail -n 80 "$RUNNER_TEMP/msrv-clippy.log"
          echo "MSRV Clippy exit: $rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Compile binary and integration consumers on stable
        id: consumers
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          cargo +stable check --locked -p bitcoin-rs --no-default-features --features fjall,zmq --all-targets > "$RUNNER_TEMP/consumers.log" 2>&1
          rc=$?
          tail -n 100 "$RUNNER_TEMP/consumers.log"
          echo "Consumer compile exit: $rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Complete serial native node unit suite on stable
        id: node_tests
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          cargo +stable test --locked -p bitcoin-rs-node --no-default-features --features fjall,zmq --lib -- --test-threads=1 > "$RUNNER_TEMP/node-tests.log" 2>&1
          rc=$?
          if [ "$rc" = 0 ]; then
            grep -E 'state::|checkpoint::|test result:' "$RUNNER_TEMP/node-tests.log"
          else
            tail -n 180 "$RUNNER_TEMP/node-tests.log"
          fi
          echo "Stable native node tests exit: $rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: State storage and sync integration tests on stable
        id: integration
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          timeout 240s cargo +stable test --locked -p bitcoin-rs-node --no-default-features --features fjall,zmq --test state_storage --test sync_smoke --test lease_registration_215 --no-fail-fast > "$RUNNER_TEMP/integration.log" 2>&1
          rc=$?
          tail -n 120 "$RUNNER_TEMP/integration.log"
          echo "State/sync integration exit: $rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: CL-08 and CL-13 ownership gate
        id: ownership
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          cargo +stable test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_ownership -- --nocapture > "$RUNNER_TEMP/ownership.log" 2>&1
          rc=$?
          tail -n 100 "$RUNNER_TEMP/ownership.log"
          echo "CL-08/CL-13 ownership exit: $rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: CL-07 coherent API gate
        id: coherence
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          cargo +stable test --locked -p bitcoin-rs --no-default-features --features fjall --test overhaul_core_api -- --nocapture > "$RUNNER_TEMP/coherence.log" 2>&1
          rc=$?
          tail -n 80 "$RUNNER_TEMP/coherence.log"
          echo "CL-07 coherent API exit: $rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Publish an explicitly draft source integration, not a green verdict
        if: ${{ !cancelled() && steps.format.outcome == 'success' && steps.msrv_clippy.outcome == 'success' && steps.consumers.outcome == 'success' && steps.node_tests.outcome == 'success' && steps.integration.outcome == 'success' && steps.ownership.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git write-tree)" = "$SOURCE_TREE"
          current=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$current" = "$PREVIOUS_HEAD" || { echo 'review branch moved concurrently; preserve it' >&2; exit 1; }
          commit=$(printf '%s\n\n%s\n' \
            'Merge current main into the state event ownership review' \
            'Preserve merged checkpoint ownership and add the current event-owner contract pointer. Stable Clippy and CL-07 retain their actual outcomes; this is a draft review artifact, not a merge-ready or complete-constraint verdict.' \
            | git commit-tree "$SOURCE_TREE" -p "$PREVIOUS_HEAD" -p "$BASE_SHA")
          git push origin "$commit:refs/heads/$TARGET_BRANCH"
          echo "Draft source integration: $commit" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate tree: $SOURCE_TREE" >> "$GITHUB_STEP_SUMMARY"
