name: Stabilization verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"

jobs:
  combined:
    if: github.head_ref == 'stabilize/dependency-range-20261124'
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      BITCOIN_RS_FUZZ_CORPUS: /tmp/fuzz-corpus/corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0a6fbda199240c7187d11657acd2d020dde43680
          persist-credentials: false
      - run: bash scripts/ci-setup.sh apt nextest corpus
      - name: Verify combined source formatting and contracts
        run: |
          cargo fmt --all -- --check
          cargo run --locked -p contract-index -- --check
      - name: Reproduce the prior relay rollover behavior
        run: |
          git apply <<'PATCH'
          diff --git a/crates/node/src/p2p/tx_policy/relay.rs b/crates/node/src/p2p/tx_policy/relay.rs
          --- a/crates/node/src/p2p/tx_policy/relay.rs
          +++ b/crates/node/src/p2p/tx_policy/relay.rs
          @@ -288,6 +288,5 @@
                       if let Some(current) = peer.pending.get_mut(&request.wtxid) {
          -                let advance = request.sequence.wrapping_sub(current.sequence);
          -                if (1..(1_u64 << 63)).contains(&advance) {
          +                if request.sequence > current.sequence {
                               *current = request;
                           }
                       } else if peer.pending.len() < MAX_PENDING_PER_PEER && total < MAX_PENDING {
          PATCH
          git diff -- crates/node/src/p2p/tx_policy/relay.rs
          set +e
          cargo test --locked -p bitcoin-rs-node --lib --features bitcoin-rs-wire/pool,bitcoin-rs-wire/pool-sv2 wrapped_admission_replaces_pending_relay_and_rejects_stale_callbacks > relay-before.log 2>&1
          relay_before_rc=$?
          set -e
          cat relay-before.log
          test "$relay_before_rc" -eq 101
          rg '^test .*::wrapped_admission_replaces_pending_relay_and_rejects_stale_callbacks \.\.\. FAILED$' relay-before.log
          rg -F 'test result: FAILED. 0 passed; 1 failed;' relay-before.log
          rg -F 'assertion' relay-before.log
          git restore --source=HEAD -- crates/node/src/p2p/tx_policy/relay.rs
          git diff --exit-code
      - name: Verify the combined owner suites
        run: cargo nextest run --locked --no-fail-fast -p bitcoin-rs-mempool -p bitcoin-rs-node -p bitcoin-rs-p2p -p bitcoin-rs-wire --features bitcoin-rs-wire/pool,bitcoin-rs-wire/pool-sv2

  proofs:
    if: github.head_ref == 'stabilize/dependency-range-20261124'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0a6fbda199240c7187d11657acd2d020dde43680
          persist-credentials: false
      - name: Run the required formal proof stage
        run: ./scripts/ci-pr.sh proofs
