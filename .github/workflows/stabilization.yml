name: Stabilization verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ranges:
    if: github.head_ref == 'stabilize/dependency-range-20261124' && github.event.pull_request.head.sha == '1704949b4b9fb3fe9ce48f04fb6362a46bb08092'
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
    strategy:
      fail-fast: false
      matrix:
        range: [minimal, maximum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: bash scripts/ci-setup.sh apt msrv nightly deny
      - name: Verify supported dependency endpoint
        run: KEEP_LOCK=1 scripts/check-dep-range.sh ${{ matrix.range }}
      - name: Show resolved graph
        if: always()
        run: cargo tree --locked --all-features --duplicates

  owner-evidence:
    if: github.head_ref == 'stabilize/dependency-range-20261124'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: mining
            commit: 6b706b36ee4b19869b92633e8fedc1f2543f1280
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Generate contract evidence and format source
        run: |
          cargo run --locked -p contract-index
          cargo fmt --all
          git diff --binary
          while IFS= read -r -d '' path; do
            printf 'GENERATED_FILE %s %s\n' "$(git hash-object "$path")" "$path"
          done < <(git diff --name-only -z)
  scripts:
    if: github.head_ref == 'stabilize/dependency-range-20261124' && github.event.pull_request.head.sha == '08229e20fd583c47bfd6ce6a265ec48189fd94b1'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - run: python3 scripts/check_book_links.py

  reserve-regression:
    if: github.head_ref == 'stabilize/dependency-range-20261124' && github.event.pull_request.head.sha == '08229e20fd583c47bfd6ce6a265ec48189fd94b1'
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f6cd9fbcbafa485b77022aa5333c8c4d2cdf1995
          persist-credentials: false
      - run: bash scripts/ci-setup.sh apt
      - name: Reproduce external coinbase reserve defects
        run: cargo test --locked -p bitcoin-rs-wire --lib ordinary_templates_reserve_external_coinbase
