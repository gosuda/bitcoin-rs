name: Stabilization verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  resolve:
    if: github.head_ref == 'stabilize/dependency-range-20261124'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        range: [minimal, maximum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: bash scripts/ci-setup.sh nightly deny
      - name: Resolve supported versions
        run: |
          if [ "${{ matrix.range }}" = minimal ]; then
            cargo +nightly update -Zdirect-minimal-versions
          else
            cargo update
          fi
      - name: Check dependency policy
        run: cargo deny check bans
      - name: Show resolved graph
        if: always()
        run: cargo tree --locked --all-features --duplicates

  owner-evidence:
    if: github.head_ref == 'stabilize/dependency-range-20261124'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: api
            commit: 460f71e303910723053d14b57a239e92bcbf1b85
          - owner: mining
            commit: f6cd9fbcbafa485b77022aa5333c8c4d2cdf1995
          - owner: p2p
            commit: a9867cf48effb954e164f740267375bb4504b96f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Generate contract evidence and format source
        run: |
          cargo run --locked -p contract-index
          cargo fmt --all
          git diff --binary
          while IFS= read -r -d '' path; do
            printf 'GENERATED_FILE %s %s\n' "$(git hash-object "$path")" "$path"
          done < <(git diff --name-only -z)
  scripts:
    if: github.head_ref == 'stabilize/dependency-range-20261124'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - run: python3 scripts/check_book_links.py
