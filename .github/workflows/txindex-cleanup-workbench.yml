name: txindex-cleanup-workbench
on:
  push:
    branches: [automation/txindex-cleanup-workbench-20260911]
permissions:
  contents: write
concurrency:
  group: txindex-cleanup-workbench
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        scope: [index, node]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SCOPE: ${{ matrix.scope }}
    defaults:
      run:
        working-directory: candidate
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d4392c35858bce7626cec35fea905ebe97b554c0
          path: candidate
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: candidate
          shared-key: txindex-cleanup-native-${{ matrix.scope }}
          cache-on-failure: true
      - name: Generate and audit the source-only refactor
        run: |
          exec > >(tee -a /tmp/txindex-${SCOPE}.log) 2>&1
          python -m pip install 'Pygments==2.19.2'
          if [[ "$SCOPE" == index ]]; then
            python ../workbench/.workbench/refactor_txindex.py
          else
            python ../workbench/.workbench/refactor_txindex_node.py
          fi
          python ../workbench/.workbench/finalize_txindex.py "$SCOPE"
          python ../workbench/.workbench/adjustments.py "$SCOPE"
          if [[ "$SCOPE" == index ]]; then
            cargo +1.95.0 fmt -p bitcoin-rs-index
          else
            rustfmt +1.95.0 --edition 2024 crates/node/src/txindex_worker.rs crates/node/src/storage_backend.rs
          fi
      - name: Compiler-assisted unused import cleanup
        run: |
          exec > >(tee -a /tmp/txindex-${SCOPE}.log) 2>&1
          for pass in 1 2; do
            if [[ "$SCOPE" == index ]]; then
              cargo +1.95.0 fix --locked -p bitcoin-rs-index --features fjall,redb --all-targets --allow-dirty --allow-staged
            else
              cargo +1.95.0 fix --locked -p bitcoin-rs-node --no-default-features --features fjall,redb,zmq --all-targets --allow-dirty --allow-staged
            fi
          done
      - name: Formatting and strict Clippy
        run: |
          exec > >(tee -a /tmp/txindex-${SCOPE}.log) 2>&1
          if [[ "$SCOPE" == index ]]; then
            cargo +1.95.0 fmt -p bitcoin-rs-index
            cargo +1.95.0 fmt -p bitcoin-rs-index -- --check
            cargo +1.95.0 clippy --locked -p bitcoin-rs-index --features fjall,redb --all-targets -- -D warnings
          else
            rustfmt +1.95.0 --edition 2024 crates/node/src/txindex_worker.rs crates/node/src/storage_backend.rs
            rustfmt +1.95.0 --edition 2024 --check crates/node/src/txindex_worker.rs crates/node/src/storage_backend.rs
            cargo +1.95.0 clippy --locked -p bitcoin-rs-node --no-default-features --features fjall,redb,zmq --all-targets -- -D warnings
          fi
      - name: Contract and integration tests
        run: |
          exec > >(tee -a /tmp/txindex-${SCOPE}.log) 2>&1
          if [[ "$SCOPE" == index ]]; then
            cargo +1.95.0 test --locked -p bitcoin-rs-index --features fjall,redb --no-fail-fast
          else
            cargo +1.95.0 test --locked -p bitcoin-rs-node --no-default-features --features fjall,redb,zmq --lib txindex -- --nocapture
            cargo +1.95.0 test --locked -p bitcoin-rs-node --no-default-features --features fjall,redb,zmq --lib runtime_backend_construction_has_one_owner -- --nocapture
          fi
      - name: Public documentation links
        if: ${{ matrix.scope == 'index' }}
        run: |
          exec > >(tee -a /tmp/txindex-${SCOPE}.log) 2>&1
          RUSTDOCFLAGS='-D warnings' cargo +1.95.0 doc --locked -p bitcoin-rs-index --features fjall,redb --no-deps
      - name: Verify exact diff scope and export candidate
        if: ${{ always() }}
        run: |
          exec > >(tee -a /tmp/txindex-${SCOPE}.log) 2>&1
          if [[ "$SCOPE" == index ]]; then
            git add crates/index/src/index.rs crates/index/src/index crates/index/README.md
          else
            git add crates/node/src/txindex_worker.rs crates/node/src/txindex_worker crates/node/src/storage_backend.rs crates/node/README.md crates/node/src/sync/requests.rs crates/node/src/embed.rs crates/node/src/checkpoint/tests/behavior_2.rs
          fi
          git diff --cached --check
          git diff --cached --stat
          git diff --exit-code
          git diff --cached --name-only | SCOPE="$SCOPE" python -c 'import os,sys; s=os.environ["SCOPE"]; paths=sys.stdin.read().splitlines(); assert paths; allowed={"index":lambda p: p in {"crates/index/src/index.rs","crates/index/README.md"} or p.startswith("crates/index/src/index/"),"node":lambda p: p in {"crates/node/src/txindex_worker.rs","crates/node/src/storage_backend.rs","crates/node/README.md","crates/node/src/sync/requests.rs","crates/node/src/embed.rs","crates/node/src/checkpoint/tests/behavior_2.rs"} or p.startswith("crates/node/src/txindex_worker/")}; assert all(allowed[s](p) for p in paths), paths'
          git diff --cached --binary > /tmp/txindex-${SCOPE}.patch
          git diff --cached --name-only -z | tar -czf /tmp/txindex-${SCOPE}-source.tar.gz --null -T -
      - name: Publish validated source without workbench history
        run: |
          exec > >(tee -a /tmp/txindex-${SCOPE}.log) 2>&1
          branch="refactor/txindex-${SCOPE}-modules-20260911"
          if [[ -n "$(git ls-remote --heads origin "refs/heads/$branch")" ]]; then
            git fetch --depth=1 origin "$branch"
            test "$(git write-tree)" = "$(git rev-parse FETCH_HEAD^{tree})"
            git rev-parse FETCH_HEAD > /tmp/txindex-${SCOPE}-commit.txt
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if [[ "$SCOPE" == index ]]; then
              git commit -m 'refactor(index): modularize txindex storage and simplify canonical row mutations'
            else
              git commit -m 'refactor(node): separate txindex lifecycle, reconciliation, and query owners'
            fi
            git push origin "HEAD:refs/heads/$branch"
            git rev-parse HEAD > /tmp/txindex-${SCOPE}-commit.txt
          fi
          cat /tmp/txindex-${SCOPE}-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: txindex-${{ matrix.scope }}-candidate
          path: |
            /tmp/txindex-${{ matrix.scope }}.patch
            /tmp/txindex-${{ matrix.scope }}-source.tar.gz
            /tmp/txindex-${{ matrix.scope }}.log
            /tmp/txindex-${{ matrix.scope }}-commit.txt
          retention-days: 1
          if-no-files-found: error
