name: txindex-cleanup-workbench
on:
  push:
    branches: [automation/txindex-cleanup-workbench-20260911]
permissions:
  contents: read
concurrency:
  group: txindex-current-source-${{ github.sha }}
  cancel-in-progress: false
jobs:
  current-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7f5a460de67965ff36955bab1434c75f080ad384
          persist-credentials: false
      - name: Export exact current source
        run: git archive --format=tar HEAD > /tmp/txindex-current-source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: txindex-current-source
          path: /tmp/txindex-current-source.tar
          retention-days: 1
          if-no-files-found: error
