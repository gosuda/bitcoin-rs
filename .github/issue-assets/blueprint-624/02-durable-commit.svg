<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1572 1399" width="1572" height="1399" role="img" aria-labelledby="02-durable-commit-title 02-durable-commit-desc" data-renderer="local-d2-subset-graphviz" preserveAspectRatio="xMidYMid meet"><title id="02-durable-commit-title">Durable commit &amp; coherent publication</title><desc id="02-durable-commit-desc">Ordered runtime messages: verify before committing, sync body and undo ranges before storing their locators, reconcile the mempool, then publish a coherent generation. Coordination does not transfer domain ownership.</desc><style>.s1{stroke:#B7C8CD;stroke-dasharray:4 6;stroke-width:1}.s2{fill:#EDF3F5;stroke:#91ABB3;stroke-width:1.3}.s3{fill:#244C57;font-family:Arial, Helvetica, sans-serif;font-size:17.0;font-weight:500;text-anchor:middle}.s6{fill:#FFFFFF;stroke:#91ABB3;stroke-width:1.3}.s7{fill:#193F49;font-family:Arial, Helvetica, sans-serif;font-size:18.0;font-weight:500;text-anchor:middle}.s10{fill:#F8EEE7;stroke:#BB7854;stroke-width:1.3}.s11{fill:#813E1D;font-family:Arial, Helvetica, sans-serif;font-size:18.0;font-weight:500;text-anchor:middle}.s12{fill:none;stroke:#68858D;stroke-width:1.45}.s13{fill:#193F49;font-family:Arial, Helvetica, sans-serif;font-size:15;font-weight:400;text-anchor:middle}.s15{fill:none;stroke:#8AA1A8;stroke-dasharray:5 4;stroke-width:1.45}.s16{fill:#46636D;font-family:Arial, Helvetica, sans-serif;font-size:15;font-weight:400;text-anchor:start}</style><defs><marker id="02-durable-commit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68858D"/></marker></defs><line x1="121.0" y1="106" x2="121.0" y2="1270" class="s1"/><rect x="36.0" y="30" width="170" height="76" rx="7" class="s2"/><text x="121.0" y="62.39" class="s3"><tspan x="121.0" dy="0">Block</tspan><tspan x="121.0" dy="22.44">ingress</tspan></text><line x1="311.0" y1="106" x2="311.0" y2="1270" class="s1"/><rect x="226.0" y="30" width="170" height="76" rx="7" fill="#164D59" stroke="#164D59" stroke-width="1.3"/><text x="311.0" y="62.059999999999995" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="500" text-anchor="middle"><tspan x="311.0" dy="0">Transition</tspan><tspan x="311.0" dy="23.76">coordinator</tspan></text><line x1="501.0" y1="106" x2="501.0" y2="1270" class="s1"/><rect x="416.0" y="30" width="170" height="76" rx="7" class="s6"/><text x="501.0" y="62.059999999999995" class="s7"><tspan x="501.0" dy="0">Chainstate</tspan><tspan x="501.0" dy="23.76">owner</tspan></text><line x1="691.0" y1="106" x2="691.0" y2="1270" class="s1"/><rect x="606.0" y="30" width="170" height="76" rx="7" fill="#E7F2EF" stroke="#799E92" stroke-width="1.3"/><text x="691.0" y="62.059999999999995" fill="#235647" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="500" text-anchor="middle"><tspan x="691.0" dy="0">Verification</tspan><tspan x="691.0" dy="23.76">pool</tspan></text><line x1="881.0" y1="106" x2="881.0" y2="1270" class="s1"/><rect x="796.0" y="30" width="170" height="76" rx="7" class="s10"/><text x="881.0" y="62.059999999999995" class="s11"><tspan x="881.0" dy="0">Body + undo</tspan><tspan x="881.0" dy="23.76">segments</tspan></text><line x1="1071.0" y1="106" x2="1071.0" y2="1270" class="s1"/><rect x="986.0" y="30" width="170" height="76" rx="7" class="s10"/><text x="1071.0" y="62.059999999999995" class="s11"><tspan x="1071.0" dy="0">Atomic</tspan><tspan x="1071.0" dy="23.76">chainstate store</tspan></text><line x1="1261.0" y1="106" x2="1261.0" y2="1270" class="s1"/><rect x="1176.0" y="30" width="170" height="76" rx="7" class="s6"/><text x="1261.0" y="62.059999999999995" class="s7"><tspan x="1261.0" dy="0">Mempool</tspan><tspan x="1261.0" dy="23.76">gateway</tspan></text><line x1="1451.0" y1="106" x2="1451.0" y2="1270" class="s1"/><rect x="1366.0" y="30" width="170" height="76" rx="7" class="s2"/><text x="1451.0" y="62.39" class="s3"><tspan x="1451.0" dy="0">Public views</tspan><tspan x="1451.0" dy="22.44">+ consumers</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="121.0" x2="501.0" y1="210" y2="210" class="s12"/><text x="311.0" y="198" class="s13"><tspan x="311.0" dy="0">Bounded parsed block window</tspan></text><path marker-end="url(#02-durable-commit-arrow)" d="M 501.0 280 H 561.0 V 298 H 501.0" class="s12"/><text x="513.0" y="224" fill="#193F49" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="513.0" dy="0">Resolve inputs in</tspan><tspan x="513.0" dy="20">order; prepare</tspan><tspan x="513.0" dy="20">deltas</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="501.0" x2="691.0" y1="366" y2="366" class="s12"/><text x="596.0" y="334" class="s13"><tspan x="596.0" dy="0">Immutable prepared</tspan><tspan x="596.0" dy="20">script jobs</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="691.0" x2="501.0" y1="434" y2="434" class="s15"/><text x="596.0" y="402" class="s13"><tspan x="596.0" dy="0">Complete</tspan><tspan x="596.0" dy="20">verification results</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="311.0" x2="501.0" y1="502" y2="502" class="s12"/><text x="406.0" y="470" class="s13"><tspan x="406.0" dy="0">Reserve transition;</tspan><tspan x="406.0" dy="20">recheck parent</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="311.0" x2="1261.0" y1="562" y2="562" class="s12"/><text x="786.0" y="550" class="s13"><tspan x="786.0" dy="0">Begin chain change; close admission</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="501.0" x2="881.0" y1="622" y2="622" class="s12"/><text x="691.0" y="610" class="s13"><tspan x="691.0" dy="0">Append verified body + undo frames</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="501.0" x2="881.0" y1="682" y2="682" class="s12"/><text x="691.0" y="670" class="s13"><tspan x="691.0" dy="0">Sync required segment ranges</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="881.0" x2="501.0" y1="742" y2="742" class="s15"/><text x="691.0" y="730" class="s13"><tspan x="691.0" dy="0">Durable byte cursors</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="501.0" x2="1071.0" y1="802" y2="802" class="s12"/><text x="786.0" y="790" class="s13"><tspan x="786.0" dy="0">Atomic coins, metadata + durable-head batch</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="1071.0" x2="501.0" y1="862" y2="862" class="s15"/><text x="786.0" y="850" class="s13"><tspan x="786.0" dy="0">Durable completion</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="501.0" x2="311.0" y1="930" y2="930" class="s15"/><text x="406.0" y="898" class="s13"><tspan x="406.0" dy="0">Committed chain</tspan><tspan x="406.0" dy="20">outcome</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="311.0" x2="1261.0" y1="990" y2="990" class="s12"/><text x="786.0" y="978" class="s13"><tspan x="786.0" dy="0">Canonical connect or reorg update</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="1261.0" x2="311.0" y1="1050" y2="1050" class="s15"/><text x="786.0" y="1038" class="s13"><tspan x="786.0" dy="0">Aligned pool + mutation sequence</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="311.0" x2="1451.0" y1="1110" y2="1110" class="s12"/><text x="881.0" y="1098" class="s13"><tspan x="881.0" dy="0">Publish stable coherent generation</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="311.0" x2="121.0" y1="1170" y2="1170" class="s15"/><text x="216.0" y="1158" class="s13"><tspan x="216.0" dy="0">Committed result</tspan></text><line marker-end="url(#02-durable-commit-arrow)" x1="311.0" x2="1451.0" y1="1230" y2="1230" class="s15"/><text x="881.0" y="1218" class="s13"><tspan x="881.0" dy="0">Bounded index, notification + relay hints</tspan></text><text x="36" y="1307" class="s16"><tspan x="36" dy="0">Invariant: a durable head never references unsynced bytes.</tspan></text><text x="36" y="1349" class="s16"><tspan x="36" dy="0">Ordering is coordinator-owned; chainstate and mempool retain their domain mechanics.</tspan></text></svg>