name: Test lane speed prerequisites
description: >-
  cargo-nextest (pooled test scheduling) and the mold linker for the
  compile-and-test lanes. Kernel/rocksdb C++ prerequisites stay in
  .github/actions/native-deps.

# cargo-nextest is not in taiki-e/install-action's manifest list, and its
# cargo-binstall fallback cannot parse nextest's edition-2024 manifest -- so
# the pinned prebuilt tarball is fetched and verified directly instead.
runs:
  using: composite
  steps:
    - name: mold linker
      shell: bash
      run: command -v mold >/dev/null || { sudo apt-get update && sudo apt-get install -y mold; }
    - name: cargo-nextest 0.9.143
      shell: bash
      run: |
        if ! cargo nextest --version 2>/dev/null | grep -q 'cargo-nextest 0.9.143'; then
          tmp="$(mktemp -d)"
          curl -sSfL \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$tmp/nextest.tar.gz"
          echo "66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e  $tmp/nextest.tar.gz" \
            | sha256sum --check
          tar xzf "$tmp/nextest.tar.gz" -C "$tmp"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "$tmp/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"
        fi
