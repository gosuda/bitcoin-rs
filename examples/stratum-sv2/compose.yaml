# Stratum V2 regtest example
#
# bitcoin-rs runs as the mining owner (regtest).
# An SRI pool connects to bitcoin-rs via the SV2 template-provider bridge.
# Two CPU miners connect to the pool.
#
# The bridge (template-provider) translates between bitcoin-rs's
# getblocktemplate/submitblock RPC and the SV2 Template Distribution Protocol.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f miner-1

name: stratum-sv2

services:
  bitcoin-rs:
    build:
      context: ../..
      dockerfile: Dockerfile
    command:
      - --network=regtest
      - --data-dir=/data
      - --rpc-bind=0.0.0.0:18443
      - --rpc-user=bitcoin-rs
      - --rpc-password=bitcoin-rs
      - --mining-payout-address=bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080
    volumes:
      - bitcoin-rs-data:/data
    ports:
      - "127.0.0.1:18443:18443"
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -u
        - bitcoin-rs:bitcoin-rs
        - -H
        - "content-type: text/plain"
        - --data-binary
        - '{"jsonrpc":"1.0","id":"hc","method":"getblockchaininfo","params":[]}'
        - http://127.0.0.1:18443/
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  pool:
    image: stratumv2/pool_sv2:v0.8.0
    stop_signal: SIGINT
    environment:
      SV2_TP_ADDR: "template-provider:8442"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      template-provider:
        condition: service_started
    restart: unless-stopped

  template-provider:
    image: ghcr.io/stratum-mining/sv2-tp:main
    environment:
      BITCOIN_RPC_URL: "http://bitcoin-rs:18443"
      BITCOIN_RPC_USER: "bitcoin-rs"
      BITCOIN_RPC_PASS: "bitcoin-rs"
      SV2_LISTEN_ADDR: "0.0.0.0:8442"
    depends_on:
      bitcoin-rs:
        condition: service_healthy
    restart: unless-stopped

  miner-1:
    image: ghcr.io/stratum-mining/sv2-mining-device:main
    command:
      - --address-pool=pool:34255
      - --id-user=bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080.worker1
      - --id-device=miner-1
      - --cores=8
    depends_on:
      - pool
    restart: unless-stopped

  miner-2:
    image: ghcr.io/stratum-mining/sv2-mining-device:main
    command:
      - --address-pool=pool:34255
      - --id-user=bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080.worker2
      - --id-device=miner-2
      - --cores=8
    depends_on:
      - pool
    restart: unless-stopped

volumes:
  bitcoin-rs-data:
