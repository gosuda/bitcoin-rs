# Stratum V2 regtest example
#
# bitcoin-rs (sv2 feature) acts as the template provider.
# SRI pool connects directly to bitcoin-rs over SV2 TDP.
# Two CPU miners connect to the pool.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f miner-1   # watch shares/blocks

name: stratum-sv2

services:
  bitcoin-rs:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        FEATURES: "fjall,sv2"
    command:
      - --network=regtest
      - --data-dir=/data
      - --rpc-bind=0.0.0.0:18443
      - --rpc-user=bitcoin-rs
      - --rpc-password=bitcoin-rs
      - --mining-payout-address=bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080
      - --sv2-listen=0.0.0.0:8442
    volumes:
      - bitcoin-rs-data:/data
    ports:
      - "127.0.0.1:18443:18443"
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -u
        - bitcoin-rs:bitcoin-rs
        - -H
        - "content-type: text/plain"
        - --data-binary
        - '{"jsonrpc":"1.0","id":"hc","method":"getblockchaininfo","params":[]}'
        - http://127.0.0.1:18443/
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  pool:
    image: stratumv2/pool_sv2:v0.8.0
    stop_signal: SIGINT
    environment:
      # Pool connects to bitcoin-rs SV2 template provider
      SV2_TP_ADDR: "bitcoin-rs:8442"
      # Regtest payout address (BIP173 test vector)
      COINBASE_REWARD_SCRIPT: "0014751e76e8199196d454941c45d1b3a323f1433bd6"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      bitcoin-rs:
        condition: service_healthy
    restart: unless-stopped

  miner-1:
    image: stratumv2/mining_device_sv2:v0.8.0
    command:
      - --address-pool=pool:34255
      - --id-user=bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080.worker1
      - --id-device=miner-1
      - --cores=8
    depends_on:
      - pool
    restart: unless-stopped

  miner-2:
    image: stratumv2/mining_device_sv2:v0.8.0
    command:
      - --address-pool=pool:34255
      - --id-user=bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080.worker2
      - --id-device=miner-2
      - --cores=8
    depends_on:
      - pool
    restart: unless-stopped

volumes:
  bitcoin-rs-data:
