# Stratum V2 regtest example
#
# bitcoin-rs runs as the mining owner (regtest) with its native SV2
# Template Distribution Protocol server enabled.
# An SRI pool connects directly to bitcoin-rs via SV2.
# Two CPU miners connect to the pool.
#
# Architecture:
#   miner-1, miner-2 → pool (SRI) → bitcoin-rs (native SV2 TP)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f miner-1

name: stratum-sv2

services:
  bitcoin-rs:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        FEATURES: "fjall,kernel,sv2"
    command:
      - --network=regtest
      - --data-dir=/data
      - --rpc-bind=0.0.0.0:18443
      - --rpc-user=bitcoin-rs
      - --rpc-password=bitcoin-rs
      - --mining-payout-address=bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080
      - --sv2-listen=0.0.0.0:8442
    volumes:
      - bitcoin-rs-data:/data
    ports:
      - "127.0.0.1:18443:18443"
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -u
        - bitcoin-rs:bitcoin-rs
        - -H
        - "content-type: text/plain"
        - --data-binary
        - '{"jsonrpc":"1.0","id":"hc","method":"getblockchaininfo","params":[]}'
        - http://127.0.0.1:18443/
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  pool:
    image: stratumv2/pool_sv2:v0.8.0
    stop_signal: SIGINT
    volumes:
      - ./config/pool.toml:/app/pool-config.toml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      bitcoin-rs:
        condition: service_healthy
    restart: unless-stopped

  miner-1:
    image: stratumv2/mining_device_sv2:v0.8.0
    command:
      - --address-pool=pool:34255
      - --id-user=bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080.worker1
      - --id-device=miner-1
      - --cores=8
    depends_on:
      - pool
    restart: unless-stopped

  miner-2:
    image: stratumv2/mining_device_sv2:v0.8.0
    command:
      - --address-pool=pool:34255
      - --id-user=bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080.worker2
      - --id-device=miner-2
      - --cores=8
    depends_on:
      - pool
    restart: unless-stopped

volumes:
  bitcoin-rs-data:
