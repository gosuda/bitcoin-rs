name: CI

# PR checks; the same file also runs for merge-queue groups and main pushes.
# Deep lanes: deep.yml. Nightly campaigns: scheduled.yml.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

latchkey:
  schema: 1

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: small
    timeout-minutes: 20
    steps:
      - run: bash .latchkey/setup.sh deny
      - run: ./scripts/ci-pr.sh fmt
      - run: ./scripts/ci-pr.sh deny
      - run: ./scripts/ci-pr.sh contracts
      - name: Script tools
        run: |
          for f in fetch-golden import-qa-assets fuzz-policy run-fuzz-campaign validate-corpus-seeds; do bash -n "scripts/${f}.sh"; done
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  # Path-gated on pull requests (all paths on manual runs), as the old fuzz-build,
  # fuzz-lockfile and template-provider-lockfile workflows were.
  fuzz:
    if: env.LATCHKEY_CI_EVENT_CLASS == 'pr_update' || env.LATCHKEY_CI_EVENT_CLASS == 'workflow_dispatch'
    runs-on: large
    timeout-minutes: 60
    steps:
      - name: Lockfile drift
        run: |
          changed_rc=0; bash .latchkey/setup.sh changed '^(crates/[^/]+/Cargo\.toml|fuzz/|Cargo\.toml$)' || changed_rc=$?
          if [ "$changed_rc" -eq 1 ]; then exit 0; elif [ "$changed_rc" -ne 0 ]; then exit "$changed_rc"; fi
          bash .latchkey/setup.sh nightly
          cargo +nightly metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml >/dev/null
      - uses: latchkey/cache-restore@1.1.0
        with:
          key: fuzz-target
          version: v1
          hash-files: fuzz/Cargo.lock
      - name: Fuzz targets build
        run: |
          changed_rc=0; bash .latchkey/setup.sh changed '^(fuzz/|Cargo\.toml$)' || changed_rc=$?
          if [ "$changed_rc" -eq 1 ]; then exit 0; elif [ "$changed_rc" -ne 0 ]; then exit "$changed_rc"; fi
          bash .latchkey/setup.sh apt nightly fuzz
          cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
      - uses: latchkey/cache-save@1.1.0
        with:
          key: fuzz-target
          version: v1
          hash-files: fuzz/Cargo.lock
          path: fuzz/target

  template-provider:
    if: env.LATCHKEY_CI_EVENT_CLASS == 'pr_update' || env.LATCHKEY_CI_EVENT_CLASS == 'workflow_dispatch'
    runs-on: medium
    timeout-minutes: 45
    steps:
      - uses: latchkey/cache-restore@1.1.0
        with:
          key: template-provider
          version: v1
          hash-files: tools/stratum-sv2/template-provider/Cargo.lock
          into: tools/stratum-sv2/template-provider
      - name: Lockfile, tests and clippy
        run: |
          changed_rc=0; bash .latchkey/setup.sh changed '^(tools/stratum-sv2/template-provider/|crates/|Cargo\.(toml|lock)$)' || changed_rc=$?
          if [ "$changed_rc" -eq 1 ]; then exit 0; elif [ "$changed_rc" -ne 0 ]; then exit "$changed_rc"; fi
          bash .latchkey/setup.sh apt
          m=tools/stratum-sv2/template-provider/Cargo.toml
          cargo metadata --locked --format-version 1 --manifest-path "$m" >/dev/null
          cargo test --locked --manifest-path "$m"
          cargo clippy --locked --manifest-path "$m" --all-targets -- -D warnings
      - uses: latchkey/cache-save@1.1.0
        with:
          key: template-provider
          version: v1
          hash-files: tools/stratum-sv2/template-provider/Cargo.lock
          from: tools/stratum-sv2/template-provider
          path: target

  lane:
    runs-on: medium
    timeout-minutes: 90
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      BITCOIN_RS_FUZZ_CORPUS: /tmp/fuzz-corpus/corpus
    strategy:
      fail-fast: false
      matrix:
        lane: [clippy-services, clippy-node-runtime, test-silent-payments, test-storage, test-consensus-execution, test-node-serving]
    steps:
      - run: bash .latchkey/setup.sh apt nextest corpus
      - uses: latchkey/cache-restore@1.1.0
        with:
          key: "${{ matrix.lane }}"
          version: v1
          hash-files: Cargo.lock rust-toolchain.toml
      - name: Run lane
        run: |
          L=${{ matrix.lane }}
          case "$L" in clippy-*) ./scripts/ci-pr.sh clippy "${L#*-}" ;; *) ./scripts/ci-pr.sh test-crates "${L#*-}" ;; esac
      - uses: latchkey/cache-save@1.1.0
        with:
          key: "${{ matrix.lane }}"
          version: v1
          hash-files: Cargo.lock rust-toolchain.toml
          path: target
