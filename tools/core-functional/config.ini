# Framework configuration for the extracted Bitcoin Core v31.1 tree.
#
# This file is a template: @CORE_TESTS_DIR@ (the extraction directory created
# by fetch-core-tests.sh) is rendered by run.sh into the results directory and
# passed to each test via --configfile. The framework reads it in
# test_framework.py parse_args(); paths must be absolute because tests run
# with cwd=<CORE_TESTS_DIR>/test/functional.
#
# SRCDIR/BUILDDIR both point at the extraction dir: BUILDDIR/bin/bitcoind is a
# symlink to bin/bitcoind-wrapper (created by fetch-core-tests.sh), and SRCDIR
# backs feature_loadblock.py (contrib/linearize) and rpc_whitelist.py
# (share/rpcauth via RPCAUTH). Only ENABLE_BITCOIND is on: wallet/cli/zmq and
# other components are absent, so tests that require them take the framework's
# own skip paths instead of failing on missing binaries.

[environment]
CLIENT_NAME=bitcoin-rs-core-functional-lane
CLIENT_BUGREPORT=tools/core-functional/README.md (bitcoin-rs validation lane; not an upstream Bitcoin Core bug tracker)
SRCDIR=@CORE_TESTS_DIR@
BUILDDIR=@CORE_TESTS_DIR@
EXEEXT=
RPCAUTH=@CORE_TESTS_DIR@/share/rpcauth/rpcauth.py

[components]
ENABLE_BITCOIND=true
ENABLE_WALLET=false
BUILD_BENCH=false
ENABLE_CLI=false
BUILD_BITCOIN_TX=false
ENABLE_BITCOIN_UTIL=false
ENABLE_BITCOIN_CHAINSTATE=false
ENABLE_WALLET_TOOL=false
ENABLE_FUZZ_BINARY=false
ENABLE_ZMQ=false
ENABLE_EMBEDDED_ASMAP=false
ENABLE_EXTERNAL_SIGNER=false
ENABLE_USDT_TRACEPOINTS=false
ENABLE_IPC=false
