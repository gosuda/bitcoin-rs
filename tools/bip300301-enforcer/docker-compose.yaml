name: bitcoin-rs-betanet

services:
  node:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: bitcoin-rs:local
    restart: unless-stopped
    init: true
    stop_grace_period: 5m
    environment:
      BITCOIN_RS_NETWORK: "${BITCOIN_RS_NETWORK:-betanet}"
      BITCOIN_RS_STORAGE_BACKEND: fjall
      BITCOIN_RS_RPC_USER: "${BITCOIN_RS_RPC_USER:-bitcoin-rs}"
      BITCOIN_RS_RPC_PASSWORD: "${BITCOIN_RS_RPC_PASSWORD:-password}"
      BITCOIN_RS_LOG_LEVEL: "${BITCOIN_RS_LOG_LEVEL:-info}"
      BITCOIN_RS_REST: "true"
      # The enforcer's mempool mode needs node txindex=1.
      BITCOIN_RS_TXINDEX: "${BITCOIN_RS_TXINDEX:-true}"
      BITCOIN_RS_SCRIPTINDEX: "${BITCOIN_RS_SCRIPTINDEX:-false}"
      BITCOIN_RS_ZMQPUBSEQUENCE: tcp://0.0.0.0:29000
    # intentionally outside the mainnet `data/bitcoin-rs` directory; do not
    # point this stack at a running mainnet/testnet datadir.
    volumes:
      - ../../data/bitcoin-rs-betanet:/data
    ports:
      # Keep RPC private to the Docker host. Change this deliberately if a
      # trusted remote client must connect.
      - "127.0.0.1:${BITCOIN_RS_RPC_PORT:-8532}:8532"
      - "${BITCOIN_RS_P2P_PORT:-8533}:8533"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --user "$${BITCOIN_RS_RPC_USER}:$${BITCOIN_RS_RPC_PASSWORD}"
          --header 'content-type: application/json'
          --data '{"jsonrpc":"1.0","id":"health","method":"getblockchaininfo","params":[]}'
          http://127.0.0.1:8532/ >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  enforcer:
    build:
      context: ../..
      dockerfile: tools/bip300301-enforcer/Dockerfile.enforcer
      args:
        ENFORCER_REVISION: "${ENFORCER_REVISION:-0e27251ef351a522c72ab9ef079f75e06075390f}"
    image: bip300301-enforcer:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      node:
        condition: service_healthy
    command:
      - --data-dir=/data
      - --network-preset=${BITCOIN_RS_NETWORK:-betanet}
      - --node-rpc-addr=node:8532
      - --node-rpc-user=${BITCOIN_RS_RPC_USER:-bitcoin-rs}
      - --node-rpc-pass=${BITCOIN_RS_RPC_PASSWORD:-password}
      - --node-zmq-addr-sequence=tcp://node:29000
      - --enable-mempool
      - --bitcoin-core-skip-version-check
      - --serve-grpc-addr=0.0.0.0:50051
      - --serve-rpc-addr=0.0.0.0:8122
    # intentionally outside the mainnet `data/enforcer` directory.
    volumes:
      - ../../data/enforcer-betanet:/data
    ports:
      - "127.0.0.1:${ENFORCER_GRPC_PORT:-50051}:50051"
      - "127.0.0.1:${ENFORCER_RPC_PORT:-8122}:8122"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          -X POST -H 'Content-Type: application/json'
          http://127.0.0.1:50051/cusf.mainchain.v1.ValidatorService/GetChainInfo
          >/dev/null
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
