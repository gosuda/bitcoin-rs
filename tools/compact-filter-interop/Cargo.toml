[package]
name = "compact-filter-interop"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the external consumer's dependency graph out of node builds. The client
# is linked unmodified; this executable only uses its public application API.
[workspace]

[workspace.dependencies]
sonic-rs = { version = ">=0.5, <0.6", default-features = false, features = ["sort_keys"] }
[dependencies]
bip157 = { git = "https://github.com/2140-dev/kyoto", rev = "0169dc3514c8238147302535a1123d5c37468de6" }
sonic-rs.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
