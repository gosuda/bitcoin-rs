[package]
name = "swiftsync-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
publish = false
description = "Standalone SwiftSync hint-fold prototype and measurement harness"

# Independent workspace: this prototype never enters node builds or the node
# dependency graph. Same layout as tools/ldk and tools/compact-filter-interop.
[workspace]

[lints]
workspace = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes       = "warn"
unreachable_pub        = "warn"

[workspace.lints.clippy]
correctness                  = { level = "deny", priority = -1 }
suspicious                   = { level = "warn", priority = -1 }
complexity                   = { level = "warn", priority = -1 }
perf                         = { level = "warn", priority = -1 }
pedantic                     = { level = "warn", priority = -1 }
nursery                      = { level = "warn", priority = -1 }
as_conversions               = "deny"
cast_lossless                = "deny"
unwrap_used                  = "deny"
expect_used                  = "warn"
dbg_macro                    = "deny"
todo                         = "deny"
unimplemented                = "deny"
mod_module_files             = "deny"
module_name_repetitions      = "allow"
similar_names                = "allow"
must_use_candidate           = "allow"
missing_errors_doc           = "allow"
missing_panics_doc           = "allow"
struct_field_names           = "allow"
option_if_let_else           = "allow"
manual_let_else              = "allow"
format_push_string           = "allow"
missing_const_for_fn         = "allow"
collapsible_if               = "allow"
needless_continue            = "allow"
items_after_statements       = "allow"

[dependencies]
bitcoin = { version = ">=0.32.9, <0.33", default-features = false, features = ["std"] }
bitcoin-rs-primitives = { path = "../../crates/primitives" }
bitcoin-rs-utxo = { path = "../../crates/utxo" }
rustix = { version = "=1.1.5", default-features = false, features = ["time"] }
thiserror = { version = ">=2.0.18, <3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = { version = ">=3.20.0, <4" }

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
