[package]
name = "bitcoin-rs-sv2-template-provider"
version = "0.1.0"
edition = "2024"
publish = false
description = "SV2 Template Distribution bridge between bitcoin-rs's mining owner and an external Stratum V2 pool (example for issue #1289)"

# Standalone crate: keeps SRI dependencies out of the bitcoin-rs workspace.
[workspace]

[dependencies]
# SRI protocol plumbing only: Noise_XX transport (`network`) and the SV2
# codec/frame types (`core`). `bitcoin-core-sv2`, `config`, `sv1` and every
# role bundle stay disabled — the bridge speaks JSON-RPC to bitcoin-rs, not
# Bitcoin Core IPC, and its only config surface is the environment.
stratum-apps = { version = "0.8.0", default-features = false, features = ["network", "core", "std"] }
# Key material for `Secp256k1SecretKey`: stratum-apps 0.8 wraps secp256k1
# 0.28, while its rust-bitcoin re-export uses 0.29 — a different type.
secp256k1 = { version = "0.28", default-features = false, features = ["alloc", "rand"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
