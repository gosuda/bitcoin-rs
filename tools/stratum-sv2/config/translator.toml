# SRI translator_sv2 v0.8.0 config, mounted read-only at the image's default
# config path /app/translator-config.toml (the binary's `-c` default;
# TPROXY__* env vars are an override layer we do not use).

# SV1 downstream listener (compose-internal; published to the host as
# 127.0.0.1:3333 for the optional SV1 leg).
downstream_address = "0.0.0.0"
downstream_port = 3333

max_supported_version = 2
min_supported_version = 2

# Rollable extranonce part handed to SV1 miners.
downstream_extranonce2_size = 4

# Do not cross-check upstream coinbase outputs against the payout encoded in
# each user_identity (our identities are address.worker labels, unchecked).
verify_payout = false

# All SV1 miners share one upstream SV2 channel at the pool.
aggregate_channels = true

monitoring_address = "0.0.0.0:9092"
monitoring_cache_refresh_secs = 15

# Difficulty params tuned for CPU-class downstream miners, not ASICs:
# 10 kH/s weakest-miner assumption, 6 shares/min, vardiff enabled.
[downstream_difficulty_config]
min_individual_miner_hashrate = 10_000.0
shares_per_minute = 6.0
enable_vardiff = true
job_keepalive_interval_secs = 60

[[upstreams]]
address = "pool"
port = 34255
# Same EXAMPLE-ONLY SRI reference authority keypair as config/pool.toml —
# the pool's Noise certificate is signed with it, so the translator must pin
# the matching public key.
authority_pubkey = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
user_identity = "bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080.worker1"
