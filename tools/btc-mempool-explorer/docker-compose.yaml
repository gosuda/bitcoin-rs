name: bitcoin-rs-btc-mempool-explorer

services:
  node:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: bitcoin-rs:btc-mempool-explorer-local
    init: true
    stop_grace_period: 5m
    environment:
      BITCOIN_RS_NETWORK: "${BITCOIN_RS_NETWORK:-mainnet}"
      BITCOIN_RS_STORAGE_BACKEND: fjall
      BITCOIN_RS_RPC_USER: "${BITCOIN_RS_RPC_USER:-mempool}"
      BITCOIN_RS_RPC_PASSWORD: "${BITCOIN_RS_RPC_PASSWORD:-change-me}"
      BITCOIN_RS_TXINDEX: "true"
      BITCOIN_RS_SCRIPTINDEX: "true"
      BITCOIN_RS_LOG_LEVEL: "${BITCOIN_RS_LOG_LEVEL:-info}"
    volumes:
      - ../../data/bitcoin-rs:/data
    ports:
      - "127.0.0.1:${BITCOIN_RS_RPC_PORT:-8332}:8332"
      - "${BITCOIN_RS_P2P_PORT:-8333}:8333"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --user "$${BITCOIN_RS_RPC_USER}:$${BITCOIN_RS_RPC_PASSWORD}"
          --header 'content-type: application/json'
          --data '{"jsonrpc":"1.0","id":"health","method":"getblockchaininfo","params":[]}'
          http://127.0.0.1:8332/ >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: mempool/backend:v3.3.1
    init: true
    depends_on:
      db:
        condition: service_healthy
      node:
        condition: service_healthy
    command: >-
      ./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh
    environment:
      MEMPOOL_NETWORK: "${BITCOIN_RS_NETWORK:-mainnet}"
      MEMPOOL_BACKEND: esplora
      ESPLORA_REST_API_URL: http://node:8332/api
      CORE_RPC_HOST: node
      CORE_RPC_PORT: "8332"
      CORE_RPC_USERNAME: "${BITCOIN_RS_RPC_USER:-mempool}"
      CORE_RPC_PASSWORD: "${BITCOIN_RS_RPC_PASSWORD:-change-me}"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: db
      DATABASE_DATABASE: mempool
      DATABASE_USERNAME: mempool
      DATABASE_PASSWORD: "${MEMPOOL_DATABASE_PASSWORD:-change-me}"
      MAXMIND_ENABLED: "false"
      FIAT_PRICE_ENABLED: "false"
    volumes:
      - ../../data/mempool-cache:/backend/cache
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8999/api/v1/backend-info >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: mempool/frontend:v3.3.1
    init: true
    depends_on:
      api:
        condition: service_healthy
    command: >-
      ./wait-for api:8999 --timeout=720 -- nginx -g 'daemon off;'
    environment:
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: api
      BACKEND_MAINNET_HTTP_PORT: "8999"
    volumes:
      - ./nginx-mempool.conf:/etc/nginx/conf.d/nginx-mempool.conf
    ports:
      - "0.0.0.0:${MEMPOOL_EXPLORER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/ | grep -q '<html'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: mariadb:10.5.21
    init: true
    environment:
      MYSQL_DATABASE: mempool
      MYSQL_USER: mempool
      MYSQL_PASSWORD: "${MEMPOOL_DATABASE_PASSWORD:-change-me}"
      MYSQL_ROOT_PASSWORD: "${MEMPOOL_DATABASE_ROOT_PASSWORD:-change-me}"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ../../data/mempool-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mempool", "-p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
