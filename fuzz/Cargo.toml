[workspace]

[package.metadata]
cargo-fuzz = true

[package]
name = "bitcoin-rs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
libfuzzer-sys = "0.4"
bitcoin = { version = ">=0.32.9, <0.33", default-features = false, features = [
    "std", "secp-recovery", "serde", "rand-std",
] }
bitcoin-rs-p2p = { path = "../crates/p2p", default-features = false }
bitcoin-rs-script = { path = "../crates/script", default-features = false }
bitcoin-rs-primitives = { path = "../crates/primitives" }
bitcoin-rs-consensus = { path = "../crates/consensus", default-features = false }
bitcoin-rs-mempool = { path = "../crates/mempool", default-features = false }
bitcoin-rs-utxo = { path = "../crates/utxo" }

[[bin]]
name = "p2p_message"
path = "fuzz_targets/p2p_message.rs"

[[bin]]
name = "block_validate"
path = "fuzz_targets/block_validate.rs"

[[bin]]
name = "tx_validate"
path = "fuzz_targets/tx_validate.rs"

[[bin]]
name = "script_eval"
path = "fuzz_targets/script_eval.rs"

[[bin]]
name = "utxo_snapshot"
path = "fuzz_targets/utxo_snapshot.rs"
