[workspace]

[package.metadata]
cargo-fuzz = true

[package]
name = "bitcoin-rs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
libfuzzer-sys = "0.4"
bitcoin = { version = ">=0.32.9, <0.33", default-features = false, features = [
    "std", "secp-recovery", "serde", "rand-std",
] }
bitcoin-rs-p2p = { path = "../crates/p2p", default-features = false, features = ["fuzzing"] }
bitcoin-rs-consensus = { path = "../crates/consensus", default-features = false }
bitcoin-rs-mempool = { path = "../crates/mempool", default-features = false }
tempfile = "3"
bitcoin-rs-index = { path = "../crates/index" }
bitcoin-rs-rpc = { path = "../crates/rpc", default-features = false, features = ["test-seam"] }
bitcoin-rs-storage = { path = "../crates/storage", default-features = false }
bitcoin-rs-chain = { path = "../crates/chain", features = ["test-seam"] }
bitcoin-rs-chainstate = { path = "../crates/chainstate", features = ["test-seam"] }
sonic-rs = "0.5"
miniscript = { version = ">=13, <14", default-features = false, features = ["std"] }
[[bin]]
name = "p2p_message"
path = "fuzz_targets/p2p_message.rs"

[[bin]]
name = "block_validate"
path = "fuzz_targets/block_validate.rs"

[[bin]]
name = "tx_validate"
path = "fuzz_targets/tx_validate.rs"

[[bin]]
name = "script_eval"
path = "fuzz_targets/script_eval.rs"

[[bin]]
name = "utxo_snapshot"
path = "fuzz_targets/utxo_snapshot.rs"

[[bin]]
name = "p2p_message_structured"
path = "fuzz_targets/p2p_message_structured.rs"

[[bin]]
name = "bip324_transport"
path = "fuzz_targets/bip324_transport.rs"

[[bin]]
name = "addrman_load"
path = "fuzz_targets/addrman_load.rs"

[[bin]]
name = "compact_block_reconstruct"
path = "fuzz_targets/compact_block_reconstruct.rs"

[[bin]]
name = "socks_sam_reply"
path = "fuzz_targets/socks_sam_reply.rs"

[[bin]]
name = "rpc_http_request"
path = "fuzz_targets/rpc_http_request.rs"

[[bin]]
name = "jsonrpc_batch"
path = "fuzz_targets/jsonrpc_batch.rs"

[[bin]]
name = "esplora_route"
path = "fuzz_targets/esplora_route.rs"

[[bin]]
name = "rpc_hex_params"
path = "fuzz_targets/rpc_hex_params.rs"

[[bin]]
