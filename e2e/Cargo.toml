[package]
name = "bitcoin-rs-e2e"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "end-to-end process tests for the bitcoin-rs node binary"
publish = false
# Product and diagnostic benchmarks are integrated here rather than owned by
# individual library crates.
autobenches = false

[features]
default = ["fjall"]
fjall = ["bitcoin-rs-node/fjall", "bitcoin-rs-chainstate/fjall"]
redb = ["bitcoin-rs-node/redb", "bitcoin-rs-chainstate/redb"]
rocksdb = ["bitcoin-rs-node/rocksdb", "bitcoin-rs-chainstate/rocksdb"]

[lints]
workspace = true

[dependencies]
bitcoin-rs-rpc = { workspace = true }
bitcoin.workspace = true
serde_json.workspace = true
toml.workspace = true
tempfile = ">=3.20.0, <4"

[dev-dependencies]
anyhow.workspace = true
arc-swap.workspace = true
bitcoin-rs-chain = { workspace = true, features = ["test-seam"] }
bitcoin-rs-chainstate.workspace = true
bitcoin-rs-consensus.workspace = true
bitcoin-rs-index = { workspace = true, features = ["test-seam"] }
bitcoin-rs-mempool = { workspace = true, features = ["test-seam"] }
bitcoin-rs-mining = { workspace = true, features = ["test-seam"] }
bitcoin-rs-node.workspace = true
bitcoin-rs-p2p = { workspace = true, features = ["test-seam"] }
bitcoin-rs-primitives.workspace = true
bitcoin-rs-script.workspace = true
bitcoin-rs-storage.workspace = true
bitcoin-rs-utxo.workspace = true
criterion.workspace = true
crossbeam-channel.workspace = true
hashbrown.workspace = true
mimalloc.workspace = true
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true

[features]
default = []
usdt = ["bitcoin-rs-node/usdt"]
rocksdb = ["bitcoin-rs-node/rocksdb"]
fjall = ["bitcoin-rs-node/fjall"]
redb = ["bitcoin-rs-node/redb"]
kernel = ["bitcoin-rs-node/kernel"]
zmq = ["bitcoin-rs-node/zmq"]

[[bench]]
name = "block_facts"
harness = false

[[bench]]
name = "merkle"
harness = false

[[bench]]
name = "history_resolve"
harness = false
required-features = ["rocksdb"]

[[bench]]
name = "pareto"
harness = false

[[bench]]
name = "entry_construction_bench"
harness = false

[[bench]]
name = "candidate"
harness = false

[[bench]]
name = "chainstate_journal"
harness = false

[[bench]]
name = "evidence"
harness = true

[[bench]]
name = "sync_pipeline"
harness = false

[[bench]]
name = "headers_presync"
harness = false

[[bench]]
name = "write_message"
harness = false

[[bench]]
name = "storage_footprint"
harness = false
required-features = ["fjall"]

[[bench]]
name = "utxo_commit"
harness = false
