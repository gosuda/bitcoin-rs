# Grounded 2026-08-26.
# Rust stable: 1.98.0 (2026-08-20), with no LTS or fixed EoS channel. The repository
# pin to 1.95.0 (2026-04-16) wins: https://static.rust-lang.org/dist/channel-rust-stable.toml
# pre-commit stable: 4.6.2 (2026-08-10), with no LTS or fixed EoS channel:
# https://pypi.org/pypi/pre-commit/json
# cargo-husky 1.5.0 (2020-01-21) is rejected as unmaintained:
# https://crates.io/api/v1/crates/cargo-husky
minimum_pre_commit_version: "4.6.2"
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo +1.95.0 fmt --all -- --check
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: cargo-clippy-full-node
        name: cargo clippy (full node)
        entry: cargo +1.95.0 clippy -p bitcoin-rs --all-targets --no-default-features --features rocksdb,fjall,redb,mdbx,kernel,zmq -- -D warnings
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: cargo-clippy-node-tests
        name: cargo clippy (node test targets)
        entry: cargo +1.95.0 clippy -p bitcoin-rs-node --all-targets -- -D warnings
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: cargo-test-workspace
        name: cargo test (workspace)
        entry: cargo +1.95.0 test --workspace --no-fail-fast
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: cargo-test-full-node
        name: cargo test (full node)
        entry: cargo +1.95.0 test -p bitcoin-rs --no-fail-fast --no-default-features --features rocksdb,fjall,redb,mdbx,kernel,zmq
        language: unsupported
        pass_filenames: false
        always_run: true
