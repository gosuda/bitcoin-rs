# Grounded 2026-08-26.
# Rust stable: 1.98.0 (2026-08-20), with no LTS or fixed EoS channel. The repository
# pin to 1.95.0 (2026-04-16) wins: https://static.rust-lang.org/dist/channel-rust-stable.toml
# pre-commit stable: 4.6.2 (2026-08-10), with no LTS or fixed EoS channel:
# https://pypi.org/pypi/pre-commit/json
# cargo-husky 1.5.0 (2020-01-21) is rejected as unmaintained:
# https://crates.io/api/v1/crates/cargo-husky
minimum_pre_commit_version: "4.6.2"
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ci-pr-fmt
        name: PR gate fmt
        entry: ./scripts/ci-pr.sh fmt
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: ci-pr-clippy
        name: PR gate clippy
        entry: ./scripts/ci-pr.sh clippy
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: ci-pr-test
        name: PR gate test
        entry: ./scripts/ci-pr.sh test
        language: unsupported
        pass_filenames: false
        always_run: true
