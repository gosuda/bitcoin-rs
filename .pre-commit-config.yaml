# Grounded 2026-08-26.
# The hooks mirror the kernel-free pull-request gate by invoking
# scripts/ci-pr.sh, the single owner of those commands; no local hook enables
# the kernel feature or needs CMake/Boost. Rust follows the rolling stable
# channel via rust-toolchain.toml; Cargo.toml/clippy.toml retain the 1.95.0
# MSRV compatibility floor.
# pre-commit stable: 4.6.2 (2026-08-10), with no LTS or fixed EoS channel:
# https://pypi.org/pypi/pre-commit/json
# cargo-husky 1.5.0 (2020-01-21) is rejected as unmaintained:
# https://crates.io/api/v1/crates/cargo-husky
minimum_pre_commit_version: "4.6.2"
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ci-pr-fmt
        name: PR gate fmt
        entry: ./scripts/ci-pr.sh fmt
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: ci-pr-clippy
        name: PR gate clippy
        entry: ./scripts/ci-pr.sh clippy
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: ci-pr-test
        name: PR gate tests
        entry: ./scripts/ci-pr.sh test
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: ci-pr-deny
        name: PR gate deny
        entry: ./scripts/ci-pr.sh deny
        language: unsupported
        pass_filenames: false
        always_run: true
