[package]
autotests = false
name = "bitcoin-rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs node binary"

[[bin]]
name = "bitcoin-rs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mimalloc.workspace = true
thiserror.workspace = true
clap.workspace = true
toml.workspace = true
bitcoin-rs-node.workspace = true
bitcoin-rs-execution.workspace = true
bitcoin-rs-storage.workspace = true
bitcoin-rs-consensus.workspace = true

[dev-dependencies]
parking_lot.workspace = true
rustix.workspace = true
sonic-rs.workspace = true
tempfile.workspace = true
bitcoin.workspace = true
bitcoin-rs-consensus.workspace = true
bitcoin-rs-rpc = { workspace = true }
bitcoin-rs-e2e.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true

[features]
usdt = ["bitcoin-rs-consensus/usdt"]

default = ["zmq"]
kernel = ["bitcoin-rs-node/kernel"]
zmq = ["bitcoin-rs-node/zmq"]
silent-payments = ["bitcoin-rs-node/silent-payments"]
pool = ["bitcoin-rs-node/pool"]
pool-sv2 = ["bitcoin-rs-node/pool-sv2"]
surrealkv = [
    "bitcoin-rs-node/surrealkv",
    "bitcoin-rs-execution/surrealkv",
    "bitcoin-rs-storage/surrealkv",
]
mdbx = [
    "bitcoin-rs-node/mdbx",
    "bitcoin-rs-execution/mdbx",
    "bitcoin-rs-storage/mdbx",
]

[[test]]
name = "suite"
path = "tests/suite.rs"
