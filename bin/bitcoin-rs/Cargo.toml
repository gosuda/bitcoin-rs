[package]
name = "bitcoin-rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs node binary"

[[bin]]
name = "bitcoin-rs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mimalloc.workspace = true
anyhow.workspace = true
bitcoin-rs-node.workspace = true

[dev-dependencies]
parking_lot.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = ">=3.20.0, <4"
bitcoin-rs-consensus.workspace = true
bitcoin-rs-primitives.workspace = true
[features]
default = ["fjall", "redb", "zmq"]
rocksdb = ["bitcoin-rs-node/rocksdb"]
fjall = ["bitcoin-rs-node/fjall"]
redb = ["bitcoin-rs-node/redb"]
mdbx = ["bitcoin-rs-node/mdbx"]
kernel = ["bitcoin-rs-node/kernel"]
zmq = ["bitcoin-rs-node/zmq"]

[[test]]
name = "g17_dependency_direction"
path = "tests/gates/g17_dependency_direction.rs"
