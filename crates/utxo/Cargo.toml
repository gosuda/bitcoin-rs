[package]
autotests = false
name = "bitcoin-rs-utxo"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: utxo"

[lints]
workspace = true

[features]
default = []
# Exposes `UtxoReader::fixture_set` so a test fixture can commit through
# `utxo::contract`. Production readers never reach the set.
test-seam = []

[dependencies]
bitcoin-rs-primitives.workspace = true
bitcoin-rs-storage = { workspace = true, default-features = false }
hashbrown.workspace = true
parking_lot.workspace = true
crossbeam-utils.workspace = true
nohash-hasher.workspace = true
rayon.workspace = true
zerocopy.workspace = true
ruint.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
secp256k1.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
bitcoin.workspace = true


[[test]]
name = "suite"
path = "tests/suite.rs"
