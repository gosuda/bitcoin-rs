[package]
name = "bitcoin-rs-utxo"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: utxo"

[lints]
workspace = true

[features]
default = []
rocksdb = ["bitcoin-rs-storage/rocksdb"]
fjall = ["bitcoin-rs-storage/fjall"]
redb = ["bitcoin-rs-storage/redb"]
mdbx = ["bitcoin-rs-storage/mdbx"]

[dependencies]
bitcoin-rs-primitives.workspace = true
bitcoin-rs-storage = { workspace = true, default-features = false }
hashbrown.workspace = true
parking_lot.workspace = true
crossbeam-utils.workspace = true
nohash-hasher.workspace = true
rayon.workspace = true
bytemuck.workspace = true
zerocopy.workspace = true
ruint.workspace = true
tinyvec.workspace = true
smallvec.workspace = true
lz4_flex.workspace = true
metrics.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
proptest-derive.workspace = true
criterion.workspace = true
tempfile = ">=3.20.0, <4"
# The benchmark uses the same allocator as the production binary. Inherits
# `default-features = false`, matching `bin/bitcoin-rs`.
mimalloc.workspace = true
bitcoin.workspace = true

[[bench]]
name = "utxo_commit"
harness = false
