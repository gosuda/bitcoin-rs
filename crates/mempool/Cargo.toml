[package]
name = "bitcoin-rs-mempool"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: mempool"

[lints]
workspace = true

[features]
default = []
test-seam = []

[dependencies]
bitcoin-rs-primitives.workspace = true
bitcoin-rs-consensus.workspace = true
bitcoin-rs-script.workspace = true
sha2.workspace = true
hashbrown.workspace = true
smallvec.workspace = true
parking_lot.workspace = true
metrics.workspace = true
arc-swap.workspace = true
slab.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
bitcoin.workspace = true
criterion.workspace = true
# Own integration tests are a separate crate: the lib compiles there without
# `cfg(test)`, so the cross-crate admission park seam must arrive through the
# `test-seam` feature, the same way `bitcoin-rs-node` and `bitcoin-rs-rpc`
# opt in.
bitcoin-rs-mempool = { path = ".", features = ["test-seam"] }

[[bench]]
name = "pareto"
harness = false
