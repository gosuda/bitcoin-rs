[package]
autotests = false
name = "bitcoin-rs-mempool"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: mempool"

[lints]
workspace = true

[features]

default = []
test-seam = []

[dependencies]
bitcoin-rs-consensus.workspace = true
bitcoin-rs-storage.workspace = true
sha2.workspace = true
hashbrown.workspace = true
parking_lot.workspace = true
metrics.workspace = true
bytemuck.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true

[dev-dependencies]
bitcoin.workspace = true
proptest.workspace = true
# Own integration tests are a separate crate: the lib compiles there without
# `cfg(test)`, so the cross-crate admission park seam must arrive through the
# `test-seam` feature, the same way `bitcoin-rs-node` and `bitcoin-rs-serving`
# opt in.
bitcoin-rs-mempool = { workspace = true, features = ["test-seam"] }


[[test]]
name = "suite"
path = "tests/suite.rs"
