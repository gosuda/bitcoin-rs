[package]
autotests = false
name = "bitcoin-rs-consensus"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: consensus"

[lints]
workspace = true

[features]
# `kernel` is capability ("bitcoinkernel support is compiled in"), not
# selection: the engine a run uses is `validation.engine` at runtime. The
# library default is kernel-free so a plain `cargo build` needs no C++
# toolchain (`cmake`, `libboost`); enable `kernel` explicitly for the
# bitcoinkernel backend. See docs/contracts/validation-default.md.
default = []
kernel = ["dep:bitcoinkernel"]
test-seam = []
# Emits SystemTap/DTrace USDT probes with Bitcoin Core's provider names and
# argument layout (crate-root `probes.d`, module `trace`). Off by default:
# nothing is prepared or emitted unless a consumer raises a probe semaphore.
usdt = ["dep:usdt", "dep:tracing"]

[dependencies]
bytemuck.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
ruint.workspace = true
serde.workspace = true
sha3.workspace = true
tinyvec.workspace = true
zerocopy.workspace = true
secp256k1.workspace = true
bitcoin_hashes.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
parking_lot.workspace = true
sha2.workspace = true
thiserror.workspace = true
bitcoinkernel = { workspace = true, optional = true }
rayon.workspace = true
usdt = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
bitcoin.workspace = true
sonic-rs.workspace = true
bitcoin-rs-e2e.workspace = true
proptest.workspace = true


[[test]]
name = "suite"
path = "tests/suite.rs"

# Inspects its own ELF/USDT notes; retain an independent artifact boundary.
[[test]]
name = "sdt_notes"
path = "tests/sdt_notes.rs"

[[test]]
name = "primitives_witness_heap_amplification"
path = "tests/primitives_witness_heap_amplification.rs"
