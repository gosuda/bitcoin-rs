[package]
name = "bitcoin-rs-rpc"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: rpc"

[lints]
workspace = true

[features]
default = []
# Synthetic capability worlds for tests, not production composition.
test-seam = []
zmq = ["dep:zmq"]

[dependencies]
bitcoin-rs-primitives.workspace = true
bitcoin-rs-consensus.workspace = true
bitcoin-rs-chain.workspace = true
bitcoin-rs-index.workspace = true
bitcoin-rs-mempool.workspace = true
bitcoin-rs-p2p.workspace = true
bitcoin-rs-utxo.workspace = true
bitcoin-rs-mining.workspace = true
bitcoin-rs-script.workspace = true
bitcoin.workspace = true
miniscript.workspace = true
sonic-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
crossbeam-channel.workspace = true
compact_str.workspace = true
hashbrown.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
corepc-types.workspace = true
anyhow.workspace = true
zmq = { workspace = true, optional = true }

[dev-dependencies]
bitcoin-rs-rpc = { workspace = true, features = ["test-seam"] }
toml.workspace = true
bitcoin-rs-e2e.workspace = true
bitcoin-rs-chain = { workspace = true, features = ["test-seam"] }
bitcoin-rs-chainstate = { workspace = true, features = ["test-seam"] }
bitcoin-rs-node = { workspace = true, default-features = false, features = ["fjall", "test-seam"] }
bitcoin-rs-mempool = { workspace = true, features = ["test-seam"] }
bitcoin-rs-mining = { workspace = true, features = ["test-seam"] }
bitcoin-rs-utxo = { workspace = true, features = ["test-seam"] }
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dev-dependencies]
cap-std.workspace = true
cap-fs-ext.workspace = true
