[package]
name = "bitcoin-rs-chain"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: chain"

[lints]
workspace = true

[features]
default = []
rocksdb = ["bitcoin-rs-storage/rocksdb"]
fjall = ["bitcoin-rs-storage/fjall"]
redb = ["bitcoin-rs-storage/redb"]
test-seam = []

[dependencies]
bitcoin-rs-primitives.workspace = true
bitcoin-rs-consensus.workspace = true
bitcoin-rs-storage = { workspace = true, default-features = false }
slab.workspace = true
hashbrown.workspace = true
arc-swap.workspace = true
parking_lot.workspace = true
ruint.workspace = true
bytemuck.workspace = true
thiserror.workspace = true

[dev-dependencies]
bitcoin.workspace = true
# Own integration tests are a separate crate: the lib compiles there without
# `cfg(test)`, so the regtest fixture seam must arrive through the
# `test-seam` feature, the same way `bitcoin-rs-mempool` opts its tests in.
bitcoin-rs-chain = { workspace = true, features = ["test-seam"] }
