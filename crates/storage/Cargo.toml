[package]
autotests = false
name = "bitcoin-rs-storage"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: storage"

[lints]
workspace = true

[features]
default = []
# Explicit fixture/fault-injection surface; never a production default.
test-seam = []
surrealkv = ["dep:surrealkv", "dep:tokio"]
mdbx = ["dep:signet-libmdbx"]

[dependencies]
crossbeam-utils.workspace = true
nohash-hasher.workspace = true
rayon.workspace = true
ruint.workspace = true
smallvec.workspace = true
secp256k1.workspace = true
zerocopy.workspace = true
arc-swap.workspace = true
bitcoin-rs-consensus.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
sonic-rs.workspace = true
sha2.workspace = true
bytes.workspace = true
hashbrown.workspace = true
metrics.workspace = true
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

rust-rocksdb.workspace = true

signet-libmdbx = { workspace = true, optional = true }
surrealkv = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android", target_os = "redox"))'.dependencies]
rustix.workspace = true


[dev-dependencies]
bitcoin.workspace = true
bitcoin-rs-storage = { workspace = true, features = ["test-seam"] }
proptest.workspace = true
tempfile.workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "mdbx_bounded_read_allocation"
path = "tests/mdbx_bounded_read_allocation.rs"
required-features = ["mdbx"]

[[test]]
name = "utxo_query_lifetime"
path = "tests/utxo_query_lifetime.rs"
