[package]
name = "bitcoin-rs-storage"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: storage"

[lints]
workspace = true

[features]
default = ["fjall"]
# The process-local `InMemoryKvStore` for cross-crate test fixtures only.
test-seam = []
rocksdb = ["dep:rust-rocksdb"]
fjall = ["dep:fjall"]
redb = ["dep:redb"]

[dependencies]
arc-swap.workspace = true
bitcoin-rs-primitives.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
serde_json.workspace = true
sha2.workspace = true
bytes.workspace = true
hashbrown.workspace = true
metrics.workspace = true
parking_lot.workspace = true
rustix.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

rust-rocksdb = { workspace = true, optional = true }
fjall = { workspace = true, optional = true }
redb = { workspace = true, optional = true }

[dev-dependencies]
libc = ">=0.2.189, <0.3"
proptest.workspace = true
tempfile = ">=3.20.0, <4"
# Own integration tests are a separate crate: the lib compiles there without
# `cfg(test)`, so `InMemoryKvStore` must arrive through the `test-seam`
# feature, the same way `bitcoin-rs-chain` opts its tests in.
bitcoin-rs-storage = { workspace = true, features = ["test-seam"] }
