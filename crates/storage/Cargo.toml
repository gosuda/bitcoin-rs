[package]
name = "bitcoin-rs-storage"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: storage"

[lints]
workspace = true

[features]
default = ["fjall"]
rocksdb = ["dep:rust-rocksdb"]
fjall = ["dep:fjall"]
redb = ["dep:redb"]
# Explicit fixture/fault-injection surface; never a production default.
test-seam = []

[dependencies]
arc-swap.workspace = true
bitcoin-rs-primitives.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
serde_json.workspace = true
sha2.workspace = true
bytes.workspace = true
hashbrown.workspace = true
metrics.workspace = true
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

rust-rocksdb = { workspace = true, optional = true }
fjall = { workspace = true, optional = true }
redb = { workspace = true, optional = true }

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android", target_os = "redox"))'.dependencies]
rustix.workspace = true


[dev-dependencies]
bitcoin-rs-storage = { workspace = true, features = ["test-seam"] }
libc = ">=0.2.189, <0.3"
proptest.workspace = true
tempfile.workspace = true
