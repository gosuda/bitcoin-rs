[package]
name = "bitcoin-rs-pool-ledger"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: durable external-signer PPLNS pool ledger"

[lib]
name = "pool_ledger"

[features]
default = []
# Explicitly test-only crash/fault hooks, never enabled by node production features.
test-seam = []

[[test]]
name = "ledger"
required-features = ["test-seam"]

[lints]
workspace = true

[dependencies]
bitcoin-rs-storage.workspace = true
sha2.workspace = true

[dev-dependencies]
bitcoin-rs-storage = { workspace = true, features = ["test-seam", "redb", "fjall"] }
tempfile.workspace = true
