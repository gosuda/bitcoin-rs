[package]
autotests = false
name = "bitcoin-rs-p2p"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: p2p"

[lints]
workspace = true

[features]
# Worker injection for cross-crate teardown tests; never enabled in release
# builds.
test-seam = []

# Internal seam surface for the fuzz harnesses: lifts addrman, bip324, sam,
# socks modules to pub so the out-of-tree targets can reach them. Never
# enabled in release builds.
fuzzing = []

# Optional overlay transports (I2P SAM bridge, Tor control port). Declared
# so baseline P2P (direct TCP) builds without the overlay surface; the
# `mod` gates land as a verified follow-up once endpoint/service lanes add
# their matching cfgs (pool overlay-review-fixes coordination). On by
# default, so the default build keeps current behavior exactly.
overlay = []

default = ["overlay"]

[dependencies]
bitcoin-rs-consensus.workspace = true
bitcoin-rs-chain.workspace = true
bitcoin-rs-chainstate = { workspace = true, default-features = false }
bitcoin-rs-mempool.workspace = true
bitcoin-rs-storage = { workspace = true, default-features = false }
bitcoin-rs-index.workspace = true
bitcoin.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
metrics.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
base64.workspace = true
serde.workspace = true
sonic-rs.workspace = true
chacha20.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "net"] }

[dev-dependencies]
bitcoin-rs-chain = { workspace = true, features = ["test-seam"] }
bitcoin-rs-mempool = { workspace = true, features = ["test-seam"] }
proptest.workspace = true
proptest-state-machine.workspace = true
tempfile.workspace = true


[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "decode_heap_amplification"
path = "tests/decode_heap_amplification.rs"
