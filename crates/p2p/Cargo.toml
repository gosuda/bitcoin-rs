[package]
name = "bitcoin-rs-p2p"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: p2p"

[lints]
workspace = true

# Backend features forward through `bitcoin-rs-chain` (an approved adapter),
# which propagates the selection into `bitcoin-rs-storage`; p2p itself holds
# no storage handle (ARCH-03).
[features]
# Worker injection for cross-crate teardown tests; never enabled in release
# builds.
test-seam = []

default = ["fjall"]
rocksdb = ["bitcoin-rs-chain/rocksdb"]
fjall = ["bitcoin-rs-chain/fjall"]
redb = ["bitcoin-rs-chain/redb"]

[dependencies]
bitcoin-rs-consensus.workspace = true
bitcoin-rs-chain.workspace = true
bitcoin-rs-mempool.workspace = true
bitcoin-rs-primitives.workspace = true
bitcoin.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
metrics.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true

[dev-dependencies]
bitcoin-rs-chain = { workspace = true, features = ["test-seam"] }
bitcoin-rs-mempool = { workspace = true, features = ["test-seam"] }
proptest.workspace = true
serde_json.workspace = true
bitcoin-rs-consensus.workspace = true
