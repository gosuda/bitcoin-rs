[package]
name = "bitcoin-rs-p2p"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: p2p"

[lints]
workspace = true

[features]
# Worker injection for cross-crate teardown tests; never enabled in release
# builds.
test-seam = []

default = []

[dependencies]
bitcoin-rs-consensus.workspace = true
bitcoin-rs-chain.workspace = true
bitcoin-rs-chainstate = { workspace = true, default-features = false }
bitcoin-rs-mempool.workspace = true
bitcoin-rs-primitives.workspace = true
bitcoin.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
metrics.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true

[dev-dependencies]
bitcoin-rs-chain = { workspace = true, features = ["test-seam"] }
bitcoin-rs-mempool = { workspace = true, features = ["test-seam"] }
criterion.workspace = true
proptest.workspace = true
serde_json.workspace = true

[[bench]]
name = "write_message"
harness = false

[[bench]]
name = "headers_presync"
harness = false
