[package]
name = "bitcoin-rs-chainstate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: authoritative chainstate"

[lints]
workspace = true

[features]

# `kernel` is capability ("bitcoinkernel support is compiled in"), not
# selection; the engine a run uses is `validation.engine` at runtime. The
# library default stays kernel-free so a plain `cargo build` needs no C++
# toolchain — see docs/contracts/validation-default.md.
default = []
# Cross-crate tests and benchmarks that deliberately exercise low-level
# follower-free mutation. Any downstream can enable this feature; the
# production-build guarantee is in-workspace, where only dev-dependencies
# select it and the g17 gate fails if it leaks into a shipped target.
test-seam = ["bitcoin-rs-storage/test-seam"]
kernel = ["bitcoin-rs-consensus/kernel"]
rocksdb = [
    "bitcoin-rs-storage/rocksdb",
    "bitcoin-rs-utxo/rocksdb",
]
fjall = [
    "bitcoin-rs-storage/fjall",
    "bitcoin-rs-utxo/fjall",
]
redb = [
    "bitcoin-rs-storage/redb",
    "bitcoin-rs-utxo/redb",
]

[dependencies]
bitcoin-rs-primitives.workspace = true
bitcoin-rs-consensus.workspace = true
bitcoin-rs-script.workspace = true
bitcoin-rs-storage.workspace = true
bitcoin-rs-utxo.workspace = true
bitcoin-rs-chain.workspace = true

anyhow.workspace = true
arc-swap.workspace = true
bytes.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
hashbrown.workspace = true
metrics.workspace = true
parking_lot.workspace = true
quanta.workspace = true
rayon.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
bitcoin-rs-chain = { workspace = true, features = ["test-seam"] }
bitcoin-rs-storage = { workspace = true, features = ["test-seam"] }
bitcoin-rs-chainstate = { workspace = true, features = ["test-seam"] }
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(not(windows))'.dependencies]
rustix.workspace = true
