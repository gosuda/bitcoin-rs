[package]
name = "bitcoin-rs-index"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: index"

[lints]
workspace = true

[features]
default = []
# Exposes cross-crate test seams without widening the production API.
test-seam = []
rocksdb = [
    "bitcoin-rs-storage/rocksdb",
    "bitcoin-rs-chain/rocksdb",
    "bitcoin-rs-utxo/rocksdb",
]
fjall = [
    "bitcoin-rs-storage/fjall",
    "bitcoin-rs-chain/fjall",
    "bitcoin-rs-utxo/fjall",
]
redb = [
    "bitcoin-rs-storage/redb",
    "bitcoin-rs-chain/redb",
    "bitcoin-rs-utxo/redb",
]

[dependencies]
bitcoin-rs-primitives.workspace = true
bitcoin-rs-storage = { workspace = true, default-features = false }
bitcoin-rs-chain.workspace = true
bitcoin-rs-utxo.workspace = true
arc-swap.workspace = true
compact_str.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
sha2.workspace = true
hashbrown.workspace = true
zerocopy.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true

[dev-dependencies]
bitcoin-rs-chain = { workspace = true, features = ["test-seam"] }
proptest.workspace = true
serde_json.workspace = true
criterion.workspace = true
tempfile = ">=3.20.0, <4"
bitcoin.workspace = true

[[bench]]
name = "history_resolve"
harness = false
required-features = ["rocksdb"]
