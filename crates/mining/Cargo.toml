[package]
name = "bitcoin-rs-mining"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: mining"

[lints]
workspace = true

[dependencies]
bitcoin-rs-primitives.workspace = true
bitcoin-rs-consensus.workspace = true
bitcoin-rs-script.workspace = true
bitcoin-rs-chain.workspace = true
bitcoin-rs-mempool.workspace = true
hashbrown.workspace = true
compact_str.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

# Optional Stratum V2 dependencies (behind `sv2` feature).
# Individual protocol crates — avoids stratum-apps' application-level weight.
template_distribution_sv2 = { workspace = true, optional = true }
noise_sv2 = { workspace = true, optional = true }
framing_sv2 = { workspace = true, optional = true }
codec_sv2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
test-seam = []
sv2 = [
    "dep:template_distribution_sv2", "dep:noise_sv2",
    "dep:framing_sv2", "dep:codec_sv2",
    "dep:tokio", "dep:tracing",
]

[dev-dependencies]
serde_json.workspace = true
proptest.workspace = true
bitcoin.workspace = true
criterion.workspace = true
bitcoin-rs-mempool = { workspace = true, features = ["test-seam"] }

[[bench]]
name = "candidate"
harness = false
