[package]
name = "bitcoin-rs-node"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: node"
# Benchmark targets are explicit, including the evidence-tool unit tests.
autobenches = false

[lints]
workspace = true

[features]

# A node is non-functional without a storage backend, and its `NodeStorage` /
# `TxIndexStorage` enums are entirely backend-cfg-gated — with zero backends the
# `match self` arms are non-exhaustive and the crate fails to compile.  fjall
# is the performance-oriented default backend so per-crate `cargo publish` / `cargo check`
# works out of the box.  CI and local dev build via `bin/bitcoin-rs`, whose
# default features are `fjall,redb,zmq` (pure-Rust storage; rocksdb and kernel
# stay selectable but non-default). Full-matrix lanes request the other
# backends explicitly through `bin/bitcoin-rs`'s feature table.
# Note: `--workspace --features "..."` in a virtual workspace (no root [package])
# does NOT forward CLI features to library crates; always use -p when features
# must reach a specific crate.
# `kernel` is capability ("bitcoinkernel support is compiled in"), not
# selection: the engine a run uses is `validation.engine` at runtime. The
# default is kernel-free so the C++ toolchain is opt-in.
default = ["fjall", "zmq"]
# Component crates own the storage-backend fan-out: each of chainstate's and
# index's backend features already forwards to storage + utxo under the same
# feature name, so listing storage/utxo here duplicates those edges.
rocksdb = [
    "bitcoin-rs-chainstate/rocksdb",
    "bitcoin-rs-index/rocksdb",
]
fjall = [
    "bitcoin-rs-chainstate/fjall",
    "bitcoin-rs-index/fjall",
]
redb = [
    "bitcoin-rs-chainstate/redb",
    "bitcoin-rs-index/redb",
]
# chainstate's kernel feature is the kernel-capability propagator for the
# chain stack and already forwards to `bitcoin-rs-consensus/kernel`.
kernel = ["bitcoin-rs-chainstate/kernel"]
zmq = ["bitcoin-rs-rpc/zmq"]

[dependencies]
hashbrown.workspace = true
bitcoin-rs-primitives.workspace = true
bitcoin-rs-consensus.workspace = true
bitcoin-rs-storage.workspace = true
bitcoin-rs-utxo.workspace = true
bitcoin-rs-chain.workspace = true
bitcoin-rs-chainstate.workspace = true
bitcoin-rs-index.workspace = true

bitcoin-rs-mempool.workspace = true
bitcoin-rs-p2p.workspace = true
bitcoin-rs-mining.workspace = true
bitcoin-rs-rpc.workspace = true

bitcoin.workspace = true
bytes.workspace = true
serde.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
compact_str.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
quanta.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rayon.workspace = true
sha2.workspace = true
cap-std.workspace = true

[target.'cfg(not(windows))'.dependencies]
signal-hook = { workspace = true, features = ["iterator"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile.workspace = true
bitcoin-rs-chain = { workspace = true, features = ["test-seam"] }
bitcoin-rs-storage = { workspace = true, features = ["test-seam"] }
bitcoin-rs-p2p = { workspace = true, features = ["test-seam"] }
bitcoin-rs-chainstate = { workspace = true, features = ["test-seam"] }
criterion.workspace = true
sonic-rs.workspace = true
serde_json.workspace = true
toml.workspace = true
rustix.workspace = true
bitcoin-rs-script.workspace = true
bitcoin-rs-mempool = { workspace = true, features = ["test-seam"] }
bitcoin-rs-mining = { workspace = true, features = ["test-seam"] }
bitcoin-rs-rpc = { workspace = true, features = ["test-seam"] }

[[bench]]
name = "sync_pipeline"
harness = false

[[bench]]
name = "chainstate_journal"
harness = false

[[bench]]
name = "evidence"
harness = true
