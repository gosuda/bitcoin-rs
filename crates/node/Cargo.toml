[package]
autotests = false
name = "bitcoin-rs-node"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: node"
# Benchmark targets are explicit, including the evidence-tool unit tests.
autobenches = false

[lints]
workspace = true

[features]

# Exposes the internal `NodeState` composition root to integration tests and
# benchmarks. Production embedders use the typed `Node` surface instead.
test-seam = [
    "bitcoin-rs-execution/test-seam",
    "bitcoin-rs-mempool/test-seam",
    "bitcoin-rs-projection/test-seam",
    "bitcoin-rs-serving/test-seam",
    "dep:toml",
]

# `kernel` is capability ("bitcoinkernel support is compiled in"), not
# selection: the engine a run uses is `validation.engine` at runtime. The
# default is kernel-free so the bitcoinkernel C++ engine is opt-in.
default = ["zmq"]
# chainstate's kernel feature is the kernel-capability propagator for the
# chain stack and already forwards to `bitcoin-rs-consensus/kernel`.
kernel = ["bitcoin-rs-execution/kernel"]
zmq = ["bitcoin-rs-serving/zmq"]
silent-payments = ["bitcoin-rs-serving/silent-payments"]
pool = ["bitcoin-rs-serving/pool"]
pool-sv2 = ["pool", "bitcoin-rs-serving/pool-sv2", "dep:zeroize"]
surrealkv = [
    "bitcoin-rs-storage/surrealkv",
    "bitcoin-rs-execution/surrealkv",
    "bitcoin-rs-projection/surrealkv",
]
mdbx = [
    "bitcoin-rs-storage/mdbx",
    "bitcoin-rs-execution/mdbx",
    "bitcoin-rs-projection/mdbx",
]

[dependencies]
hashbrown.workspace = true
bitcoin-rs-consensus.workspace = true
smallvec.workspace = true
bitcoin-rs-storage.workspace = true
bitcoin-rs-execution.workspace = true
bitcoin-rs-projection.workspace = true
bitcoin-rs-wire.workspace = true

bitcoin-rs-mempool.workspace = true
bitcoin-rs-serving.workspace = true
zeroize = { workspace = true, optional = true }

bitcoin.workspace = true
bytes.workspace = true
serde.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
compact_str.workspace = true
signal-hook = { workspace = true, features = ["iterator"] }
cap-fs-ext.workspace = true
cap-std.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
quanta.workspace = true
thiserror.workspace = true
rayon.workspace = true
sha2.workspace = true
sonic-rs.workspace = true
toml = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
bitcoin-rs-storage = { workspace = true, features = ["test-seam"] }
bitcoin-rs-serving = { workspace = true, features = ["test-seam"] }
bitcoin-rs-wire = { workspace = true, features = ["test-seam"] }
tempfile.workspace = true
proptest.workspace = true
# Own integration tests are separate crates, so they opt into the same
# explicit seam used by the subsystem crates below.
bitcoin-rs-node = { workspace = true, default-features = false, features = ["test-seam"] }
bitcoin-rs-execution = { workspace = true, features = ["test-seam"] }
sonic-rs.workspace = true
toml.workspace = true
rustix.workspace = true
bitcoin-rs-mempool = { workspace = true, features = ["test-seam"] }
# Miner side of the SV2 host-path regression in `pool/sv2.rs`: the same pinned
# SRI release family the pool adapter links, never a second wire version.
binary_sv2.workspace = true
codec_sv2 = { workspace = true, features = ["noise_sv2"] }
common_messages_sv2.workspace = true
mining_sv2.workspace = true
noise_sv2.workspace = true


[[test]]
name = "suite"
path = "tests/suite.rs"

# Self-spawns exact-name crash workers and installs process-global tracing.
[[test]]
name = "crash_recovery"
path = "tests/crash_recovery.rs"

[[test]]
name = "pool_ledger"
path = "tests/pool_ledger.rs"

[[test]]
name = "global_pool"
path = "tests/global_pool.rs"
