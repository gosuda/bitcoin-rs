[package]
autotests = false
name = "bitcoin-rs-projection"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "bitcoin-rs :: projection"

[lints]
workspace = true

[features]
default = []
test-seam = []
silent-payments = ["dep:secp256k1"]
surrealkv = [
    "bitcoin-rs-storage/surrealkv",
]
mdbx = [
    "bitcoin-rs-storage/mdbx",
]

[dependencies]
bitcoin-rs-consensus.workspace = true
bitcoin-rs-execution.workspace = true
bitcoin-rs-storage = { workspace = true, default-features = false }
arc-swap.workspace = true
compact_str.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
sha2.workspace = true
tempfile.workspace = true
bitcoin.workspace = true
bitcoin_hashes.workspace = true
secp256k1 = { workspace = true, optional = true }
hashbrown.workspace = true
zerocopy.workspace = true
serde.workspace = true
sonic-rs.workspace = true
metrics.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true

[dev-dependencies]
bitcoin-rs-storage = { workspace = true, features = ["test-seam"] }
bitcoin-rs-execution = { workspace = true, features = ["test-seam"] }
bitcoin-rs-consensus = { workspace = true, features = ["test-seam"] }
proptest.workspace = true
proptest-state-machine.workspace = true
sonic-rs.workspace = true
tempfile.workspace = true


[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "parse_once"
path = "tests/parse_once.rs"
